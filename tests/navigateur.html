<!-- Essai de bout en bout dans un vrai navigateur : charge la page, puis
     - Pouilly-en-Auxois (photo imajbox, position RTK) : précision vérifiée, hauteur de caméra
       d'après l'altitude GPS, capture HD (Pyodide d'arrière-plan) ;
     - Montbard (photo imajbox) : inclinaison automatique (Pyodide d'arrière-plan) ;
     - Dijon (photo grand public) : largeur de chaussée, recalage d'un point, longueur,
       hauteur, triangulation depuis deux photos, calage de l'inclinaison.
     Journal sous la page et sur la sortie de tools/serveur-essai.py. Voir CLAUDE.md pour le
     lancer dans Chrome sans fenêtre. -->

<style>body{margin:0}iframe{border:0;display:block}</style>
<script>  // calage enregistré par un essai précédent : effacé, l'inclinaison automatique est recalculée
try { localStorage.removeItem("web-measures/calage"); } catch { /* sans stockage */ }
</script>
<iframe id="f" src="../index.html" style="width:1400px;height:900px"></iframe><pre id="log"></pre>
<script>
// Journal : sous la page, et envoyé au serveur d'essai (tools/serveur-essai.py), en temps réel
const log = (t) => {
  document.getElementById("log").textContent += t + "\n";
  fetch("/journal", { method: "POST", body: String(t) }).catch(() => {});
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// Contrôles : valeur comparée à l'attendu, avec une tolérance ; échecs journalisés (« ÉCHEC ») et
// comptés, bilan avant « FIN » (« ERREUR » s'il y en a : le serveur d'essai s'arrête)
let failures = 0, checks = 0;
const expect = (what, ok, detail = "") => {
  checks++;
  if (!ok) {
    failures++;
    log("ÉCHEC " + what + (detail ? " : " + detail : ""));
  }
};
const near = (what, value, expected, tol) =>
  expect(what, Math.abs(value - expected) <= tol, `${value} au lieu de ${expected.toFixed(3)} (±${tol})`);
const metresIn = (text) => Number(((text || "").match(/(\d+,\d+) m\b/) || [])[1]?.replace(",", "."));
const verdict = () => log(failures ? `ERREUR ${failures} contrôle(s) sur ${checks} en échec` : `contrôles : ${checks} réussis`);
const DIJON = ["33565d3f-5e27-47fb-9137-ba4de564530d", "a3996fff-7cf7-44b4-8c54-afd556f2632c"];
const POUILLY = "cd8cf3a0-6567-40f0-8805-94172a5dfc3c";
const PONT = "b40045bd-1fc5-4a7a-a5bd-7b7952902a1c";  // CD21, tablier de la RD111 au-dessus de l'A6 (Beaune)
const SANS_LIDAR = "eb5ece3a-381a-47f6-963e-6f3d7ad0029b";  // CD21, pont Camille Baudry (D116), LiDAR HD pas publié
const APRES_PONT = "2f6bf2e3-4818-4659-8b9a-84190cc5af18";  // même séquence, 70 m après le pont
const MONTBARD = "f533e240-7d37-40ef-babc-1d37140dc5d2";  // plugin : inclinaison 1,95° vers 219° (±0,22°)

async function until(test, ms, what) {
  const t0 = Date.now();
  while (!test()) {
    if (Date.now() - t0 > ms) throw new Error("délai dépassé : " + what);
    await sleep(250);
  }
  return Date.now() - t0;
}

async function feature(id) {
  const r = await fetch("https://api.panoramax.xyz/api/search?ids=" + id);
  return (await r.json()).features[0];
}

(async () => {
  const w = document.getElementById("f").contentWindow;
  log("pyodide " + await until(() => w.mesures && w.mesures.app, 120000, "Pyodide") + " ms");
  const app = w.mesures.app;
  const state = () => JSON.parse(app.state());
  const doc = w.document;
  // Réglages par défaut (CD21, instance IGN) : fenêtre fermée ; l'essai ouvre aussi des photos
  // grand public (Dijon, alerte RTK) : méta-catalogue et tous producteurs
  doc.querySelector("#reglages-defaut")?.close();
  {  // Première visite : trois bulles après les réglages par défaut, puis plus jamais
    await sleep(100);  // événement « close » de la fenêtre des réglages
    const bubble = doc.querySelector("#visite"), seen = [];
    for (let i = 0; i < 3 && bubble.open; i++) {
      const target = doc.querySelector(".visite-cible"), box = bubble.getBoundingClientRect();
      seen.push(`${target?.id} « ${bubble.querySelector("p").textContent.slice(0, 40)}… » (${Math.round(box.left)}, ${Math.round(box.top)})`);
      bubble.querySelector(".oui").click();
      await sleep(100);
    }
    log("visite : " + seen.join(" | "));
    expect("visite : carte, Mesure, résultats", seen.map((t) => t.split(" ")[0]).join() === "carte,mesure,resultats");
    expect("visite finie : bulle fermée, plus de cible", !bubble.open && !doc.querySelector(".visite-cible"));
    expect("visite notée faite", w.localStorage.getItem("web-measures/visite") === "1");
  }
  doc.querySelector("#instance").value = "";
  doc.querySelector("#instance").dispatchEvent(new Event("change"));
  doc.querySelector("#producteur").value = "";
  doc.querySelector("#producteur").dispatchEvent(new Event("change"));
  const open = async (id) => {
    w.mesures.openPhoto(await feature(id));
    try {
      await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === id, 30000, "photo affichée");
    } catch (e) {
      const psv = w.mesures.psv;
      log("visionneuse : affichée " + psv?.getPictureMetadata?.()?.id + " · en chargement " + psv?.getPictureId?.()
        + " · attribut " + doc.querySelector("#visionneuse").getAttribute("picture")
        + " · même moteur : " + (doc.querySelector("#visionneuse").psv === psv)
        + " · moteur de l'élément : " + doc.querySelector("#visionneuse").psv?.getPictureMetadata?.()?.id);
      throw e;
    }
  };
  // Clic dans la visionneuse, tel que le moteur 360° le signale
  const psvClick = (yaw, pitch) => {
    const event = new Event("click");
    event.data = { yaw, pitch, rightclick: false };
    w.mesures.psv.dispatchEvent(event);
  };

  log("bouton Mesure désactivé : " + app.status());
  doc.querySelector("#mesure").click();
  log("bouton Mesure activé : " + app.status());

  // Pouilly (imajbox) ------------------------------------------------------------------------
  await open(POUILLY);
  await until(() => !state().quality.includes("vérification en cours"), 60000, "précision");
  log("== Pouilly : " + state().quality);
  log("vérification : " + (app.quality ? JSON.stringify(app.quality.toJs({ dict_converter: Object.fromEntries })) : "aucune"));
  log("hauteur proposée : " + JSON.stringify(state().camera));
  log("état : " + state().quality);

  const Calcul = w.eval("Calcul");
  const params = JSON.parse(app.capture_args(0.0, -0.1, 60.0));
  const bytes = new Uint8Array(await (await fetch(params.href)).arrayBuffer());
  const t0 = Date.now();
  const jpeg = await Calcul.capture(params, bytes);
  log("capture HD : " + Math.round(jpeg.length * 0.75 / 1024) + " Ko en " + (Date.now() - t0) + " ms · " + params.caption);

  // Montbard (imajbox) : inclinaison automatique, calculée en arrière-plan
  await open(MONTBARD);
  app._check_tilt();  // lancée au premier clic sur la photo depuis la version 0.2.6
  log("== Montbard : inclinaison auto en " + await until(() => state().quality.includes("inclinaison calée"),
    120000, "inclinaison") + " ms");
  log("état : " + state().quality);
  log("calage : " + state().calibration);

  // Pont de la RD111 (BD TOPO) : « Sur un pont » proposé, coché sur « Oui »
  {  // photo par défaut sur le pont Joly : nom de l'ouvrage (BD TOPO), le tronçon ne portant que celui de la rue
    await open("7752eb30-a733-4213-b57a-5d5086e261a4");
    let name = "";
    try { await until(() => (name = doc.querySelector("#chute .pont")?.textContent || "").startsWith("Pont J"), 30000, "nom du pont Joly"); }
    catch (e) { log(String(e)); }
    let over = "";  // ligne sous le nom : ce que le pont franchit
    try { await until(() => (over = doc.querySelector("#chute").textContent.split("\n")[1] || "").startsWith("Au-dessus"), 30000, "ce que franchit le pont Joly"); }
    catch (e) { log(String(e)); }
    log("pont de la photo par défaut : " + name + " · " + over);
    expect("nom du pont tiré de l'ouvrage BD TOPO", name === "Pont Joly (D954)", name);
    expect("pont Joly au-dessus de l'Armançon", over === "Au-dessus de l'Armançon", over);
    // Séquence vérifiée RTK depuis le pont : portion 150 photos avant (après : au-delà de la fin, HTTP 404)
    try { await until(() => /Position GPS (non )?vérifiée/.test(state().quality), 90000, "vérification au pont Joly"); }
    catch (e) { log(String(e)); }
    log("pont Joly : " + state().computed);
    expect("pont Joly : séquence vérifiée RTK", state().quality.includes("Position GPS vérifiée"));
    // Favori : nommé « commune – voie – PR – pont », rouvre la photo, retiré par ×
    doc.querySelector("#ajouter-favori").click();
    await until(() => doc.querySelector("#favoris li"), 15000, "favori ajouté");
    const fav = doc.querySelector("#favoris .aller-favori").textContent;
    log("favori : " + fav);
    expect("favori nommé commune – voie – PR – pont", /^Semur-en-Auxois – D954 – PR \d+ \+\d{4} – Pont Joly$/.test(fav), fav);
    doc.querySelector("#ajouter-favori").click();
    await sleep(500);
    expect("favori pas en double", doc.querySelectorAll("#favoris li").length === 1);
    expect("favori gardé dans le navigateur", JSON.parse(w.localStorage.getItem("web-measures/favoris"))[0]?.id === "7752eb30-a733-4213-b57a-5d5086e261a4");
    await open(MONTBARD);
    doc.querySelector("#favoris .aller-favori").click();
    await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === "7752eb30-a733-4213-b57a-5d5086e261a4", 30000, "photo du favori");
    expect("favori : photo rouverte", true);
    const star = doc.querySelector("#etoile-favori");
    expect("étoile pleine sur la photo en favori", !star.hidden && star.textContent === "★" && star.getAttribute("aria-pressed") === "true");
    await open(MONTBARD);
    expect("étoile vide sur une autre photo", star.textContent === "☆");
    star.click();
    await until(() => doc.querySelectorAll("#favoris li").length === 2, 15000, "favori par l'étoile");
    expect("étoile : favori ajouté, étoile pleine", star.textContent === "★");
    star.click();
    expect("étoile : favori retiré, étoile vide", doc.querySelectorAll("#favoris li").length === 1 && star.textContent === "☆");
    doc.querySelector("#favoris .effacer-resultat").click();
    expect("favori retiré, aide de retour", !doc.querySelector("#favoris li") && getComputedStyle(doc.querySelector("#favoris .aide")).display !== "none");
  }
  const pont = doc.querySelector("#alerte-pont");
  if (pont.open) { log("pont déjà proposé : " + pont.querySelector("p").textContent.slice(0, 90)); pont.close("non"); }  // photo par défaut sur le pont Joly (D954)
  await open(PONT);
  try { await until(() => pont.open, 30000, "proposition pont"); } catch (e) { log(String(e)); }
  expect("pont proposé", pont.open && pont.textContent.includes("sur un pont (D111)"));
  log("pont : " + pont.querySelector("p").textContent);
  {  // fenêtre centrée sur la visionneuse, boutons groupés au centre
    const mid = (r) => [(r.left + r.right) / 2, (r.top + r.bottom) / 2];
    const [dx, dy] = mid(pont.getBoundingClientRect()), [vx, vy] = mid(doc.querySelector("#vue").getBoundingClientRect());
    const buttons = [...pont.querySelectorAll("form button")].map((b) => b.getBoundingClientRect());
    const group = (buttons[0].left + buttons.at(-1).right) / 2;
    expect("fenêtre centrée sur la visionneuse", Math.abs(dx - vx) < 2 && Math.abs(dy - vy) < 2,
      `${Math.round(dx)},${Math.round(dy)} au lieu de ${Math.round(vx)},${Math.round(vy)}`);
    expect("boutons centrés", Math.abs(group - dx) < 2, `${Math.round(group)} au lieu de ${Math.round(dx)}`);
    const border = (sel) => w.getComputedStyle(pont.querySelector(sel)).borderTopColor;
    expect("Oui vert, Non rouge", border("button.oui") === "rgb(46, 204, 64)" && border("button.non") === "rgb(229, 57, 53)",
      border("button.oui") + " / " + border("button.non"));
  }
  pont.querySelector("button[value=oui]").click();
  try { await until(() => doc.querySelector("#pont").checked, 5000, "case cochée"); } catch (e) { log(String(e)); }
  expect("case « Sur un pont » cochée", doc.querySelector("#pont").checked && app.bridge);
  // Hauteur de chute du pont en haut à gauche de la visionneuse (tablier RTK moins MNT LiDAR HD : ~6,3 m au-dessus de l'A6)
  try { await until(() => doc.querySelector("#chute")?.textContent.includes("max"), 30000, "hauteur de chute"); } catch (e) { log(String(e)); }
  const chute = doc.querySelector("#chute");
  log("chute : " + chute?.textContent + " · " + chute?.title);
  near("hauteur de chute du pont D111", metresIn(chute?.textContent), 6.3, 0.5);
  expect("pont sans nom BD TOPO : sa route", chute?.textContent.startsWith("Pont de la D111"), chute?.textContent);
  // Étiquette du lieu : route et PR ; refus en rafale de la Géoplateforme (HTTP 429) : texte partiel
  // non gardé, redemandé
  try { await until(() => /D111 – PR/.test(doc.querySelector("#lieu").textContent), 30000, "lieu"); } catch (e) { log(String(e)); }
  log("lieu : " + doc.querySelector("#lieu").textContent);
  expect("lieu : route et PR", /^D111 – PR \d+ \+\d{4}/.test(doc.querySelector("#lieu").textContent));
  {
    // Point de la D111 dans une maille pas encore lue : les tronçons refusés (premier envoi et
    // deux nouveaux essais) puis acceptés ; un refus isolé est retenté sans rien perdre
    const realFetch = w.fetch;
    let refused = 0, wfs = 0;
    w.fetch = (url, ...rest) => {
      if (String(url).includes("/wfs/")) wfs++;
      return (String(url).includes("troncon_de_route") && refused++ < 3)
        ? Promise.resolve(new Response("", { status: 429 })) : realFetch(url, ...rest);
    };
    const [lon, lat] = [4.85867, 47.01648];
    const Lieu = w.eval("Lieu");
    const first = await Lieu.describe(lon, lat), second = await Lieu.describe(lon, lat);
    log(`lieu refusé puis redemandé : « ${first.text} » (${first.complete}) puis « ${second.text} » (${second.complete})`);
    expect("lieu : texte partiel non gardé, complet ensuite", !first.complete && second.complete
      && second.text.startsWith("D111") && !first.text.startsWith("D111"));
    // Photo voisine (5 m) : tronçons, section et PR déjà lus, aucune requête WFS
    wfs = 0;
    const near = await Lieu.describe(lon + 0.00005, lat + 0.00002);
    log(`lieu voisin : « ${near.text} », ${wfs} requête(s) WFS`);
    expect("lieu voisin sans requête", near.complete && near.text.startsWith("D111 – PR") && wfs === 0);
    refused = 2;  // un seul refus, retenté
    const other = await Lieu.describe(4.86838, 47.01255);
    w.fetch = realFetch;
    log(`lieu après un refus retenté : « ${other.text} » (${other.complete})`);
    expect("lieu : refus isolé retenté", other.complete && other.text.startsWith("D111"));
  }

  // 70 m après le pont : décocher la case proposé, décochée sur « Oui »
  await open(APRES_PONT);
  try { await until(() => pont.open, 30000, "sortie du pont"); } catch (e) { log(String(e)); }
  expect("sortie du pont proposée", pont.open && pont.textContent.includes("n'est plus sur un pont"));
  log("sortie : " + pont.querySelector("p").textContent);
  pont.querySelector("button[value=oui]").click();
  try { await until(() => !doc.querySelector("#pont").checked, 5000, "case décochée"); } catch (e) { log(String(e)); }
  expect("case décochée", !doc.querySelector("#pont").checked && !app.bridge);

  // Hors LiDAR HD : position vérifiée sur le RGE ALTI, pas d'alerte « sans RTK » ; photo sur un pont
  await open(SANS_LIDAR);
  try { await until(() => /vérifiée \(|non vérifiée/.test(state().quality), 60000, "vérification RGE ALTI"); } catch (e) { log(String(e)); }
  log("hors LiDAR HD : " + state().quality);
  {  // fiche de la photo : précision annoncée, puis calculée sur la même ligne
    const row = [...doc.querySelectorAll("#fiche dt")].find((dt) => dt.textContent === "Précision GPS annoncée");
    const text = row?.nextElementSibling?.textContent || "";
    log("fiche : Précision GPS annoncée " + text);
    expect("fiche : précision annoncée et calculée", /^2 m · calculée ±0,10 m \(hauteur de caméra constante à \d+ cm, RGE ALTI\)/.test(text), text);
  }
  expect("hors LiDAR HD : vérifiée sur le RGE ALTI", state().quality.includes("Position GPS vérifiée")
    && state().quality.includes("RGE ALTI"));
  try { await until(() => pont.open, 30000, "pont Camille Baudry"); } catch (e) { log(String(e)); }
  expect("hors LiDAR HD : pas d'alerte RTK, pont proposé", !doc.querySelector("#alerte-rtk").open && pont.open && pont.textContent.includes("D116"));
  pont.querySelector("button[value=non]").click();
  await sleep(300);

  // Dijon ----------------------------------------------------------------------------------
  await open(DIJON[0]);
  // Photo grand public, sans RTK : fenêtre d'alerte une fois la vérification faite, une seule fois
  const rtk = doc.querySelector("#alerte-rtk");
  try { await until(() => rtk.open, 30000, "alerte RTK"); } catch (e) { log(String(e)); }
  expect("alerte RTK affichée", rtk.open && rtk.textContent.includes("Un GPS avec corrections RTK est requis"));
  {
    const r = rtk.getBoundingClientRect(), v = doc.querySelector("#vue").getBoundingClientRect();
    expect("alerte RTK centrée sur la visionneuse", Math.abs((r.left + r.right - v.left - v.right) / 2) < 2
      && Math.abs((r.top + r.bottom - v.top - v.bottom) / 2) < 2);
  }
  log("alerte RTK : " + rtk.querySelector("p").textContent);
  rtk.close();
  // Bouton « Mesure » : un clic dans la photo prend un point, sans changer de photo (calage de
  // l'inclinaison : flèches masquées)
  doc.querySelector("#mode").value = "tilt";
  doc.querySelector("#mode").dispatchEvent(new Event("change"));
  log("== clic dans la photo, Mesure activée : " + app.status());
  const before = w.mesures.psv.getPictureMetadata?.()?.id;
  psvClick(-0.45, -0.3);
  await until(() => app.status().includes("sommet"), 15000, "clic de mesure");
  const box = w.mesures.psv.container;
  log("point pris · photo inchangée : " + (w.mesures.psv.getPictureMetadata?.()?.id === before)
    + " · flèches masquées : " + [...box.querySelectorAll(".psv-virtual-tour-arrows")].every((a) => a.style.visibility === "hidden")
    + " · pointeur réticule : " + !!box.getRootNode().getElementById?.("mesure-pointeur")
    + " · liseré " + doc.querySelector("#vue").className + " · cercle orange : "
    + (box.getRootNode().getElementById?.("mesure-pointeur")?.textContent.includes("ff6f00")));
  app.clear();
  doc.querySelector("#mesure").click();
  log("Mesure désactivée : " + app.status() + " · pointeur réticule : "
    + !!box.getRootNode().getElementById?.("mesure-pointeur"));
  log("clic ignoré par le calcul : " + app.click(-0.45, -0.3));
  doc.querySelector("#mesure").click();

  doc.querySelector("#mode").value = "tri";  // par la liste : flèches rétablies
  doc.querySelector("#mode").dispatchEvent(new Event("change"));
  log("== triangulation : " + app.status());
  psvClick(0.9, 0.0);  // visée au clic dans la photo
  log(doc.querySelector("#statut").textContent);
  log("repère de la visée : " + JSON.parse(app.viewer_marks()).length + " · flèches visibles : "
    + [...box.querySelectorAll(".psv-virtual-tour-arrows")].every((a) => a.style.visibility !== "hidden"));
  // Mesure désactivée pour changer de photo : la visée reste
  doc.querySelector("#mesure").click();
  w.mesures.openPhoto(await feature(DIJON[1]));
  doc.querySelector("#mesure").click();
  log("mesure désactivée puis réactivée : " + app.status() + " · rappel : " + doc.querySelector("#mode-mesure").textContent);
  // Tant que la visionneuse montre l'ancienne photo, la visée est refusée
  psvClick(0.95, 0.0);
  log("viser pendant le chargement : " + doc.querySelector("#statut").textContent);
  await until(() => w.mesures.psv.getPictureMetadata?.()?.id === DIJON[1], 30000, "photo suivante");
  await sleep(1000);
  psvClick(0.95, 0.0);
  log(doc.querySelector("#statut").textContent);
  log("cartes : " + JSON.parse(app.map_geojson()).features.filter((f) => f.properties.kind === "visee").length + " visées");
  log("garder : " + app.keep_point());
  // Flèche de la visionneuse cliquée à la souris en triangulation : elle change de photo
  await until(() => box.querySelector(".psv-virtual-tour-link"), 15000, "flèches");
  const link = box.querySelector(".psv-virtual-tour-link");
  const r = link.getBoundingClientRect();
  const at = { bubbles: true, composed: true, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2, button: 0 };
  link.dispatchEvent(new w.MouseEvent("mousedown", at));
  link.dispatchEvent(new w.MouseEvent("mouseup", at));
  try {
    await until(() => w.mesures.psv.getPictureMetadata?.()?.id !== DIJON[1], 20000, "flèche");
    log("flèche en triangulation : photo changée · visées " + JSON.parse(app.map_geojson()).features.filter((f) => f.properties.kind === "visee").length);
  } catch (e) {
    log("flèche en triangulation : photo inchangée (" + e.message + ")");
  }

  // Hauteur : point de référence triangulé au pied de l'objet, puis pied et sommet dans la photo.
  // Cible fictive à 6 m sur le côté, entre les deux photos de Dijon : directions calculées
  doc.querySelector("#mode").value = "height";
  doc.querySelector("#mode").dispatchEvent(new Event("change"));
  log("== hauteur avec point de référence : " + app.status());
  const photos = [await feature(DIJON[0]), await feature(DIJON[1])];
  const metres = ([lon, lat], [lon0, lat0]) => [(lon - lon0) * 111320 * Math.cos(lat0 * Math.PI / 180), (lat - lat0) * 111320];
  const [p0, p1] = photos.map((f) => f.geometry.coordinates);
  const mid = [(p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2];
  const along = Math.atan2(...metres(p1, p0));  // cap de la rue (radians)
  const target = [mid[0] + 6 * Math.cos(along) / (111320 * Math.cos(mid[1] * Math.PI / 180)), mid[1] - 6 * Math.sin(along) / 111320];
  const yawTo = (f) => {
    const [x, y] = metres(target, f.geometry.coordinates);
    return Math.atan2(x, y) - f.properties["view:azimuth"] * Math.PI / 180;
  };
  for (const f of photos) {
    w.mesures.openPhoto(f);
    await until(() => w.mesures.psv.getPictureMetadata?.()?.id === f.id, 30000, "photo " + f.id);
    await sleep(1000);
    psvClick(yawTo(f), -0.3);
  }
  log("visées : " + app.status() + " · bouton Valider affiché : " + !doc.querySelector("#garder").hidden);
  doc.querySelector("#garder").click();
  log("validé : " + doc.querySelector("#statut").textContent + " · flèches masquées (étape 2) : "
    + [...box.querySelectorAll(".psv-virtual-tour-arrows")].every((a) => a.style.visibility === "hidden")
    + " · rappel : " + doc.querySelector("#mode-mesure").textContent);
  const ref = JSON.parse(app.map_geojson()).features.filter((f) => f.properties.kind === "triangule").pop().geometry.coordinates;
  const d = Math.hypot(...metres(ref, p1));
  log("point de référence à " + d.toFixed(2) + " m de la photo (cible à " + Math.hypot(...metres(target, p1)).toFixed(2) + " m)");
  const yawRef = Math.atan2(...metres(ref, p1)) - photos[1].properties["view:azimuth"] * Math.PI / 180;
  psvClick(yawRef, 0.25);  // seul le sommet : le pied est la visée du point depuis cette photo (-0,3)
  await until(() => doc.querySelector("#statut").textContent.startsWith("Hauteur :"), 15000, "hauteur");
  log("résultat : " + doc.querySelector("#statut").textContent);
  near("hauteur (Dijon)", metresIn(doc.querySelector("#statut").textContent), d * (Math.tan(0.25) + Math.tan(0.3)), 0.02);
  expect("flèches masquées après la hauteur", [...box.querySelectorAll(".psv-virtual-tour-arrows")].every((a) => a.style.visibility === "hidden"));
  log("attendu sans inclinaison : " + (d * (Math.tan(0.25) + Math.tan(0.3))).toFixed(2) + " m · ensuite : " + app.status().slice(0, 60)
    + " · flèches masquées : " + [...box.querySelectorAll(".psv-virtual-tour-arrows")].every((a) => a.style.visibility === "hidden"));

  // Photo affichée stable (fin d'un chargement) : l'objet vertical se clique sur une seule photo
  await sleep(1500);
  await until(() => w.mesures.psv.getPictureMetadata?.()?.id === app.item?.get("id"), 20000, "photo stable");
  log("== calage inclinaison : " + app.set_mode("tilt"));
  psvClick(0.62, -0.12);
  psvClick(0.64, 0.35);  // sommet un peu à côté
  await sleep(300);
  // Pied et sommet affichés (croix rouge clair, trait bleu clair), pas encore calés : bouton de validation
  const tiltMark = () => JSON.parse(app.viewer_marks()).filter((m) => m.calage).pop();
  expect("objet vertical affiché avant validation", tiltMark()?.points.length === 2);
  expect("pas encore calé avant validation", !state().calibration.includes("objet"));
  expect("bouton « Valider l'objet vertical » affiché", !doc.querySelector("#valider-objet").hidden);
  psvClick(0.64, 0.35);  // clic sur la croix du sommet : sélectionnée
  expect("sommet sélectionné", tiltMark().points[1][2] === true);
  psvClick(0.625, 0.35);  // nouvelle position
  expect("sommet déplacé", Math.abs(tiltMark().points[1][0] - 0.625) < 1e-6 && !tiltMark().points[1][2]);
  doc.querySelector("#valider-objet").click();
  await sleep(300);
  log("validé : " + app.status());
  expect("bouton masqué après validation", doc.querySelector("#valider-objet").hidden);
  expect("croix effacées après validation", !tiltMark());
  log("calage : " + state().calibration);
  log("résultats : " + JSON.parse(app.results()).map((r) => r.text).join(" | "));
  // Commentaire : gardé pendant les rafraîchissements, exporté
  const input = doc.querySelector("#resultats ol input");
  input.focus();
  input.value = "bordure abîmée";
  input.dispatchEvent(new Event("input"));
  doc.querySelector("#effacer").click();  // rafraîchit la page
  log("commentaire après rafraîchissement : " + doc.querySelector("#resultats ol input").value
    + " · exporté : " + app.export_csv().includes("bordure abîmée"));
  log("csv :\n" + app.export_csv());

  // Interface : réglages propres au mode, capture vignette
  const select = (id, value) => {
    doc.querySelector(id).value = value;
    doc.querySelector(id).dispatchEvent(new Event("change"));
  };
  for (const mode of ["road", "height", "tri"]) {
    select("#mode", mode);
    log("réglages " + mode + " : nouveau point de référence " + (doc.querySelector("#nouvelle-reference").hidden ? "masqué" : "affiché"));
  }
  doc.querySelector("#vignette").click();
  await until(() => doc.querySelector("#statut").textContent.includes("Vignette"), 10000, "vignette");
  log("vignette : " + doc.querySelector("#statut").textContent);
  expect("vignette enregistrée", doc.querySelector("#statut").textContent.includes("Vignette enregistrée"));
  // Lecture rapide 2x sur l'instance IGN (réglage par défaut) : ses images sont sur un stockage
  // OVH, qui refuse l'API ; la liste des photos vient du lien « collection » de la fiche
  if (doc.querySelector("#mesure").getAttribute("aria-pressed") === "true") doc.querySelector("#mesure").click();
  doc.querySelector("#instance").value = "https://panoramax.ign.fr";
  doc.querySelector("#instance").dispatchEvent(new Event("change"));
  const ign = (await (await fetch("https://panoramax.ign.fr/api/search?ids=" + PONT)).json()).features[0];
  w.mesures.openPhoto(ign);
  await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === PONT, 30000, "photo IGN affichée");
  await sleep(1000);
  {  // hors mesure : voyants RTK et sol visibles, pas celui de l'inclinaison
    const lights = () => [...doc.querySelectorAll("#voyants li")].map((li) => li.textContent);
    try { await until(() => lights().includes("RTK"), 30000, "voyants hors mesure"); } catch (e) { log(String(e)); }
    log("voyants hors mesure : " + lights().join(", "));
    expect("voyants hors mesure : RTK et sol, sans l'inclinaison", !doc.querySelector("#voyants").hidden
      && lights().includes("RTK") && lights().includes("LiDAR HD") && !lights().includes("Inclinaison"));
  }
  const shown = [];
  const seen = () => { const id = w.mesures.psv.getPictureMetadata?.()?.id; if (id && shown.at(-1) !== id) shown.push(id); };
  doc.querySelector("#lecture-avant").click();  // 1x
  await sleep(300);
  doc.querySelector("#lecture-avant").click();  // 2x
  // Fluidité de la carte : déplacement (px) et durée (ms) de chaque image pendant la lecture
  const frames = [];
  let sampling = true, last = null;
  const sample = (t) => {
    const c = w.mesures.map.getCenter();
    if (last) frames.push({ dt: t - last.t, dx: Math.hypot(...[c.lng - last.c.lng, c.lat - last.c.lat]) });
    last = { t, c };
    if (sampling) w.requestAnimationFrame(sample);
  };
  w.requestAnimationFrame(sample);
  const playStart = Date.now();
  while (Date.now() - playStart < 8000) { seen(); await sleep(100); }
  sampling = false;
  const moves = frames.slice(30).map((f) => f.dx).filter((d) => d > 0);
  const median = moves.sort((x, y) => x - y)[Math.floor(moves.length / 2)] || 0;
  const body = frames.slice(30);
  const stalls = body.filter((f) => f.dx < median * 0.2).length;
  const long = body.filter((f) => f.dt > 50).length;
  // Régularité : écart moyen de la vitesse (déplacement par ms) à sa médiane, sur les images normales
  const speeds = body.filter((f) => f.dt > 0 && f.dt <= 50).map((f) => f.dx / f.dt).sort((x, y) => x - y);
  const vMedian = speeds[Math.floor(speeds.length / 2)] || 1;
  const irregular = speeds.reduce((acc, v) => acc + Math.abs(v - vMedian), 0) / speeds.length / vMedian;
  log(`fluidité carte : ${body.length} images, ${stalls} quasi arrêtées (${Math.round(100 * stalls / body.length)} %), `
    + `vitesse irrégulière à ${Math.round(100 * irregular)} %, `
    + `${long} de plus de 50 ms, la plus longue ${Math.round(Math.max(...body.map((f) => f.dt)))} ms`);
  doc.querySelector("#lecture-pause").click();
  const ranks = await Promise.all(shown.map(async (id) => (await feature(id)).properties["geovisio:rank_in_collection"]));
  const steps = ranks.slice(1).map((r, i) => r - ranks[i]);
  log("lecture 2x : " + doc.querySelector("#vitesse-avant").textContent + " · rangs " + ranks.join(" "));
  expect("lecture 2x : une photo sur deux, au moins 3 pas", steps.length >= 4 && steps.slice(-3).every((d) => d === 2),
    "pas " + steps.join(" "));
  {  // 16x : photo en fondu sur la visionneuse (2 s, jusqu'à 50 %), pas avant
    const turbo = doc.querySelector("#turbo"), runs = () => turbo.getAnimations().length;
    const before = [], scanner = [];
    doc.querySelector("#lecture-avant").click();  // après la pause : 1x
    await sleep(1000);
    for (const next of ["2x", "4x", "8x", "16x"]) {
      doc.querySelector("#lecture-avant").click();
      await until(() => doc.querySelector("#vitesse-avant").textContent.includes(next), 10000, "lecture " + next);
      scanner.push(`${next} ${!doc.querySelector("#scanner").hidden}`);
      if (next !== "16x") { before.push(runs()); await sleep(1000); }
    }
    const anim = turbo.getAnimations()[0], peak = anim?.effect.getKeyframes()[1]?.opacity;
    log(`16x : ${doc.querySelector("#vitesse-avant").textContent} · fondu ${anim?.effect.getTiming().duration} ms, jusqu'à ${peak} · image ${turbo.naturalWidth}×${turbo.naturalHeight} · avant ${before}`);
    expect("16x : photo en fondu de 3 s jusqu'à 50 %", anim && anim.effect.getTiming().duration === 3000 && Number(peak) === 0.5
      && turbo.naturalWidth > 0 && before.every((n) => n === 0));
    const bars = doc.querySelector("#scanner"), block = doc.querySelector("#lecteur").getBoundingClientRect(), r = bars.getBoundingClientRect();
    log(`barres : ${scanner.join(", ")} · ${Math.round(r.width)}×${Math.round(r.height)} px au-dessus du lecteur de ${Math.round(block.width)} px (bas ${Math.round(r.bottom)}, lecteur ${Math.round(block.top)})`);
    expect("barres animées à 4x et plus, de la largeur du lecteur, au-dessus", scanner.join() === "2x false,4x true,8x true,16x true"
      && Math.abs(r.width - block.width) < 1 && r.bottom <= block.top && bars.naturalWidth > 0);
    const k2000 = doc.querySelector("#sans-k2000");
    k2000.click();
    expect("« Désactiver K2000 » : barres masquées en 16x", bars.hidden);
    k2000.click();
    expect("K2000 réactivé : barres de retour", !bars.hidden);
    doc.querySelector("#lecture-pause").click();
    await sleep(300);
    expect("barres masquées à la pause", bars.hidden);
  }
  {  // séquence dense passant sur un pont (D905) : vérifiée sur une autre portion, prise par rang
    await open("dea8bdaa-e8e2-4fee-a64f-512ce80b5871");
    try { await until(() => /Position GPS (non )?vérifiée/.test(state().quality), 90000, "vérification sur le pont de la D905"); }
    catch (e) { log(String(e)); }
    log("pont de la D905 : " + state().quality + " · " + state().computed);
    expect("séquence vérifiée RTK depuis le pont", state().quality.includes("Position GPS vérifiée"));
  }
  verdict();
  log("FIN");
})().catch((e) => log("ERREUR " + (e.stack || e)));
</script>
