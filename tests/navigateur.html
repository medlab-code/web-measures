<!-- Essai de bout en bout dans un vrai navigateur : charge la page, puis
     - Pouilly-en-Auxois (photo imajbox, position RTK) : précision vérifiée, hauteur de caméra
       d'après l'altitude GPS, capture HD (Pyodide d'arrière-plan) ;
     - Montbard (photo imajbox) : inclinaison automatique (Pyodide d'arrière-plan) ;
     - Dijon (photo grand public) : largeur de chaussée, recalage d'un point, longueur,
       hauteur, triangulation depuis deux photos, calage de l'inclinaison.
     Journal sous la page et sur la sortie de tools/serveur-essai.py. Voir CLAUDE.md pour le
     lancer dans Chrome sans fenêtre. -->

<style>body{margin:0}iframe{border:0;display:block}</style>
<script>  // calage enregistré par un essai précédent : effacé, l'inclinaison automatique est recalculée
try { localStorage.removeItem("web-measures/calage"); } catch { /* sans stockage */ }
</script>
<iframe id="f" src="../index.html" style="width:1400px;height:900px"></iframe><pre id="log"></pre>
<script>
// Journal : sous la page, et envoyé au serveur d'essai (tools/serveur-essai.py), en temps réel
const log = (t) => {
  document.getElementById("log").textContent += t + "\n";
  fetch("/journal", { method: "POST", body: String(t) }).catch(() => {});
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const DIJON = ["33565d3f-5e27-47fb-9137-ba4de564530d", "a3996fff-7cf7-44b4-8c54-afd556f2632c"];
const POUILLY = "cd8cf3a0-6567-40f0-8805-94172a5dfc3c";
const MONTBARD = "f533e240-7d37-40ef-babc-1d37140dc5d2";  // plugin : inclinaison 1,95° vers 219° (±0,22°)

async function until(test, ms, what) {
  const t0 = Date.now();
  while (!test()) {
    if (Date.now() - t0 > ms) throw new Error("délai dépassé : " + what);
    await sleep(250);
  }
  return Date.now() - t0;
}

async function feature(id) {
  const r = await fetch("https://api.panoramax.xyz/api/search?ids=" + id);
  return (await r.json()).features[0];
}

(async () => {
  const w = document.getElementById("f").contentWindow;
  log("pyodide " + await until(() => w.mesures && w.mesures.app, 120000, "Pyodide") + " ms");
  const app = w.mesures.app;
  const state = () => JSON.parse(app.state());
  const doc = w.document;
  const open = async (id) => {
    w.mesures.openPhoto(await feature(id));
    try {
      await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === id, 30000, "photo affichée");
    } catch (e) {
      const psv = w.mesures.psv;
      log("visionneuse : affichée " + psv?.getPictureMetadata?.()?.id + " · en chargement " + psv?.getPictureId?.()
        + " · attribut " + doc.querySelector("#visionneuse").getAttribute("picture")
        + " · même moteur : " + (doc.querySelector("#visionneuse").psv === psv)
        + " · moteur de l'élément : " + doc.querySelector("#visionneuse").psv?.getPictureMetadata?.()?.id);
      throw e;
    }
  };
  // Clic dans la visionneuse, tel que le moteur 360° le signale
  const psvClick = (yaw, pitch) => {
    const event = new Event("click");
    event.data = { yaw, pitch, rightclick: false };
    w.mesures.psv.dispatchEvent(event);
  };

  log("bouton Mesure désactivé : " + app.status());
  doc.querySelector("#mesure").click();
  log("bouton Mesure activé : " + app.status());

  // Pouilly (imajbox) ------------------------------------------------------------------------
  await open(POUILLY);
  await until(() => !state().quality.includes("vérification en cours"), 60000, "précision");
  log("== Pouilly : " + state().quality);
  log("vérification : " + (app.quality ? JSON.stringify(app.quality.toJs({ dict_converter: Object.fromEntries })) : "aucune"));
  log("hauteur proposée : " + JSON.stringify(state().camera));
  log("état : " + state().quality);

  const Calcul = w.eval("Calcul");
  const params = JSON.parse(app.capture_args(0.0, -0.1, 60.0));
  const bytes = new Uint8Array(await (await fetch(params.href)).arrayBuffer());
  const t0 = Date.now();
  const jpeg = await Calcul.capture(params, bytes);
  log("capture HD : " + Math.round(jpeg.length * 0.75 / 1024) + " Ko en " + (Date.now() - t0) + " ms · " + params.caption);

  // Montbard (imajbox) : inclinaison automatique, calculée en arrière-plan
  await open(MONTBARD);
  log("== Montbard : inclinaison auto en " + await until(() => state().quality.includes("inclinaison calée"),
    120000, "inclinaison") + " ms");
  log("état : " + state().quality);
  log("calage : " + state().calibration);

  // Dijon ----------------------------------------------------------------------------------
  await open(DIJON[0]);
  // Bouton « Mesure » : un clic dans la photo prend un point, sans changer de photo
  log("== clic dans la photo, Mesure activée : " + app.set_mode("road"));
  const before = w.mesures.psv.getPictureMetadata?.()?.id;
  psvClick(-0.45, -0.3);
  await until(() => app.status().startsWith("Cliquez au pied du bord opposé"), 15000, "clic de mesure");
  const box = w.mesures.psv.container;
  log("point pris · photo inchangée : " + (w.mesures.psv.getPictureMetadata?.()?.id === before)
    + " · flèches masquées : " + [...box.querySelectorAll(".psv-virtual-tour-arrows")].every((a) => a.style.visibility === "hidden")
    + " · pointeur réticule : " + !!box.getRootNode().getElementById?.("mesure-pointeur"));
  app.clear();
  doc.querySelector("#mesure").click();
  log("Mesure désactivée : " + app.status() + " · pointeur réticule : "
    + !!box.getRootNode().getElementById?.("mesure-pointeur"));
  log("clic ignoré par le calcul : " + app.click(-0.45, -0.3));
  doc.querySelector("#mesure").click();
  log("== largeur : " + app.set_mode("road"));
  app.click(-0.45, -0.3);
  await until(() => app.status().startsWith("Cliquez au pied du bord opposé"), 15000, "premier bord");
  app.click(0.5, -0.3);
  await until(() => app.status().startsWith("Largeur"), 15000, "largeur");
  log("résultat : " + app.status());
  const h = JSON.parse(app.handles());
  log("recalage : " + app.move_handle(0, h[0][0] + 0.00001, h[0][1]));

  log("== longueur : " + app.set_mode("width"));
  app.click(-1.2, -0.25);
  await sleep(3000);
  app.click(-1.0, -0.25);
  await until(() => app.status().startsWith("Longueur"), 15000, "longueur");
  log("résultat : " + app.status());

  log("== hauteur : " + app.set_mode("height"));
  app.click(0.62, -0.12);
  await until(() => app.status().startsWith("Cliquez au sommet"), 15000, "pied");
  app.click(0.62, 0.35);
  log("résultat : " + app.status());

  doc.querySelector("#mode").value = "tri";  // par la liste : flèches rétablies
  doc.querySelector("#mode").dispatchEvent(new Event("change"));
  log("== triangulation : " + app.status());
  psvClick(0.9, 0.0);  // visée au clic dans la photo
  log(doc.querySelector("#statut").textContent);
  log("repère de la visée : " + JSON.parse(app.viewer_marks()).length + " · flèches visibles : "
    + [...box.querySelectorAll(".psv-virtual-tour-arrows")].every((a) => a.style.visibility !== "hidden"));
  // Changement de photo : tant que la visionneuse montre l'ancienne, la visée est refusée
  w.mesures.openPhoto(await feature(DIJON[1]));
  psvClick(0.95, 0.0);
  log("viser pendant le chargement : " + doc.querySelector("#statut").textContent);
  await until(() => w.mesures.psv.getPictureMetadata?.()?.id === DIJON[1], 30000, "photo suivante");
  await sleep(1000);
  psvClick(0.95, 0.0);
  log(doc.querySelector("#statut").textContent);
  log("cartes : " + JSON.parse(app.map_geojson()).features.filter((f) => f.properties.kind === "visee").length + " visées");
  log("garder : " + app.keep_point());
  // Flèche de la visionneuse cliquée à la souris en triangulation : elle change de photo
  await until(() => box.querySelector(".psv-virtual-tour-link"), 15000, "flèches");
  const link = box.querySelector(".psv-virtual-tour-link");
  const r = link.getBoundingClientRect();
  const at = { bubbles: true, composed: true, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2, button: 0 };
  link.dispatchEvent(new w.MouseEvent("mousedown", at));
  link.dispatchEvent(new w.MouseEvent("mouseup", at));
  try {
    await until(() => w.mesures.psv.getPictureMetadata?.()?.id !== DIJON[1], 20000, "flèche");
    log("flèche en triangulation : photo changée · visées " + JSON.parse(app.map_geojson()).features.filter((f) => f.properties.kind === "visee").length);
  } catch (e) {
    log("flèche en triangulation : photo inchangée (" + e.message + ")");
  }

  log("== calage inclinaison : " + app.set_mode("tilt"));
  app.click(0.62, -0.12);
  log(app.click(0.625, 0.35));
  log("calage : " + state().calibration);
  log("résultats : " + JSON.parse(app.results()).map((r) => r.text).join(" | "));
  // Commentaire : gardé pendant les rafraîchissements, exporté
  const input = doc.querySelector("#resultats ol input");
  input.focus();
  input.value = "bordure abîmée";
  input.dispatchEvent(new Event("input"));
  doc.querySelector("#effacer").click();  // rafraîchit la page
  log("commentaire après rafraîchissement : " + doc.querySelector("#resultats ol input").value
    + " · exporté : " + app.export_csv().includes("bordure abîmée"));
  log("csv :\n" + app.export_csv());

  // Interface : réglages propres au mode, capture vignette
  const select = (id, value) => {
    doc.querySelector(id).value = value;
    doc.querySelector(id).dispatchEvent(new Event("change"));
  };
  for (const mode of ["road", "height", "tri", "camera"]) {
    select("#mode", mode);
    const shown = [...doc.querySelectorAll("header .option")].filter((o) => !o.hidden)
      .map((o) => [...o.querySelectorAll("input, select, button")].map((e) => e.id).join("+"));
    log("réglages " + mode + " : " + (shown.join(", ") || "aucun"));
  }
  doc.querySelector("#vignette").click();
  await until(() => doc.querySelector("#statut").textContent.includes("Vignette"), 10000, "vignette");
  log("vignette : " + doc.querySelector("#statut").textContent);
  log("FIN");
})().catch((e) => log("ERREUR " + (e.stack || e)));
</script>
