<!-- Cadastre sur la mini-carte (#36, Carte.setCadastre) : réglage coché, parcelles en tuiles, bornes de propriété
     autour de la photo, au zoom 18. Photo de Pouilly-en-Auxois (#photos=id,… : d'autres) ;
     chaque carte part dans le journal en PNG ; #fond=mnh (ou autre) : sur ce fond. Lancer comme tests/navigateur.html. -->
<script>try {
  localStorage.clear();
  localStorage.setItem("web-measures/cadastre", "1");
  const fond = /[#&]fond=([a-z]+)/.exec(location.hash)?.[1];  // #fond=mnh : sur un autre fond de carte
  if (fond) localStorage.setItem("web-measures/fond", fond);
} catch {}</script>
<iframe id="f" src="../index.html" style="width:1400px;height:1000px"></iframe>
<script src="commun.js"></script>
<script>
const { log, sleep, until, soon, ready, expect, fin } = Essai;
const IDS = /#photos=([^&]+)/.exec(location.hash)?.[1].split(",") || ["1108ca14-6669-49e8-a26a-955becc79e81"];
(async () => {
  const w = document.getElementById("f").contentWindow;
  try {
    await ready(w);
    const doc = w.document;
    doc.querySelector("#reglages-defaut")?.close();
    expect("réglage « Cadastre » coché", doc.querySelector("#cadastre").checked);
    for (const id of IDS) {
      const f = (await (await fetch("https://panoramax.ign.fr/api/search?ids=" + id)).json()).features[0];
      w.mesures.openPhoto(f);
      await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === id, 30000, "photo");
      // mini-carte au zoom 18 sur la photo : image prise pendant un rendu (sinon tampon WebGL vide)
      const map = w.mesures.map;
      map.jumpTo({ center: f.geometry.coordinates, zoom: 18 });
      // tuiles et sections lues (pas « idle » : la carte ne s'arrête jamais de se redessiner)
      await soon(() => map.areTilesLoaded() && map.querySourceFeatures("cadastre", { sourceLayer: "localisant" }).length > 0, 15000);
      await sleep(500);  // dessin des tuiles reçues
      const shot = await new Promise((r) => { map.once("render", () => r(map.getCanvas().toDataURL("image/png"))); map.triggerRepaint(); });
      await log(`IMAGE carte-${id.slice(0, 8)} ` + shot);
    }
    const map = w.mesures.map;
    log(`carte : ${map.querySourceFeatures("cadastre", { sourceLayer: "localisant" }).length} sections, ${map.querySourceFeatures("cadastre", { sourceLayer: "borne_limite_propriete" }).length} bornes`);
    expect("carte : couches du cadastre affichées", map.getLayoutProperty("cadastre", "visibility") === "visible");
    expect("carte : parcelles numérotées teintées (domaine public sans teinte)", map.getLayoutProperty("cadastre-parcelles", "visibility") === "visible"
      && map.getLayer("cadastre-parcelles").sourceLayer === "parcelle");
    expect("carte : sections des parcelles lues au zoom 18", map.querySourceFeatures("cadastre", { sourceLayer: "localisant" }).length > 0);
    {  // Parcelle visée en vert : la première que coupe la ligne de cap (hors celle de la caméra), à 50 m au plus. Attendue
      // lue autrement : points pris tous les 20 cm le long du cap, parcelle qui contient chacun
      const f = (await (await fetch("https://panoramax.ign.fr/api/search?ids=" + IDS.at(-1))).json()).features[0];
      const cam = f.geometry.coordinates, azimuth = Number(f.properties["view:azimuth"]);
      const parcels = map.querySourceFeatures("cadastre", { sourceLayer: "parcelle" });
      const inRing = (p, ring) => { let c = false; for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i], [xj, yj] = ring[j];
        if ((yi > p[1]) !== (yj > p[1]) && p[0] < xj + (xi - xj) * (p[1] - yj) / (yi - yj)) c = !c; } return c; };
      const holder = (p) => parcels.find((q) => (q.geometry.type === "Polygon" ? [q.geometry.coordinates] : q.geometry.coordinates)
        .some((rings) => inRing(p, rings[0]) && !rings.slice(1).some((h) => inRing(p, h))))?.properties.idu || "";
      const own = holder(cam), shown = () => map.getFilter("cadastre-vise")?.[2] ?? "";
      const under = () => map.getFilter("cadastre-camera")?.[2] ?? "";
      let lit = 0, inside = null;  // inside : point à 2 m dans la première parcelle visée, et son cap
      for (const turn of [0, 90, 180, 270]) {
        w.mesures.psv.rotate({ yaw: turn * Math.PI / 180, pitch: 0 });
        const heading = (azimuth + turn) * Math.PI / 180, k = 111320 * Math.cos(cam[1] * Math.PI / 180);
        let expected = "";
        for (let d = 0.2; d <= 49.8 && !expected; d += 0.2) {
          const idu = holder([cam[0] + d * Math.sin(heading) / k, cam[1] + d * Math.cos(heading) / 111320]);
          if (idu && idu !== own) {
            expected = idu;
            inside ??= { idu, heading, at: [cam[0] + (d + 2) * Math.sin(heading) / k, cam[1] + (d + 2) * Math.cos(heading) / 111320] };
          }
        }
        await soon(() => shown() === expected, 3000);
        if (expected) lit++;
        await sleep(300);  // dessin du filtre
        log(`cap +${turn}° (${Math.round((azimuth + turn) % 360)}°) : attendue ${expected || "aucune"}, allumée ${shown() || "aucune"}, caméra sur ${own || "le domaine public"}`);
        expect(`parcelle visée au cap +${turn}° : ${expected || "aucune à moins de 50 m"}`, shown() === expected, `allumée : ${shown() || "aucune"}`);
        {  // étiquette dans la visionneuse : section et numéro, dans l'axe de la vue, entre l'horizon et le sol (1,50 m du sol)
          const markers = w.mesures.psv.getPlugin("markers");
          // posée 2 s après le début du chargement de la photo (app.js, PARCEL_DELAY)
          if (expected) await soon(() => { try { return Boolean(markers.getMarker("mesure-parcelle")); } catch { return false; } }, 4000);
          let mark = null;
          try { mark = markers.getMarker("mesure-parcelle"); } catch { /* absente */ }
          const numero = expected.slice(-4), el = mark?.domElement || mark?.element;
          // direction attendue : le milieu du bord de la partie vue de la parcelle (Carte.aimedParcel().at), depuis la caméra
          const middle = w.eval("Carte").aimedParcel()?.at, kx = 111320 * Math.cos(cam[1] * Math.PI / 180);
          const toward = middle && Math.atan2((middle[0] - cam[0]) * kx, (middle[1] - cam[1]) * 111320) - azimuth * Math.PI / 180;
          const yaw = mark && Math.abs(((mark.state?.position?.yaw ?? mark.config.position.yaw) - toward + 5 * Math.PI) % (2 * Math.PI) - Math.PI);
          log(`étiquette au cap +${turn}° : ${el?.textContent || "aucune"}${mark ? `, écart à la direction attendue ${(yaw * 180 / Math.PI).toFixed(1)}°, élévation ${((mark.state?.position?.pitch ?? mark.config.position.pitch) * 180 / Math.PI).toFixed(1)}°` : ""}`);
          if (expected) {
            expect(`étiquette de la parcelle au cap +${turn}° : ${expected.slice(-6)}`, el && el.textContent.includes(numero.replace(/^0+/, "")) || el?.textContent.includes(numero));
            expect(`étiquette au cap +${turn}° : vers le milieu de la partie vue de la parcelle (1°)`, yaw < Math.PI / 180);
            expect(`« Avec annotations » actif avec l'étiquette seule, au cap +${turn}°`, !w.document.querySelector("#vignette").disabled);
          } else expect(`pas d'étiquette au cap +${turn}°`, !mark);
        }
        if (expected && lit === 1) {  // première parcelle allumée : carte dans le journal
          const shot = await new Promise((r) => { map.once("render", () => r(map.getCanvas().toDataURL("image/png"))); map.triggerRepaint(); });
          await log("IMAGE parcelle-visee " + shot);
        }
      }
      expect("au moins une parcelle visée allumée", lit > 0);
      expect(`caméra sur la voirie : rien en jaune (${own || "domaine public"})`, under() === own);
      if (inside && holder(inside.at) === inside.idu) {  // caméra posée dans cette parcelle : elle passe en jaune, pas en vert
        const Carte = w.eval("Carte");
        // posée de nouveau tant que la visionneuse peut la remettre sur la photo (fin de chargement) avant la réponse du WFS
        const move = () => Carte.showView(map, inside.at, inside.heading * 180 / Math.PI, 90);
        move();
        await soon(() => under() === inside.idu || void move(), 5000);  // même position : pas de nouvelle requête
        log(`caméra dans ${inside.idu} : jaune ${under() || "aucune"}, vert ${shown() || "aucune"}`);
        expect("caméra dans une parcelle : celle-ci en jaune, une autre (ou aucune) en vert", under() === inside.idu && shown() !== inside.idu);
        await sleep(300);
        const shot = await new Promise((r) => { map.once("render", () => r(map.getCanvas().toDataURL("image/png"))); map.triggerRepaint(); });
        await log("IMAGE parcelle-camera " + shot);
        Carte.showView(map, cam, azimuth, 90);
        // carte dézoomée (parcelles masquées sur la carte) : l'étiquette de la parcelle visée reste dans la visionneuse
        w.mesures.psv.rotate({ yaw: inside.heading - azimuth * Math.PI / 180, pitch: 0 });
        const label = () => { try { return w.mesures.psv.getPlugin("markers").getMarker("mesure-parcelle"); } catch { return null; } };
        await soon(() => Carte.aimedParcel()?.idu === inside.idu && label(), 5000);
        map.jumpTo({ zoom: 12 });
        await sleep(1500);  // contrôle « rien ne change »
        expect(`carte au zoom 12 : étiquette de ${inside.idu} gardée dans la visionneuse`, Carte.aimedParcel()?.idu === inside.idu && Boolean(label()));
        map.jumpTo({ zoom: 18 });
      } else expect("point d'essai dans une parcelle trouvé", false);
      {  // croix discrète au centre de la vue, cadastre coché
        const croix = doc.querySelector("#croix-cadastre"), r = croix.getBoundingClientRect();
        const v = w.mesures.psv.container.getBoundingClientRect();
        expect("croix au centre de la vue (cadastre coché)", !croix.hidden
          && Math.abs((r.left + r.right) / 2 - (v.left + v.right) / 2) <= 1 && Math.abs((r.top + r.bottom) / 2 - (v.top + v.bottom) / 2) <= 1);
      }
      doc.querySelector("#cadastre").click();  // réglage décoché : plus rien d'allumé
      await soon(() => shown() === "" && under() === "", 3000);
      expect("cadastre éteint : plus de croix au centre de la vue", doc.querySelector("#croix-cadastre").hidden);
      expect("cadastre éteint : parcelles visée et de la caméra éteintes", shown() === "" && under() === ""
        && map.getLayoutProperty("cadastre-vise", "visibility") === "none" && map.getLayoutProperty("cadastre-camera", "visibility") === "none");
    }
    await fin();
  } catch (error) {
    log("ERREUR " + (error.stack || error));
  }
})();
</script>
