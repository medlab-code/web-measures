<!-- Aperçu du carton de titre et du rappel (Video.drawOverlay) sur une photo, à 2 s et à 8 s : capture par
     google-chrome --headless=new --screenshot (mise au point du dessin, sans réseau hors polices). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/latin-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/latin-600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/latin-700.css">
<style>body { margin: 0; background: #222; } canvas { display: block; width: 960px; height: 540px; }</style>
<canvas id="a" width="1920" height="1080"></canvas><canvas id="b" width="1920" height="1080"></canvas>
<script src="../src/video.js"></script>
<script>
(async () => {
  await Promise.all([400, 600, 700].map((wt) => document.fonts.load(`${wt} 40px Inter`)));
  const title = { text: "RD 115D · PR 1+146 → PR 0", sub: "Photos du 10/07/2025 · Conseil départemental", keep: true };
  for (const [id, t] of [["a", 2], ["b", 8]]) {
    const ctx = document.getElementById(id).getContext("2d");
    const g = ctx.createLinearGradient(0, 0, 0, 1080);
    g.addColorStop(0, "#9ec5e8"); g.addColorStop(0.5, "#dfe9ef"); g.addColorStop(0.52, "#6f7f5a"); g.addColorStop(1, "#4a4a48");
    ctx.fillStyle = g; ctx.fillRect(0, 0, 1920, 1080);
    Video.drawOverlay(ctx, 1920, 1080, { title, pr: { route: "D115D", n: 1, m: 146 }, speed: { kmh: 72, digits: 2 }, t });
  }
})();
</script>
