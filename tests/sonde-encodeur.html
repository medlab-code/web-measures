<!-- Sonde de l'encodeur H.264 matériel (VA-API sous Linux) : une image encodée depuis la mémoire (RGBA, I420), un
     canevas 2D, un canevas WebGL (#memoireI420,webgl : celles-là seules) ; paquets reçus ou erreur dans le journal.
     Échec le 04/11/2026 (Chrome 157, Mesa 26.2.6) : à relancer quand Chrome ou Mesa change. -->
<pre id="log"></pre>
<script>
const log = (t) => fetch("/journal", { method: "POST", body: String(t) }).catch(() => {});
(async () => {
  const W = 1920, H = 1080;
  const config = { codec: "avc1.640028", width: W, height: H, bitrate: 30e6, framerate: 30, avc: { format: "avc" }, hardwareAcceleration: "prefer-hardware" };
  await log("pris en charge : " + (await VideoEncoder.isConfigSupported(config)).supported);
  const sources = {
    memoire: () => new VideoFrame(new Uint8Array(W * H * 4).fill(128), { format: "RGBA", codedWidth: W, codedHeight: H, timestamp: 0 }),
    memoireI420: () => new VideoFrame(new Uint8Array(W * H * 3 / 2).fill(128), { format: "I420", codedWidth: W, codedHeight: H, timestamp: 0 }),
    canevas2d: () => { const c = new OffscreenCanvas(W, H); c.getContext("2d").fillRect(0, 0, 10, 10); return new VideoFrame(c, { timestamp: 0 }); },
    webgl: () => { const c = new OffscreenCanvas(W, H); const gl = c.getContext("webgl2", { preserveDrawingBuffer: true }); gl.clearColor(0.5, 0.2, 0.1, 1); gl.clear(gl.COLOR_BUFFER_BIT); return new VideoFrame(c, { timestamp: 0 }); },
  };
  for (const name of (location.hash.slice(1) || Object.keys(sources).join(",")).split(",")) {
    await log(`${name} : encodage…`);
    let chunks = 0, error = null;
    const encoder = new VideoEncoder({ output: () => chunks++, error: (e) => { error = e; } });
    try {
      encoder.configure(config);
      const frame = sources[name]();
      encoder.encode(frame, { keyFrame: true });
      frame.close();
      await encoder.flush();
    } catch (e) { error = e; }
    await log(`${name} : ${chunks} paquet(s)${error ? ", erreur " + error.message : ""}`);
    if (encoder.state !== "closed") encoder.close();
  }
  log("FIN");
})();
</script>
