<!-- Banc : D115D du PR 1 + 146 au PR 0 (1,1 km), une photo sur 2, 90 km/h, exporté N fois (#n=4) sans cache HTTP
     (chaque export recharge ses tuiles ; #cache : tuiles gardées, après un premier export non compté) ; #compteurs :
     compteurs PR et vitesse ; encodeur H.264 matériel ou logiciel, puis chronos de chaque export dans le journal. -->
<script>try {
  localStorage.clear();
  localStorage.setItem("web-measures/filtre", JSON.stringify({ since: "2025-07-05" }));
} catch {}</script>
<iframe id="f" src="../index.html" style="width:1400px;height:1000px"></iframe>
<script>
const log = (t) => fetch("/journal", { method: "POST", body: String(t) }).catch(() => {});
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(test, ms, what) { const t0 = Date.now(); while (!test()) { if (Date.now() - t0 > ms) throw new Error("délai dépassé : " + what); await sleep(250); } }
(async () => {
  const w = document.getElementById("f").contentWindow;
  try {
    await until(() => w.mesures?.app && w.mesures.map?.loaded?.(), 180000, "Pyodide");
    const doc = w.document, Video = w.eval("Video");
    for (const hw of ["prefer-hardware", "prefer-software"]) {  // encodeur matériel ou logiciel de ce poste
      const config = { codec: "avc1.640028", width: 1920, height: 1080, bitrate: 30e6, framerate: 30, avc: { format: "avc" }, hardwareAcceleration: hw };
      log(`H.264 ${hw} : ${(await w.VideoEncoder.isConfigSupported(config)).supported}`);
    }
    doc.querySelector("#reglages-defaut")?.close();
    const type = (input, text) => { input.focus(); input.value = text; input.dispatchEvent(new w.Event("input", { bubbles: true })); };
    doc.querySelector("#onglet-parcours").click();
    const dialog = doc.querySelector("#parcours");
    const [route, pr, end] = dialog.querySelectorAll(".champ input");
    const [distance, endDistance] = dialog.querySelectorAll(".distance");
    const button = doc.querySelector("#parcours-video");
    type(route, "115d");
    type(pr, "1");
    distance.value = "146";
    type(end, "0");
    endDistance.value = "0";
    await sleep(3000);
    button.click();
    await until(() => /Enregistrer/.test(button.textContent), 120000, "vidéo préparée");
    const photos = w.mesures.videoPlan.photos.filter((_, i) => i % 2 === 0);
    const options = location.hash.includes("compteurs") ? { counter: true, speedometer: true } : {};
    if (location.hash.includes("cache")) await Video.mp4(photos, 90, () => {}, null, options);  // tuiles mises en cache
    else {
      const fetch0 = w.fetch;
      w.fetch = (url, init) => fetch0(url, { ...init, cache: "no-store" });  // tuiles rechargées à chaque export
    }
    const n = Number(/n=(\d+)/.exec(location.hash)?.[1] || 4);
    for (let k = 0; k < n; k++) {
      await Video.mp4(photos, 90, () => {}, null, options);
      const c = Video.times;
      log(`export ${k + 1} : tuiles ${(c.tuiles / 1000).toFixed(1)} s, dessin ${(c.dessin / 1000).toFixed(1)} s, encodeur ${
        (c.encodeur / 1000).toFixed(1)} s, total ${(c.total / 1000).toFixed(1)} s pour ${c.images} images (${photos.length} photos)`);
    }
  } catch (e) { log("ERREUR " + e); }
  log("FIN");
})();
</script>
