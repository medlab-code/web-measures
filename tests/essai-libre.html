<!-- Mesure libre sur deux photos imajbox à position RTK (Pouilly-en-Auxois) : deux cibles
     fictives sur le côté, triangulées depuis les deux photos, puis leur distance. Directions
     calculées depuis le cap EXIF précis. Lancer comme tests/navigateur.html (voir CLAUDE.md). -->
<script>try { localStorage.clear(); indexedDB.deleteDatabase("web-measures"); } catch {}</script>
<iframe id="f" src="../index.html" style="width:1400px;height:900px"></iframe>
<script src="commun.js"></script>
<script>
const { log, sleep, until, soon, ready, expect, near, verdict } = Essai;
// Surcouche des mesures dessinée en WebGL (src/traits.js) : repères demandés, à l'écran ou non
const traitsIn = () => document.getElementById("f").contentWindow.eval("Traits").items();
const labelsIn = () => traitsIn().labels.map((l) => ({ textContent: l.text }));
const crossesIn = (visee) => traitsIn().crosses.filter((c) => visee === undefined || c.visee === visee).length;
const feature = async (id) => (await (await fetch("https://api.panoramax.xyz/api/search?ids=" + id)).json()).features[0];
const IDS = ["cd8cf3a0-6567-40f0-8805-94172a5dfc3c", "1108ca14-6669-49e8-a26a-955becc79e81"];
(async () => {
  const w = document.getElementById("f").contentWindow;
  try {
    await ready(w);
    const app = w.mesures.app, doc = w.document;
    doc.querySelector("#reglages-defaut")?.close();  // réglages par défaut (CD21, instance IGN) : fenêtre fermée
    const psvClick = (yaw, pitch) => { const e = new Event("click"); e.data = { yaw, pitch, rightclick: false }; w.mesures.psv.dispatchEvent(e); };
    doc.querySelector("#mesure").click();
    doc.querySelector("#mode").value = "tri"; doc.querySelector("#mode").dispatchEvent(new Event("change"));
    const photos = await Promise.all(IDS.map(feature));
    const heading = (f) => { const [n, d] = f.properties.exif["Exif.GPSInfo.GPSImgDirection"].split("/"); return n / d; };
    const metres = ([lon, lat], [lon0, lat0]) => [(lon - lon0) * 111320 * Math.cos(lat0 * Math.PI / 180), (lat - lat0) * 111320];
    const [p0, p1] = photos.map((f) => f.geometry.coordinates);
    const mid = [(p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2];
    const along = Math.atan2(...metres(p1, p0));
    const target = [mid[0] + 5 * Math.cos(along) / (111320 * Math.cos(mid[1] * Math.PI / 180)), mid[1] - 5 * Math.sin(along) / 111320];
    const yawTo = (f, pt) => { const [x, y] = metres(pt, f.geometry.coordinates); return Math.atan2(x, y) - heading(f) * Math.PI / 180; };
    // Inclinaison cohérente d'une photo à l'autre (le calcul 3D s'en sert, photos RTK) : point
    // 2 m sous la moyenne des caméras, d'après l'altitude GPS de chaque photo (seule leur
    // différence compte)
    const altitude = (f) => { const [n, d] = String(f.properties.exif["Exif.GPSInfo.GPSAltitude"]).split("/"); return n / (d || 1); };
    const level = photos.reduce((a, f) => a + altitude(f), 0) / photos.length - 2.0;
    const pitchTo = (f, pt) => Math.atan2(level - altitude(f), Math.hypot(...metres(pt, f.geometry.coordinates)));
    log("photos à " + Math.hypot(...metres(p1, p0)).toFixed(2) + " m l'une de l'autre");
    const target2 = [target[0] + 3 * Math.sin(along) / (111320 * Math.cos(mid[1] * Math.PI / 180)) - 2 * Math.cos(along) / (111320 * Math.cos(mid[1] * Math.PI / 180)),
                     target[1] + 3 * Math.cos(along) / 111320 + 2 * Math.sin(along) / 111320];  // 3 m plus loin, 2 m vers la route
    const truth = Math.hypot(...metres(target2, target));
    const off = (id) => doc.querySelector(id).disabled;
    expect("rien encore : Effacer, Refaire et Tout effacer grisés", off("#effacer") && off("#refaire") && off("#tout-effacer"));
    for (const pt of [target, target2]) {
      for (const f of photos) {
        w.mesures.openPhoto(f);
        await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === f.id, 30000, "photo");
        await until(() => JSON.parse(app.state()).quality.includes("vérifiée"), 60000, "position vérifiée");
        psvClick(yawTo(f, pt), pitchTo(f, pt));
        if (pt === target2 && f === photos[1]) {  // Ctrl+Z : la dernière visée seule, puis refaite
          doc.dispatchEvent(new w.KeyboardEvent("keydown", { key: "z", ctrlKey: true, bubbles: true }));
          expect("Ctrl+Z : dernière visée annulée, la première gardée", app.triangulator.sightings.length === 1,
            doc.querySelector("#statut").textContent);
          expect("après Ctrl+Z : Refaire actif, Effacer et Tout effacer aussi", !off("#refaire") && !off("#effacer") && !off("#tout-effacer"));
          doc.querySelector("#refaire").click();  // comme Ctrl+Y
          expect("« Refaire » : visée rétablie", app.triangulator.sightings.length === 2, doc.querySelector("#statut").textContent);
          doc.dispatchEvent(new w.KeyboardEvent("keydown", { key: "z", ctrlKey: true, bubbles: true }));
          psvClick(yawTo(f, pt), pitchTo(f, pt));
          doc.dispatchEvent(new w.KeyboardEvent("keydown", { key: "y", ctrlKey: true, bubbles: true }));
          expect("Ctrl+Y sans objet après un nouveau clic", doc.querySelector("#statut").textContent === "Rien à rétablir."
            && app.triangulator.sightings.length === 2, doc.querySelector("#statut").textContent);
        }
      }
      doc.querySelector("#garder").click();
      log("validé : " + doc.querySelector("#statut").textContent);
    }
    log("distance attendue : " + truth.toFixed(3) + " m");
    near("distance entre les deux points", Number(JSON.parse(app.export_geojson()).features.find((f) => f.properties.type.startsWith("distance"))?.properties.valeur_m), truth, 0.02);  // hors de la liste (#30)
    await soon(() => !w.mesures.map.isMoving());  // carte cadrée sur la mesure
    { const map = w.mesures.map, c = map.getContainer();
      const pa = map.project(target), pb = map.project(target2);
      log("carte : zoom " + map.getZoom().toFixed(1) + " · A (" + Math.round(pa.x) + "," + Math.round(pa.y) + ") B (" + Math.round(pb.x) + ","
        + Math.round(pb.y) + ") dans " + c.clientWidth + "×" + c.clientHeight); }
    log("visionneuse : " + labelsIn().map((e) => e.textContent).join(" | ")
      + " · croix " + crossesIn(false) + " · liseré " + doc.querySelector("#vue").className
      + " · état " + doc.querySelector("#etat-mesure").textContent + " · rappel : " + doc.querySelector("#mode-mesure").textContent);
    w.mesures.openPhoto(photos[0]);
    await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === photos[0].id, 30000, "photo 1");
    log("autre photo : " + labelsIn().map((e) => e.textContent).join(" | ")
      + " · croix " + crossesIn(false));
    // les deux points visés aussi depuis cette photo : la distance y reste (ticket #24)
    expect("distance sur l'autre photo d'où ses deux points ont été visés",
      labelsIn().some((e) => e.textContent.includes("↔")));
    log("résultats : " + JSON.parse(app.results()).map((r) => r.text).join(" | ")
      + " · carte : " + JSON.parse(app.map_geojson()).features.map((f) => f.properties.kind).join(","));
    log("modes : " + [...doc.querySelectorAll("#mode option")].map((o) => o.textContent).join(" | "));
    // Couche en Shapefile (zip, .prj Lambert 93) puis en GeoPackage (2e de ses deux tables) : point de
    // Dijon (852418, 6697212) en WGS 84 (5,019448 ; 47,357700)
    for (const [file, table, count] of [["bornes-l93.zip", null, 2], ["couches-l93.gpkg", "2", 3]]) {
      w.prompt = () => table;  // GeoPackage : numéro de la table
      const blob = await (await fetch(`donnees/${file}`)).blob();
      const dt = new w.DataTransfer();
      dt.items.add(new w.File([blob], file));
      const input = doc.querySelector("#couche-fichier");
      input.files = dt.files;
      input.dispatchEvent(new Event("change"));
      await until(() => doc.querySelector("#couche-nom").textContent.startsWith(file), 30000, `couche ${file}`);
      const features = w.mesures.map.getSource("couche").serialize().data.features;
      const borne = features.find((f) => f.geometry.type === "Point")?.geometry.coordinates || [];
      log(`couche ${file} : ${doc.querySelector("#couche-nom").textContent} · ${features.map((f) => f.geometry.type).join(", ")}`
        + ` · borne ${borne.map((v) => v.toFixed(6)).join(", ")}`);
      expect(`couche ${file} : objets lus et reprojetés`, features.length === count
        && Math.abs(borne[0] - 5.019448) < 2e-6 && Math.abs(borne[1] - 47.3577) < 2e-6);
    }
    doc.querySelector("#couche-retirer").click();
    expect("couche retirée du navigateur", !(await w.mesures.savedOverlay()));  // effacement fini avant le rechargement
    // Stockage plein : ancienne copie effacée (pas proposée comme si c'était tout), message affiché
    const setItem = w.Storage.prototype.setItem;
    w.Storage.prototype.setItem = function (key, value) {
      if (key === "web-measures/resultats" && value) throw new w.DOMException("plein", "QuotaExceededError");
      return setItem.call(this, key, value);
    };
    w.mesures.refresh(app.undo());
    expect("stockage plein : copie effacée et message", !w.localStorage.getItem("web-measures/resultats")
      && doc.querySelector("#statut").textContent.includes("trop nombreux"), doc.querySelector("#statut").textContent);
    w.Storage.prototype.setItem = setItem;
    w.mesures.refresh(app.redo());
    // Résultats gardés dans le navigateur, proposés à l'export à l'ouverture suivante
    const saved = JSON.parse(w.localStorage.getItem("web-measures/resultats") || "null");
    expect("résultats gardés dans le navigateur", saved && saved.n === JSON.parse(app.export_geojson()).features.length && saved.csv.includes(";"), JSON.stringify(saved)?.slice(0, 80));
    // Couche importée gardée : remise avec ses réglages à l'ouverture suivante
    w.localStorage.setItem("web-measures/couche", JSON.stringify({ name: "gardée.geojson", crs: "wgs84", columns: ["nom"],
      couleur: "nom", etiquette: "nom", features: [{ type: "Feature", id: 0, properties: { nom: "borne" },
        geometry: { type: "Point", coordinates: target } }] }));
    w.location.reload();
    await sleep(1000);
    await until(() => w.document.readyState === "complete" && w.document.querySelector("#precedents"), 60000, "page rechargée");
    const shown = w.document.querySelector("#precedents");
    expect("résultats précédents proposés à l'export", !shown.hidden, shown.textContent.trim().slice(0, 80));
    log("précédents : " + shown.querySelector("summary").textContent + " " + [...shown.querySelectorAll("li")].map((li) => li.textContent).join(" | "));
    expect("résultats précédents listés", shown.querySelectorAll("li").length === saved.n);
    // La liste de la session en cours reste la sienne (elle était écrite dans celle des précédents)
    await until(() => w.mesures?.app, 120000, "Pyodide rechargé");
    const d2 = w.document;
    await soon(() => !d2.querySelector("#couche-reglages").hidden && d2.querySelector("#couche-nom").textContent.startsWith("gardée.geojson"), 10000);
    expect("couche gardée remise avec ses réglages", !d2.querySelector("#couche-reglages").hidden
      && d2.querySelector("#couche-nom").textContent.startsWith("gardée.geojson") && d2.querySelector("#couche-etiquette").value === "nom"
      && d2.querySelector("#couche-couleur").value === "nom", d2.querySelector("#couche-nom").textContent);
    expect("couche de l'ancienne place (localStorage) reprise dans IndexedDB", (await w.mesures.savedOverlay())?.name === "gardée.geojson"
      && !w.localStorage.getItem("web-measures/couche"));
    expect("liste des précédents intacte après un rafraîchissement", shown.querySelectorAll("li").length === saved.n
      && !shown.querySelector("input"));
    const m2 = w.mesures.map;
    await until(() => m2?.getSource?.("precedents")?.serialize?.().data?.features?.length > 0, 30000, "résultats précédents sur la carte");
    expect("résultats précédents sur la carte", m2.getSource("precedents").serialize().data.features.length === saved.n);
    // Non exportés pendant cette session (sans résultat) : plus proposés à la suivante
    w.location.reload();
    await sleep(1000);
    await until(() => w.document.readyState === "complete" && w.document.querySelector("#precedents"), 60000, "2e rechargement");
    await sleep(500);
    expect("résultats précédents oubliés après une session sans export", w.document.querySelector("#precedents").hidden);
    await verdict();
  } catch (e) { log("ERREUR " + e); }
  await log("FIN");
})();
</script>
