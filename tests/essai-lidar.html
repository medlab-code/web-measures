<!-- Faisabilité : lire à la volée le nuage de points LiDAR HD (COPC, lecture partielle par Range) autour de
     la caméra et tracer le profil en travers (altitude, intensité), pour voir si le bord de la chaussée
     s'y lit (piste du bouton « Dévers », ticket #31). Hors application. Lancer comme tests/navigateur.html ;
     #photo=<id> pour une autre photo. Journal : profils, bords trouvés, nombre de requêtes et durée ;
     chaque graphique part dans le journal en PNG (ligne « IMAGE nom data:… »). -->
<style>body { font: 13px sans-serif; background: #fff; } canvas { display: block; margin: 4px 0 16px; }</style>
<script src="https://cdn.jsdelivr.net/npm/laz-perf@0.0.7/lib/web/laz-perf.js"></script>
<body>
<script>
const log = (t) => { console.log(t); return fetch("/journal", { method: "POST", body: String(t) }).catch(() => {}); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const API = "https://panoramax.ign.fr/api";
const WFS = "https://data.geopf.fr/wfs/ows?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&OUTPUTFORMAT=application/json"
  + "&TYPENAMES=IGNF_LIDAR-HD_METADONNEE:metadata";
const HALF = 25, STRIP = 1.0, BIN = 0.25;  // m : profil de ±HALF en travers, bande de ±STRIP le long de la route
// Photos : Pouilly-en-Auxois (RTK, voir essai-largeur.html ; largeur réelle non relevée), et les abords de deux ponts
// (remblais d'approche, voir essai-bords.html)
const PHOTOS = location.hash.startsWith("#photo=") ? [location.hash.slice(7)]
  : ["cd8cf3a0-6567-40f0-8805-94172a5dfc3c", { near: "2eed13c0-cb03-437f-9752-2f3b6b0d0478" },
     { near: "e375c98e-31c5-426a-ba93-c63ac344d675" }];

// Lambert 93 (RGF93, EPSG:2154), aller et retour (IGN, ALG0001 à ALG0004 ; RGF93 ≈ WGS 84)
const L93 = { n: 0.7256077650532670, c: 11754255.426096, xs: 700000, ys: 12655612.049876, e: 0.0818191910428158 };
function toL93(lon, lat) {
  const { n, c, xs, ys, e } = L93, p = lat * Math.PI / 180, s = e * Math.sin(p);
  const r = c * Math.exp(-n * (Math.log(Math.tan(Math.PI / 4 + p / 2)) + e / 2 * Math.log((1 - s) / (1 + s))));
  const g = n * (lon - 3) * Math.PI / 180;
  return [xs + r * Math.sin(g), ys - r * Math.cos(g)];
}

// Téléchargement des dalles : 1 requête par seconde au plus (en-tête x-ratelimit-limit-second du serveur)
let requests = 0, bytes = 0, last = 0;
async function range(url, start, length) {
  for (let attempt = 0; ; attempt++) {
    const wait = last + 1100 - Date.now();
    if (wait > 0) await sleep(wait);
    last = Date.now();
    requests++;
    const r = await fetch(url, { headers: { Range: `bytes=${start}-${start + length - 1}` } });
    if (r.status === 429 && attempt < 5) { await sleep(2000); continue; }
    if (r.status !== 206) throw new Error(`HTTP ${r.status} sur ${url.split("/").pop()}`);
    const buffer = await r.arrayBuffer();
    bytes += buffer.byteLength;
    return new DataView(buffer);
  }
}

// Lecteur COPC minimal : en-tête LAS 1.4, VLR « copc » (info), pages de la hiérarchie, morceaux LAZ
const tiles = new Map();
async function openTile(url) {
  if (tiles.has(url)) return tiles.get(url);
  const h = await range(url, 0, 589);  // en-tête (375 octets), en-tête de VLR (54), info COPC (160)
  const f64 = (o) => h.getFloat64(o, true), u64 = (o) => Number(h.getBigUint64(o, true));
  const user = new TextDecoder().decode(new Uint8Array(h.buffer, 377, 16)).replace(/\0.*/, "");
  if (user !== "copc") throw new Error("pas un fichier COPC : " + user);
  const tile = {
    url, format: h.getUint8(104) & 0x3f, length: h.getUint16(105, true),
    scale: [f64(131), f64(139), f64(147)], offset: [f64(155), f64(163), f64(171)],
    center: [f64(429), f64(437), f64(445)], half: f64(453), spacing: f64(461),
    root: [u64(469), u64(477)], pages: new Map(),
  };
  tiles.set(url, tile);
  return tile;
}

/** Nœuds non vides (d, x, y, z, offset, taille, points) qui touchent le rectangle box [xmin, ymin, xmax, ymax]. */
async function nodesIn(tile, box) {
  const out = [];
  const touches = (d, x, y) => {
    const size = 2 * tile.half / 2 ** d, x0 = tile.center[0] - tile.half + x * size, y0 = tile.center[1] - tile.half + y * size;
    return x0 <= box[2] && x0 + size >= box[0] && y0 <= box[3] && y0 + size >= box[1];
  };
  async function page(offset, size) {
    const key = offset + ":" + size;
    if (!tile.pages.has(key)) tile.pages.set(key, await range(tile.url, offset, size));
    const v = tile.pages.get(key);
    for (let o = 0; o < v.byteLength; o += 32) {
      const [d, x, y, z] = [0, 4, 8, 12].map((k) => v.getInt32(o + k, true));
      const at = Number(v.getBigUint64(o + 16, true)), length = v.getInt32(o + 24, true), count = v.getInt32(o + 28, true);
      if (!touches(d, x, y)) continue;
      if (count === -1) await page(at, length);  // page de hiérarchie fille
      else if (count > 0) out.push({ d, x, y, z, at, length, count });
    }
  }
  await page(...tile.root);
  return out;
}

let lazPerf = null;
/** Points d'un nœud : [x, y, z, intensité, classe] (Lambert 93, IGN69). */
async function points(tile, node) {
  lazPerf ??= await createLazPerf();
  const data = await range(tile.url, node.at, node.length);
  const input = lazPerf._malloc(node.length), output = lazPerf._malloc(tile.length);
  const decoder = new lazPerf.ChunkDecoder();
  const out = [];
  try {
    lazPerf.HEAPU8.set(new Uint8Array(data.buffer), input);
    decoder.open(tile.format, tile.length, input);
    const [sx, sy, sz] = tile.scale, [ox, oy, oz] = tile.offset;
    for (let i = 0; i < node.count; i++) {
      decoder.getPoint(output);
      const v = new DataView(lazPerf.HEAPU8.buffer, output, tile.length);  // HEAPU8 peut changer en grandissant
      out.push([v.getInt32(0, true) * sx + ox, v.getInt32(4, true) * sy + oy, v.getInt32(8, true) * sz + oz,
        v.getUint16(12, true), tile.format >= 6 ? v.getUint8(16) : v.getUint8(15) & 31]);
    }
  } finally {
    decoder.delete();
    lazPerf._free(input);
    lazPerf._free(output);
  }
  return out;
}

const median = (a) => { if (!a.length) return null; const s = [...a].sort((p, q) => p - q); return s[s.length >> 1]; };

/** Photo (identifiant, ou { near: id } : photo de la même séquence à 50-90 m) : position et sens de la trajectoire. */
async function photo(spec) {
  const item = async (id) => (await (await fetch(`${API}/search?ids=${id}`)).json()).features[0];
  let f = await item(spec.near || spec);
  if (spec.near) {
    const [lon, lat] = f.geometry.coordinates, d = 0.0015;
    const near = (await (await fetch(`${API}/search?limit=60&collections=${f.collection}&bbox=${lon - d},${lat - d},${lon + d},${lat + d}`)).json()).features;
    f = near.map((g) => [g, Math.hypot(...toL93(...g.geometry.coordinates).map((v, k) => v - toL93(lon, lat)[k]))])
      .filter(([, m]) => m > 50 && m < 90).sort((a, b) => a[1] - b[1])[0][0];
  }
  const full = await (await fetch(`${API}/collections/${f.collection}/items/${f.id}`)).json();
  const linked = async (rel) => { const l = full.links.find((k) => k.rel === rel); return l ? (await (await fetch(l.href)).json()) : null; };
  const [prev, next] = await Promise.all([linked("prev"), linked("next")]);
  const [a, b] = [prev || full, next || full].map((g) => toL93(...g.geometry.coordinates));
  const t = Math.hypot(b[0] - a[0], b[1] - a[1]);
  return { id: f.id, lonlat: full.geometry.coordinates, at: toL93(...full.geometry.coordinates), dir: [(b[0] - a[0]) / t, (b[1] - a[1]) / t],
    z: full.properties["geo:altitude"] ?? full.properties.altitude, precision: full.properties["quality:horizontal_accuracy"] };
}

/** Profil en travers : cases de BIN m, points sol (classe 2) de la bande ; across > 0 à droite du sens de marche. */
function profile(cam, cloud) {
  const [dx, dy] = cam.dir, bins = new Map();
  let kept = 0;
  for (const [x, y, z, intensity, cls] of cloud) {
    const ex = x - cam.at[0], ey = y - cam.at[1], along = ex * dx + ey * dy, across = ex * dy - ey * dx;
    if (Math.abs(along) > STRIP || Math.abs(across) > HALF) continue;
    kept++;
    const k = Math.round(across / BIN);
    if (!bins.has(k)) bins.set(k, { ground: [], intensity: [], other: [] });
    const b = bins.get(k);
    if (cls === 2) { b.ground.push(z); b.intensity.push(intensity); } else b.other.push(z);
  }
  const rows = [...bins].sort((p, q) => p[0] - q[0]).map(([k, b]) => ({ across: k * BIN, z: median(b.ground),
    i: median(b.intensity), n: b.ground.length, other: b.other.length, top: b.other.length ? Math.max(...b.other) : null }));
  return { rows, kept };
}

/** Bords vus de la caméra, de chaque côté : par l'intensité (saut durable au-dessus de celle sous la caméra) et
 *  par le relief (terrain sous le plan de la chaussée ajusté sous la caméra). */
function edges(rows) {
  const road = rows.filter((r) => Math.abs(r.across) <= 1.5 && r.z !== null);
  const ref = median(road.map((r) => r.i));
  // plan de la chaussée : droite z = a + b·across par moindres carrés sous la caméra
  const m = road.length, sx = road.reduce((s, r) => s + r.across, 0), sz = road.reduce((s, r) => s + r.z, 0);
  const sxx = road.reduce((s, r) => s + r.across ** 2, 0), sxz = road.reduce((s, r) => s + r.across * r.z, 0);
  const b = (m * sxz - sx * sz) / (m * sxx - sx * sx), a = (sz - b * sx) / m;
  const out = { ref, crossfall: b };
  for (const [name, sign] of [["gauche", -1], ["droit", 1]]) {
    const side = rows.filter((r) => sign * r.across > 0 && r.z !== null).sort((p, q) => sign * p.across - sign * q.across);
    const first = (test) => { for (let k = 0; k + 1 < side.length; k++) if (test(side[k]) && test(side[k + 1])) return side[k]; return null; };
    const byI = first((r) => r.i > 1.6 * ref), byZ = first((r) => r.z - (a + b * r.across) < -0.10);
    // talus : plus forte pente vers le bas sur 2 m au-delà du bord (relief, sinon intensité)
    const from = (byZ || byI)?.across;
    let slope = null;
    if (from !== undefined) {
      const beyond = side.filter((r) => sign * r.across >= sign * from);
      for (const p of beyond) {
        const q = beyond.find((r) => sign * (r.across - p.across) >= 2);
        if (q) { const s = (p.z - q.z) / Math.abs(q.across - p.across); if (slope === null || s > slope) slope = s; }
      }
    }
    out[name] = { intensity: byI?.across ?? null, relief: byZ?.across ?? null, slope };
  }
  return out;
}

function draw(title, rows, found, cam) {
  const W = 1300, H = 420, top = 280, canvas = Object.assign(document.createElement("canvas"), { width: W, height: H });
  document.body.append(Object.assign(document.createElement("h3"), { textContent: title }), canvas);
  const g = canvas.getContext("2d"), zs = rows.flatMap((r) => [r.z, r.top].filter((v) => v !== null));
  const zmin = Math.min(...zs), zmax = Math.max(zmin + 4, Math.min(Math.max(...zs), zmin + 12));
  const X = (a) => 50 + (a + HALF) / (2 * HALF) * (W - 70), Z = (z) => 20 + (zmax - z) / (zmax - zmin) * (top - 40);
  const imax = Math.max(...rows.map((r) => r.i || 0));
  const I = (i) => H - 10 - i / imax * (H - top - 30);
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  g.font = "12px sans-serif"; g.fillStyle = "#333";
  for (let a = -HALF; a <= HALF; a += 5) { g.fillText(`${a}`, X(a) - 6, top - 4); g.fillRect(X(a), top - 18, 1, 4); }
  g.fillText(`altitude ${zmin.toFixed(1)}–${zmax.toFixed(1)} m · sol (gris : intensité), sursol (vert) · m en travers, gauche ← → droite`, 50, 14);
  g.fillText("intensité médiane du sol", 50, top + 14);
  g.fillStyle = "#2a2"; for (const r of rows) if (r.top !== null && r.top < zmax) g.fillRect(X(r.across) - 1, Z(r.top) - 1, 3, 3);
  for (const r of rows) if (r.z !== null) {
    const v = Math.round(220 - 200 * Math.min(1, r.i / imax));
    g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(X(r.across) - 2, Z(r.z) - 2, 5, 5);
  }
  g.strokeStyle = "#555"; g.beginPath();
  rows.filter((r) => r.i !== null).forEach((r, k) => g[k ? "lineTo" : "moveTo"](X(r.across), I(r.i))); g.stroke();
  g.strokeStyle = "#999"; g.setLineDash([4, 4]); g.beginPath(); g.moveTo(X(-HALF), I(1.6 * found.ref)); g.lineTo(X(HALF), I(1.6 * found.ref)); g.stroke();
  const mark = (a, color) => { if (a === null) return; g.strokeStyle = color; g.beginPath(); g.moveTo(X(a), 0); g.lineTo(X(a), H); g.stroke(); };
  g.setLineDash([]);
  mark(0, "#000");
  for (const side of ["gauche", "droit"]) { mark(found[side].intensity, "#d00"); mark(found[side].relief, "#06c"); }
  g.fillStyle = "#d00"; g.fillText("bord par l'intensité", W - 260, 14); g.fillStyle = "#06c"; g.fillText("bord par le relief", W - 130, 14);
  return canvas.toDataURL("image/png");
}

(async () => {
  let ok = 0;
  try {
    // Contrôle de la projection : coin nord-ouest de la dalle 0851-6691 (métadonnées IGN) ≈ (851000, 6691000)
    const [cx, cy] = toL93(4.99858536, 47.30212053);
    if (Math.hypot(cx - 851000, cy - 6691000) > 2) throw new Error(`projection Lambert 93 fausse : ${cx}, ${cy}`);
    for (const spec of PHOTOS) {
      const t0 = Date.now(), r0 = requests, b0 = bytes;
      const cam = await photo(spec);
      const [x, y] = cam.at, box = [x - HALF - 2, y - HALF - 2, x + HALF + 2, y + HALF + 2];
      // dalles par leurs métadonnées, autour de la photo
      const [lon, lat] = cam.lonlat, d = 0.0004, meta = (await (await fetch(`${WFS}&BBOX=${lat - d},${lon - d},${lat + d},${lon + d},urn:ogc:def:crs:EPSG::4326`)).json()).features;
      if (!meta.length) { log(`${cam.id.slice(0, 8)} : pas de LiDAR HD ici`); continue; }
      const cloud = [], depths = {};
      for (const m of meta) {
        const tile = await openTile(m.properties.url_npl);
        const nodes = await nodesIn(tile, box);
        for (const n of nodes) (depths[n.d] ??= [0, 0, 0])[0]++, depths[n.d][1] += n.count, depths[n.d][2] += n.length;
        // shortcut: les deux niveaux les plus fins (9/10 des points de la bande, 1/4 à 1/5 des octets : essai du
        // 2026-10-27) ; tous les niveaux si la densité manque
        const deepest = Math.max(...nodes.map((n) => n.d));
        for (const n of nodes.filter((n) => n.d >= deepest - 1)) for (const p of await points(tile, n)) cloud.push(p);
      }
      const { rows, kept } = profile(cam, cloud), found = edges(rows);
      const fmt = (v) => (v === null ? "—" : `${v.toFixed(2)} m`);
      const title = `${cam.id.slice(0, 8)} (précision ${cam.precision ?? "?"} m)`;
      log(`${title} : niveaux ${Object.entries(depths).map(([k, [n, c, l]]) => `${k}:${n} nœuds/${c} pts/${(l / 1e6).toFixed(1)} Mo`).join(" ")}`);
      log(`  ${cloud.length} points lus, ${kept} dans la bande (${(kept / (2 * HALF * 2 * STRIP)).toFixed(1)} /m²) · `
        + `${requests - r0} requêtes, ${((bytes - b0) / 1e6).toFixed(1)} Mo, ${((Date.now() - t0) / 1000).toFixed(0)} s`);
      log(`  chaussée sous la caméra : intensité ${found.ref}, dévers ${(100 * found.crossfall).toFixed(1)} %`);
      for (const side of ["gauche", "droit"]) {
        const s = found[side];
        log(`  côté ${side} : bord par l'intensité ${fmt(s.intensity)}, par le relief ${fmt(s.relief)}`
          + `${s.slope !== null ? `, talus max ${(100 * s.slope).toFixed(0)} % sur 2 m` : ""}`);
      }
      log("  profil (travers m : altitude, intensité, points) : " + rows.filter((r) => Math.abs(r.across * 2 % 2) < 1e-9)
        .map((r) => `${r.across}:${r.z?.toFixed(2) ?? "—"}/${r.i ?? "—"}/${r.n}`).join(" "));
      await log(`IMAGE ${cam.id.slice(0, 8)} ` + draw(title, rows, found, cam));
      ok++;
    }
  } catch (e) { log("exception " + (e.stack || e)); }
  log(ok ? "FIN" : "ERREUR aucun profil");
})();
</script>
