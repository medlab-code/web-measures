<!-- Écart entre l'étiquette d'une mesure et le milieu de son trait, dans la visionneuse, pour
     la première mesure puis les suivantes. Journal envoyé à tools/serveur-essai.py. -->
<style>body{margin:0}iframe{border:0;display:block}</style>
<iframe id="f" src="../index.html" style="width:1400px;height:900px"></iframe>
<script>
const log = (t) => fetch("/journal", { method: "POST", body: String(t) }).catch(() => {});
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const PIC = "33565d3f-5e27-47fb-9137-ba4de564530d";
(async () => {
  const w = document.getElementById("f").contentWindow;
  while (!(w.mesures && w.mesures.app)) await sleep(250);
  const r = await fetch("https://api.panoramax.xyz/api/search?ids=" + PIC);
  w.mesures.openPhoto((await r.json()).features[0]);
  while (w.mesures.psv?.getPictureMetadata?.()?.id !== PIC) await sleep(250);
  w.document.querySelector("#mesure").click();
  w.document.querySelector("#degrade").close?.();
  const app = w.mesures.app, psv = w.mesures.psv;
  const measure = async (a, b) => {
    const click = (yaw, pitch) => { const e = new Event("click"); e.data = { yaw, pitch }; psv.dispatchEvent(e); };
    click(...a);
    while (!app.status().startsWith("Cliquez au pied du bord opposé")) await sleep(200);
    click(...b);
    while (!app.status().startsWith("Largeur")) await sleep(200);
    await sleep(1500);
  };
  // Écart de chaque étiquette au trait réellement dessiné (segment droit entre les deux points)
  const report = (n, segments) => {
    const box = psv.container.getBoundingClientRect();
    const labels = [...psv.container.querySelectorAll(".etiquette")];
    segments.forEach(([a, b], i) => {
      const pa = psv.dataHelper.sphericalCoordsToViewerCoords({ yaw: a[0], pitch: a[1] });
      const pb = psv.dataHelper.sphericalCoordsToViewerCoords({ yaw: b[0], pitch: b[1] });
      const r = labels[i].getBoundingClientRect();
      const cx = r.left + r.width / 2 - box.left;
      const lineY = pa.y + (pb.y - pa.y) * (cx - pa.x) / (pb.x - pa.x);
      log(`après la mesure ${n} · ${labels[i].textContent} : centre à ${Math.round(cx - (pa.x + pb.x) / 2)} px du milieu `
        + `du trait, bas à ${Math.round(lineY - (r.bottom - box.top))} px au-dessus du trait`);
    });
  };
  const a1 = [-0.45, -0.3], b1 = [0.5, -0.3], a2 = [-0.35, -0.12], b2 = [0.3, -0.12];
  await measure(a1, b1);
  report(1, [[a1, b1]]);
  await measure(a2, b2);
  report(2, [[a1, b1], [a2, b2]]);
  log("FIN");
})().catch((e) => log("ERREUR " + e.stack));
</script>
