<!-- Hauteur sur deux photos imajbox à position RTK (Pouilly-en-Auxois) : point de référence
     triangulé sur une cible fictive à 5 m sur le côté, puis pied et sommet. Directions calculées
     depuis le cap EXIF précis. Lancer comme tests/navigateur.html (voir CLAUDE.md). -->
<script>try { localStorage.clear(); indexedDB.deleteDatabase("web-measures"); } catch {}</script>
<iframe id="f" src="../index.html" style="width:1400px;height:900px"></iframe>
<script src="commun.js"></script>
<script>
const { log, sleep, until, soon, ready, expect, expectSoon, near, metresIn, verdict } = Essai;
// Surcouche des mesures dessinée en WebGL (src/traits.js) : repères demandés, à l'écran ou non
const traitsIn = () => document.getElementById("f").contentWindow.eval("Traits").items();
const labelsIn = () => traitsIn().labels.map((l) => ({ textContent: l.text }));
const crossesIn = (visee) => traitsIn().crosses.filter((c) => visee === undefined || c.visee === visee).length;
const feature = async (id) => (await (await fetch("https://api.panoramax.xyz/api/search?ids=" + id)).json()).features[0];
const IDS = ["cd8cf3a0-6567-40f0-8805-94172a5dfc3c", "1108ca14-6669-49e8-a26a-955becc79e81"];
(async () => {
  const w = document.getElementById("f").contentWindow;
  try {
    await ready(w);
    const app = w.mesures.app, doc = w.document;
    // Incertitude annoncée sur le bouton d'une photo proposée, puis obtenue après la visée réelle
    const predicted = (id) => (JSON.parse(app.state()).guide?.choices || []).find((c) => c.id === id)?.expect;
    const obtained = () => { const r = app.triangulator.result; return r ? r.get("uncertainty") : null; };
    const compare = (what, before) => {
      const after = obtained();
      log(`${what} : annoncée ±${before?.toFixed(3)} m, obtenue ±${after?.toFixed(3)} m`);
      expect(`${what} : incertitude annoncée à 30 % près`, before != null && after != null
        && Math.abs(after - before) <= 0.3 * after, `annoncée ${before}, obtenue ${after}`);
    };
    doc.querySelector("#reglages-defaut")?.close();  // réglages par défaut (CD21, instance IGN) : fenêtre fermée
    // Photos de niveau : inclinaison nulle calée à la main (deux objets verticaux à 90°), comme
    // le supposent les clics de l'essai, calculés sans inclinaison. Sans cela, l'inclinaison
    // automatique, arrivée après coup, recalculerait visées, point et mesures (session._recompute)
    // loin des valeurs attendues.
    const level = [[[30, -10], [30, 15]], [[120, -10], [120, 15]]];
    app.merge_calibration(JSON.stringify({ format: 1, verticals: Object.fromEntries(IDS.map((id) => [id, level])) }));
    // Sol LiDAR au point non lu : les clics de l'essai visent un pied à 2 m sous la caméra
    // (inclinaison fixe), pas le sol réel ; le calcul l'opposerait à l'altitude lue au point
    // (vérifié par les tests du cœur, test_triangulation et test_session)
    const noGround = (lon, lat, done) => done(undefined);
    app._ground_lookup = noGround;
    app.triangulator.ground_lookup = noGround;
    // clic simulé avec sa position à l'écran, comme la visionneuse la donne (croix sous le clic : en pixels)
    const at = (yaw, pitch) => { const p = w.mesures.psv.dataHelper.sphericalCoordsToViewerCoords({ yaw, pitch }); return { viewerX: p.x, viewerY: p.y }; };
    const psvClick = (yaw, pitch) => { const e = new Event("click"); e.data = { yaw, pitch, rightclick: false, ...at(yaw, pitch) }; w.mesures.psv.dispatchEvent(e); };
    doc.querySelector("#hauteur-visionneuse").click();  // bouton « Hauteur » de la visionneuse : mode Hauteur et mesure
    const photos = await Promise.all(IDS.map(feature));
    const heading = (f) => { const [n, d] = f.properties.exif["Exif.GPSInfo.GPSImgDirection"].split("/"); return n / d; };
    const metres = ([lon, lat], [lon0, lat0]) => [(lon - lon0) * 111320 * Math.cos(lat0 * Math.PI / 180), (lat - lat0) * 111320];
    const [p0, p1] = photos.map((f) => f.geometry.coordinates);
    const mid = [(p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2];
    const along = Math.atan2(...metres(p1, p0));
    const target = [mid[0] + 5 * Math.cos(along) / (111320 * Math.cos(mid[1] * Math.PI / 180)), mid[1] - 5 * Math.sin(along) / 111320];
    const yawTo = (f, pt) => { const [x, y] = metres(pt, f.geometry.coordinates); return Math.atan2(x, y) - heading(f) * Math.PI / 180; };
    log("photos à " + Math.hypot(...metres(p1, p0)).toFixed(2) + " m l'une de l'autre");
    for (const f of photos) {
      w.mesures.psv.zoom(60);
      w.mesures.openPhoto(f);
      await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === f.id, 30000, "photo");
      const zoom0 = w.mesures.psv.getZoomLevel();
      await until(() => JSON.parse(app.state()).quality.includes("vérifiée"), 60000, "position vérifiée");
      if (f === photos[1]) {  // visée suivante : vue tournée vers le pied placé par la première
        const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
        await soon(() => Math.abs(wrap(w.mesures.psv.getPosition().yaw - yawTo(f, target))) < 0.1);  // animation du cadrage
        const pos = w.mesures.psv.getPosition();
        expect("vue tournée vers le pied sur la 2e photo", Math.abs(wrap(pos.yaw - yawTo(f, target))) < 0.1,
          `cap ${pos.yaw.toFixed(3)} au lieu de ${yawTo(f, target).toFixed(3)}`);
        expect("zoom gardé pour viser le pied", Math.abs(w.mesures.psv.getZoomLevel() - zoom0) < 1, `zoom ${w.mesures.psv.getZoomLevel()} au lieu de ${zoom0}`);
        // Ticket #26 : trait vertical au centre et visée de la 1re photo tracée sur celle-ci
        expect("trait vertical au centre en hauteur", !doc.querySelector("#axe-vue").hidden);
        const epi = JSON.parse(app.viewer_marks()).filter((m) => m.epipolar);
        const near = epi.length === 1 && epi[0].points.some(([y]) => Math.abs(Math.atan2(Math.sin(y - yawTo(f, target)), Math.cos(y - yawTo(f, target)))) < 0.05);
        expect("visée de la 1re photo tracée vers le pied", near, `${epi.length} tracé(s)`);
        // Traits en WebGL (src/traits.js) : pixels verts de la visée lus sur la toile, juste après une image
        const toile = doc.querySelector("canvas.traits");
        const green = await new Promise((done) => {
          const read = () => {
            w.mesures.psv.removeEventListener("render", read);
            const g = toile.getContext("webgl"), px = new Uint8Array(toile.width * toile.height * 4);
            g.readPixels(0, 0, toile.width, toile.height, g.RGBA, g.UNSIGNED_BYTE, px);
            const isGreen = (i) => px[i + 1] > 150 && px[i] < 120 && px[i + 3] > 200;
            let n = 0;
            for (let i = 0; i < px.length; i += 4) if (isGreen(i)) n++;
            // Calage : vert à moins de 2 px des points de la visée placés par la visionneuse elle-même
            const r = toile.width / toile.clientWidth;
            let placed = 0, onScreen = 0;
            for (const [yaw, pitch] of epi[0].points) {
              const c = w.mesures.psv.dataHelper.sphericalCoordsToViewerCoords({ yaw, pitch });
              if (c.x < 5 || c.y < 5 || c.x > toile.clientWidth - 5 || c.y > toile.clientHeight - 5) continue;
              onScreen++;
              let hit = false;
              for (let dx = -2; dx <= 2 && !hit; dx++) for (let dy = -2; dy <= 2 && !hit; dy++) {
                const x = Math.round((c.x + dx) * r), y = toile.height - 1 - Math.round((c.y + dy) * r);
                hit = isGreen((y * toile.width + x) * 4);
              }
              if (hit) placed++;
            }
            log(`trait WebGL : ${n} pixels verts, ${placed} points sur ${onScreen} à leur place`);
            done(onScreen > 0 && placed === onScreen ? n : 0);
          };
          w.mesures.psv.addEventListener("render", read);
          w.mesures.psv.needsUpdate();
        });
        expect("visée tracée en WebGL", green > 200, `${green} pixels verts`);
        if (location.hash === "#perf") {  // fluidité : rotation zoomée, avec puis sans les traits
          const psv = w.mesures.psv;
          const run = (label) => new Promise((done) => {
            const t0 = performance.now(), start = psv.getPosition();
            let n = 0, last = t0, worst = 0;
            const step = (now) => {
              n++; worst = Math.max(worst, now - last); last = now;
              psv.rotate({ yaw: start.yaw + 0.15 * Math.sin((now - t0) / 400), pitch: start.pitch });
              if (now - t0 < 4000) w.requestAnimationFrame(step);
              else { log(`perf ${label} : ${(n / 4).toFixed(1)} images/s, pire ${worst.toFixed(0)} ms`); done(); }
            };
            w.requestAnimationFrame(step);
          });
          for (const z of [60, 90]) {
            psv.zoom(z); await sleep(500);
            await run(`zoom ${z}, traits`);
            toile.hidden = true; await sleep(300);
            await run(`zoom ${z}, sans traits`);
            toile.hidden = false;
          }
          psv.zoom(60); await sleep(300);
        }
      }
      const announced = f === photos[1] ? predicted(f.id) : null;
      psvClick(yawTo(f, target), -0.35);
      if (f === photos[1]) compare("pied, 2e visée", announced);
      log("photo " + f.id.slice(0, 8) + " : " + JSON.parse(app.state()).quality);
    }
    log("visées : " + app.status());
    doc.querySelector("#garder").click();
    log("validé : " + doc.querySelector("#statut").textContent);
    const ref = JSON.parse(app.map_geojson()).features.filter((f) => f.properties.kind === "triangule").pop().geometry.coordinates;
    const d = Math.hypot(...metres(ref, p1));
    log("point à " + d.toFixed(2) + " m de la photo, écart à la cible " + Math.hypot(...metres(ref, target)).toFixed(3) + " m");
    log("étape 2 : " + doc.querySelector("#statut").textContent.slice(0, 120));
    // Point de référence sélectionnable dès sa validation (recalage sur sa verticale)
    const refMark = JSON.parse(app.viewer_marks()).find((m) => m.points.length === 1 && !m.guide && !m.sighting && !m.vertical);
    psvClick(refMark.points[0][0], refMark.points[0][1]);
    expect("A sélectionné avant la hauteur", JSON.parse(app.state()).point_sel);
    doc.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    expect("Entrée : A désélectionné", !JSON.parse(app.state()).point_sel);
    psvClick(yawTo(photos[1], target), 0.3);  // seul le sommet : le pied est la visée du point (-0,35)
    await until(() => doc.querySelector("#statut").textContent.startsWith("Hauteur :"), 30000, "hauteur");
    log("résultat : " + doc.querySelector("#statut").textContent);
    const box = w.mesures.psv.container;
    await soon(() => [...box.querySelectorAll(".psv-virtual-tour-arrows")].every((a) => a.ownerDocument.defaultView.getComputedStyle(a).visibility === "hidden"));
    log("dans la visionneuse : " + labelsIn().map((e) => e.textContent).join(" | ")
      + " · croix " + crossesIn() + " · sur la carte : "
      + JSON.parse(app.map_geojson()).features.map((f) => f.properties.kind).join(","));
    log("attendu sans inclinaison : " + (d * (Math.tan(0.3) + Math.tan(0.35))).toFixed(3) + " m");
    near("hauteur depuis la photo 2", metresIn(JSON.parse(app.results()).find((r) => r.kind === "mesure").text), d * (Math.tan(0.3) + Math.tan(0.35)), 0.02);
    // Même point de référence, depuis l'autre photo de la triangulation
    expect("flèches masquées en étape 2", [...box.querySelectorAll(".psv-virtual-tour-arrows")].every((a) => a.ownerDocument.defaultView.getComputedStyle(a).visibility === "hidden"));
    log("flèches masquées en étape 2 : " + [...box.querySelectorAll(".psv-virtual-tour-arrows")].every((a) => a.ownerDocument.defaultView.getComputedStyle(a).visibility === "hidden")
      + " · rappel : " + doc.querySelector("#mode-mesure").textContent
      + " · bouton nouveau point : " + !doc.querySelector("#nouvelle-reference").hidden);
    w.mesures.openPhoto(photos[0]);
    await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === photos[0].id, 30000, "photo 1");
    log("photo 1 : " + app.status().slice(0, 80));
    const d0 = Math.hypot(...metres(ref, p0));
    // Hauteur faite : un autre clic ne mesure pas, jusqu'à « Nouvelle mesure depuis A »
    const again = doc.querySelector("#nouvelle-mesure");
    expect("bouton « Nouvelle mesure depuis A » affiché", !again.hidden && again.textContent.includes("depuis A"));
    psvClick(yawTo(photos[0], target), 0.2);
    await sleep(300);
    expect("autre clic refusé", doc.querySelector("#statut").textContent.startsWith("Hauteur mesurée depuis le point A")
      && JSON.parse(app.results()).filter((r) => r.text.startsWith("↕")).length <= 1);
    again.click();
    expect("« Nouvelle mesure » : bouton masqué", again.hidden);
    psvClick(yawTo(photos[0], target), 0.2);
    await until(() => doc.querySelector("#statut").textContent.startsWith("Hauteur :"), 30000, "hauteur 2");
    log("2e hauteur : " + doc.querySelector("#statut").textContent.slice(0, 110));
    log("attendu sans inclinaison : " + (d0 * (Math.tan(0.2) + Math.tan(0.35))).toFixed(3) + " m");
    near("hauteur depuis la photo 1", metresIn(doc.querySelector("#statut").textContent), d0 * (Math.tan(0.2) + Math.tan(0.35)), 0.02);
    log("étiquettes : " + labelsIn().map((e) => e.textContent).join(" | "));
    if (location.hash === "#image") {  // vue avec sa surcouche WebGL (photo, puis traits, croix et étiquettes) en PNG
      const psv = w.mesures.psv;
      psv.rotate({ yaw: JSON.parse(app.viewer_marks()).find((m) => m.end)?.points[0][0] ?? 0, pitch: 0.05 });
      psv.zoom(0);
      await sleep(800);
      const shot = await new Promise((r) => psv.addEventListener("render", () => {  // après le dessin de la surcouche
        const [photo, layer] = [psv.renderer.renderer.domElement, psv.container.querySelector("canvas.traits")];
        const out = Object.assign(document.createElement("canvas"), { width: layer.width, height: layer.height });
        out.getContext("2d").drawImage(photo, 0, 0, layer.width, layer.height);
        out.getContext("2d").drawImage(layer, 0, 0);
        r(out.toDataURL("image/png"));
      }, { once: true }) || psv.needsUpdate());
      await log("IMAGE vue " + shot);
      await log("IMAGE vignette " + w.mesures.thumbnail().toDataURL("image/png"));  // même surcouche, lue pour la capture
    }
    // Sur l'autre photo, seulement la hauteur qui y a été prise (ticket #24 : projetée, la 2e y serait décalée)
    w.mesures.openPhoto(photos[1]);
    await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === photos[1].id, 30000, "retour photo 2");
    const heights = () => JSON.parse(app.viewer_marks()).filter((m) => m.label.startsWith("↕"));
    await soon(() => heights().length === 1);
    const second = () => heights().at(-1);  // sur la photo 1 : la 2e hauteur, seule à y avoir été prise
    log("sur la photo 2 : " + labelsIn().map((e) => e.textContent).join(" | ")
      + " · croix " + crossesIn(false));
    expect("2e hauteur absente de l'autre photo", heights().length === 1
      && !labelsIn().some((e) => e.textContent.includes("3,18")));
    // Appui dans la photo : la liste « Mode » perd le focus (sinon les flèches du recalage y changeraient le mode)
    doc.querySelector("#mode").focus();
    w.mesures.psv.container.querySelector(".psv-canvas-container").dispatchEvent(new w.PointerEvent("pointerdown", { bubbles: true }));
    expect("appui dans la photo : focus retiré de la liste Mode", doc.activeElement !== doc.querySelector("#mode"));
    // Recalage au clic, sur la photo de la mesure
    w.mesures.openPhoto(photos[0]);
    await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === photos[0].id, 30000, "photo 1 bis");
    const top = second().points[1];
    psvClick(top[0], top[1]);  // clic gauche sur la croix : sélection
    log("clic sur le sommet : " + doc.querySelector("#statut").textContent.slice(0, 60));
    psvClick(yawTo(photos[0], target), 0.25);
    await until(() => !JSON.parse(app.state()).point_sel && doc.querySelector("#statut").textContent.startsWith("Hauteur"), 30000, "recalage");
    log("sommet revisé (0,25) : " + doc.querySelector("#statut").textContent.slice(0, 160));
    log("attendu sans inclinaison : " + (d0 * (Math.tan(0.25) + Math.tan(0.35))).toFixed(3) + " m");
    near("sommet recalé au clic", metresIn(doc.querySelector("#statut").textContent), d0 * (Math.tan(0.25) + Math.tan(0.35)), 0.02);
    // Hauteur suivante depuis A sur la même photo : sommet pris sur l'axe de la première (A–C)
    again.click();
    const axis = JSON.parse(app.height_axis());
    expect("axe de la 1re hauteur proposé pour la suivante", Array.isArray(axis) && axis.length === 2);
    psvClick(axis[1][0] + 0.03, 0.1);  // clic à côté de l'axe
    await until(() => doc.querySelector("#statut").textContent.startsWith("Hauteur :"), 30000, "hauteur sur l'axe");
    const onAxisTop = second().points[1];
    const onLine = (() => {  // sommet sur le grand cercle pied–sommet de la première
      const vec = (y, p) => [Math.cos(p) * Math.sin(y), Math.sin(p), Math.cos(p) * Math.cos(y)];
      const [a, c, v] = [vec(...axis[0]), vec(...axis[1]), vec(onAxisTop[0], onAxisTop[1])];
      const n = [a[1] * c[2] - a[2] * c[1], a[2] * c[0] - a[0] * c[2], a[0] * c[1] - a[1] * c[0]];
      return Math.abs(v[0] * n[0] + v[1] * n[1] + v[2] * n[2]) / Math.hypot(...n);
    })();
    expect("sommet de la hauteur suivante sur l'axe", onLine < 1e-4, `écart ${onLine.toExponential(2)}`);
    log("hauteur sur l'axe : " + doc.querySelector("#statut").textContent.slice(0, 80) + " · écart à l'axe " + onLine.toExponential(1));
    doc.querySelector("#effacer").click();  // retirée : la suite de l'essai l'ignore
    expect("hauteur sur l'axe effacée", heights().length === 1, `${heights().length} hauteur(s)`);
    {  // Fiche PDF du point A (deux hauteurs) : page construite, photo et lignes du tableau
      const pointA = JSON.parse(app.results()).find((r) => r.kind === "point" && r.text.includes("A"));
      expect("bouton « Fiche » sur le point A", [...doc.querySelectorAll("#resultats > ol .fiche")].length === 1);
      const html = await w.mesures.buildFiche(pointA.id);
      expect("fiche : titre, photo et deux hauteurs", html.includes("point de référence A") && html.includes("data:image/jpeg")
        && (html.match(/Hauteur entre A et/g) || []).length === 2, html.slice(0, 80));
      log("fiche : " + Math.round(html.length / 1024) + " Ko · mini-carte " + (html.includes("Mini-carte indisponible") ? "absente" : "présente"));
      if (location.hash === "#fiche") log("FICHE-HTML-DEBUT\n" + html + "\nFICHE-HTML-FIN");  // à imprimer en PDF à part
      // Vue actuelle : la fiche capture la vue telle qu'affichée, sans changer de photo ni de cadrage
      const before = { id: w.mesures.psv.getPictureMetadata()?.id, ...w.mesures.psv.getPosition(), zoom: w.mesures.psv.getZoomLevel() };
      const asIs = await w.mesures.buildFiche(pointA.id, false, "Panneau STOP, carrefour D981");
      expect("fiche : titre libre", asIs.includes("Fiche de mesure — Panneau STOP, carrefour D981"));
      const after = { id: w.mesures.psv.getPictureMetadata()?.id, ...w.mesures.psv.getPosition(), zoom: w.mesures.psv.getZoomLevel() };
      expect("fiche « vue actuelle » : photo et cadrage inchangés", asIs.includes("data:image/jpeg") && before.id === after.id
        && Math.abs(before.yaw - after.yaw) < 1e-6 && Math.abs(before.zoom - after.zoom) < 1e-6 && asIs.includes(before.id));
    }
    doc.querySelector("#nouvelle-reference").click();
    log("nouveau point : " + doc.querySelector("#statut").textContent.slice(0, 60) + " · résultats : "
      + JSON.parse(app.results()).map((r) => r.text).join(" | "));
    // Troisième visée facultative (photo de l'autre côté de la référence) : incertitude annoncée
    // (avant → après) comparée à celle obtenue
    for (const f of photos) {
      w.mesures.openPhoto(f);
      await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === f.id, 30000, "nouveau pied");
      psvClick(yawTo(f, target), -0.35);
    }
    const third = (JSON.parse(app.state()).guide?.choices || [])[0];
    log("3e visée proposée : " + (third ? `${third.label} · ±${third.now?.toFixed(3)} → ±${third.expect?.toFixed(3)} m` : "aucune"));
    expect("3e visée : incertitude d'avant exacte", third && Math.abs(third.now - obtained()) < 1e-9, `${third?.now} au lieu de ${obtained()}`);
    if (third) {
      const f3 = await feature(third.id);
      w.mesures.openPhoto(f3);
      await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === f3.id, 30000, "3e photo");
      {  // vue tournée vers le point déjà triangulé par les deux premières visées
        const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
        await soon(() => Math.abs(wrap(w.mesures.psv.getPosition().yaw - yawTo(f3, target))) < 0.05);  // animation du cadrage
        const pos = w.mesures.psv.getPosition();
        const gap = wrap(pos.yaw - yawTo(f3, target));
        log(`3e photo : vue au cap ${pos.yaw.toFixed(3)}, point à ${yawTo(f3, target).toFixed(3)} (écart ${gap.toFixed(3)} rad)`);
        expect("3e visée : vue tournée vers le point triangulé", Math.abs(gap) < 0.05, gap.toFixed(3));
      }
      log("3e photo à " + Math.hypot(...metres(target, f3.geometry.coordinates)).toFixed(1) + " m du pied");
      psvClick(yawTo(f3, target), -0.35);
      compare("pied, 3e visée", third.expect);
    }
    expect("pas d'alerte RTK sur des photos RTK", !doc.querySelector("#alerte-rtk").open);
    {  // Couche importée (GeoJSON en WGS 84) : un point sur la cible, une ligne ; étiquette d'une colonne
      const f3 = photos[0];
      w.mesures.openPhoto(f3);
      await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === f3.id, 30000, "photo de la couche");
      const geojson = { type: "FeatureCollection", features: [
        { type: "Feature", properties: { nom: "cible", h: 1.5, ok: true }, geometry: { type: "Point", coordinates: target } },
        { type: "Feature", properties: { nom: "ligne", h: 2, ok: false }, geometry: { type: "LineString", coordinates: [target, mid] } },
        // deux bornes serrées contre la cible : étiquettes à écarter
        { type: "Feature", properties: { nom: "p2", h: 3 }, geometry: { type: "Point", coordinates: [target[0] + 0.000004, target[1]] } },

        const folder = typeof file === "string" ? file : await file.text();
        const parsed = JSON.parse(folder);
        expect("dossier : fichier nommé et rempli", /^dossier .*\d{4}-\d{2}-\d{2}\.json$/.test(fileName) && parsed.format === "web-measures/dossier"
          && parsed.couche?.name === "e.csv" && parsed.favoris?.some((f) => f.id === fav) && parsed.modeles?.length > 0
          && !("mesures" in parsed) && JSON.parse(app.export_geojson()).features.length > 0, `${fileName} ${Object.keys(parsed)}`);  // mesures faites, pas dans le dossier
        doc.querySelector("#couche-retirer").click();
        w.localStorage.setItem("web-measures/favoris", "[]");
        const dialog = doc.querySelector("#importer-dossier");
        const box = (key) => dialog.querySelector(`input[value="${key}"]`);
        drop("dossier.json", folder);
        await until(() => dialog.open, 5000, "fenêtre du dossier");
        expect("dossier : une case par partie, couche cochée sans couche en place", box("couche")?.checked && box("favoris")?.checked
          && box("calage")?.checked, [...dialog.querySelectorAll("li")].map((li) => li.textContent).join(" | "));
        dialog.querySelector('button[value="importer"]').click();
        await expectSoon("dossier : couche et favoris repris", () => doc.querySelector("#couche-nom").textContent === "e.csv"
          && kept("favoris").includes(fav));
        drop("dossier.json", folder);
        await until(() => dialog.open, 5000, "fenêtre du dossier, couche en place");
        expect("dossier : couche décochée quand une couche est en place", !box("couche").checked && /remplacera/.test(box("couche").closest("li").textContent));
        dialog.querySelector('button[value=""]').click();
        doc.querySelector("#couche-retirer").click();
      }
    }
    await verdict();
  } catch (e) { log("ERREUR " + e); }
  await log("FIN");
})();
</script>
