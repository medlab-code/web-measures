<!-- Chute et dévers des bords de route hors pont, bouton « Dévers » (ticket #31) : photos de la séquence à 30-120 m des
     ponts de tests/essai-ponts.html (remblais d'approche, ruisseau). Journal seulement : pas encore de
     talus de hauteur connue ; Pouilly-en-Auxois (photos RTK de essai-largeur.html, largeur réelle non relevée) pour les bords
     trouvés. Lancer comme tests/navigateur.html. -->
<script>try { localStorage.clear(); } catch {}</script>
<iframe id="f" src="../index.html" style="width:1400px;height:900px;border:0"></iframe>
<script>
const log = (t) => fetch("/journal", { method: "POST", body: String(t) }).catch(() => {});
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const BRIDGES = ["2eed13c0-cb03-437f-9752-2f3b6b0d0478", "e375c98e-31c5-426a-ba93-c63ac344d675"];
(async () => {
  const w = document.getElementById("f").contentWindow;
  let shown = 0, drawn = 0, images = 0, butte = false, zoomed = 0, twin = 0, separated = 0;
  try {
    const t0 = Date.now();
    while (!(w.mesures?.app && w.mesures.map?.loaded?.())) { if (Date.now() - t0 > 120000) throw new Error("Pyodide"); await sleep(250); }
    const doc = w.document;
    doc.querySelector("#reglages-defaut")?.close();
    const pouilly = (await (await fetch("https://panoramax.ign.fr/api/search?ids=cd8cf3a0-6567-40f0-8805-94172a5dfc3c")).json()).features[0];
    const places = [[pouilly, 0, "Pouilly"]];
    for (const id of BRIDGES) {
      const b = (await (await fetch("https://panoramax.ign.fr/api/search?ids=" + id)).json()).features[0];
      const [lon, lat] = b.geometry.coordinates, d = 0.0015;
      const near = (await (await fetch(`https://panoramax.ign.fr/api/search?limit=40&collections=${b.collection}&bbox=${lon - d},${lat - d},${lon + d},${lat + d}`)).json()).features;
      const far = near.map((f) => [f, Math.hypot((f.geometry.coordinates[0] - lon) * 75000, (f.geometry.coordinates[1] - lat) * 111000)])
        .filter(([, m]) => m > 30 && m < 120).sort((a, c) => a[1] - c[1]).filter((_, k) => k % 3 === 0).slice(0, 5);
      places.push(...far.map(([f, m]) => [f, m, `${Math.round(m)} m du pont ${id.slice(0, 8)}`]));
    }
    for (const [f, , where] of places) {
      w.mesures.openPhoto(f);
      await sleep(4000);
      const button = doc.querySelector("#bords");
      if (!button.disabled) button.click();
      await sleep(8000);
      const c = doc.querySelector("#chute");
      if (!c.hidden) shown++;
      butte ||= /pas de chute avant le terrain qui remonte/.test(c.textContent);  // lecture arrêtée au moins une fois
      const profile = doc.querySelector("#profil");
      if (!profile.disabled) {
        profile.click();
        await sleep(300);
        const dialog = doc.querySelector("#fenetre-profil"), svg = dialog.querySelector("svg");
        drawn += dialog.open && svg?.querySelector(".sol") ? 1 : 0;
        await sleep(700);  // titre complété par le lieu (route, PR, commune)
        log(`  profil : ${dialog.querySelector("h2").textContent} · ${[...dialog.querySelectorAll(".legende li, .legende p")].map((e) => e.textContent).join(" | ")}`);
        // Image du bouton « Enregistrer en PNG » (Profil.png), sans la boîte d'enregistrement
        if (images++ < 3) {
          const blob = await w.eval("Profil").png(svg, dialog.querySelector("h2").textContent, dialog.querySelector(".legende"));
          await log(`IMAGE ${f.id.slice(0, 8)} ` + await new Promise((r) => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(blob); }));
        }
        dialog.close();
      }
      log(`${where} ${f.id.slice(0, 8)}${button.disabled ? " (bouton grisé ensuite)" : ""} : ${c.hidden ? "(rien)" : c.textContent.replace(/\n/g, " · ")}`
        + ` · bords trouvés : ${(c.title.match(/Bords trouvés : (.*)\.$/) || [])[1] || "?"}`);
    }
    // La Roche-en-Brenil (D15A), réglette à 30 m : buttes boisées des deux côtés ; à droite, le travers à −10 m
    // remonte de plus d'1 m (lecture arrêtée), à gauche de 0,75 m seulement (chute lue jusqu'à 26 m du bord)
    const zone = doc.querySelector("#bords-largeur");
    zone.value = 30;
    zone.dispatchEvent(new w.Event("change"));
    // D70 (même commune) : route en haut d'un remblai d'environ 7 m des deux côtés : dévers du talus entier
    for (const [id, where] of [["2d55af6d-61f1-4ff1-a881-16bf27b2fef1", "La Roche-en-Brenil D15A"],
      ["229abfcd-868c-4eca-bfc1-3979ca94d28f", "La Roche-en-Brenil D70"],
      ["a0ce6487-bf25-4351-a302-228876829900", "La Roche-en-Brenil D70 PR 2 +0797"]]) {
      const f = (await (await fetch("https://panoramax.ign.fr/api/search?ids=" + id)).json()).features[0];
      w.mesures.openPhoto(f);
      await sleep(4000);
      doc.querySelector("#bords").click();
      await sleep(8000);
      log(`${where} ${id.slice(0, 8)} (30 m) : ${doc.querySelector("#chute").textContent.replace(/\n/g, " · ")}`);
      const profile = doc.querySelector("#profil");
      if (profile.disabled) continue;
      profile.click();
      await sleep(1000);
      const dialog = doc.querySelector("#fenetre-profil");
      const blob = await w.eval("Profil").png(dialog.querySelector("svg"), dialog.querySelector("h2").textContent, dialog.querySelector(".legende"));
      await log(`IMAGE ${id.slice(0, 8)} ` + await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }));
      // Loupe : graphique agrandi sans la légende, la fenêtre dans la visionneuse ; à nouveau : taille normale
      const before = dialog.querySelector("svg").getBoundingClientRect().width;
      doc.querySelector("#profil-loupe").click();
      await sleep(500);
      const r = dialog.getBoundingClientRect(), v = doc.querySelector("#vue").getBoundingClientRect();
      const after = dialog.querySelector("svg").getBoundingClientRect();
      const inside = r.left >= v.left - 1 && r.right <= v.right + 1 && r.top >= v.top - 1 && r.bottom <= v.bottom + 1;
      const snug = v.right - v.left - (r.right - r.left) <= 20 || v.bottom - v.top - (r.bottom - r.top) <= 20;  // collée à un bord
      log(`  loupe : graphique ${Math.round(before)} → ${Math.round(after.width)} × ${Math.round(after.height)} px, fenêtre `
        + `${Math.round(r.width)} × ${Math.round(r.height)} dans la visionneuse ${Math.round(v.width)} × ${Math.round(v.height)}`
        + ` · dedans : ${inside} · au plus grand : ${snug} · légende masquée : ${!dialog.querySelector(".legende").offsetHeight}`);
      if (after.width > before && inside && snug && !dialog.querySelector(".legende").offsetHeight) zoomed++;
      doc.querySelector("#profil-loupe").click();
      await sleep(300);
      if (Math.abs(dialog.querySelector("svg").getBoundingClientRect().width - before) > 1 || !dialog.querySelector(".legende").offsetHeight) zoomed = -99;
      dialog.close();
    }
    // Chaussées séparées : RD903bis à Épagny (séparateur surélevé vers 3,5 m, fossé vers 19 m à gauche), D1074 à
    // Pommard (séparateur surélevé de ~3 à 8 m), RD700 à Couternon (bosse vers 8 m) et à Varois-et-Chaignot (glissières
    // dos à dos : pic étroit vers 6,5 m) : séparateur trouvé dans le relief, bord gauche au-delà de 15 m
    for (const [id, where] of [["1640bc3f-e948-4239-a4c1-548dd748a16d", "RD903bis Épagny"],
      ["6d99cba2-2284-4215-a3fb-1fd390353005", "D1074 Pommard"], ["d63ace61-7261-4acb-93f9-788aed29cb23", "RD700 Couternon"],
      ["067e83ca-a3d8-4f2a-bbe6-0c10df70fc96", "RD700 Varois-et-Chaignot (glissières dos à dos)"]]) {
      const f = (await (await fetch("https://panoramax.ign.fr/api/search?ids=" + id)).json()).features[0];
      w.mesures.openPhoto(f);
      await sleep(4000);
      doc.querySelector("#bords").click();
      await sleep(8000);
      const c = doc.querySelector("#chute"), found = (c.title.match(/Bords trouvés : (.*)\.$/) || [])[1] || "?";
      log(`${where} ${id.slice(0, 8)} : ${c.textContent.replace(/\n/g, " · ")} · bords trouvés : ${found}`);
      const left = Number(((/côté gauche à (\d+(?:,\d+)?) m/.exec(found) || [])[1] || "0").replace(",", "."));
      if (!/séparateur de chaussée \(trouvé dans le relief\)/.test(found) || left < 15) separated = -99;
      else separated++;
    }
    // A38 à chaussées séparées (ticket #34) : du côté du terre-plein central, la plateforme va jusqu'au bord extérieur
    // de l'autre chaussée (son axe à ~12 m de la photo, 10 m de large)
    { const f = (await (await fetch("https://panoramax.ign.fr/api/search?ids=61dd94c4-e5d1-4eb0-9762-73a72f18b5cb")).json()).features[0];
      w.mesures.openPhoto(f);
      await sleep(4000);
      doc.querySelector("#bords").click();
      await sleep(8000);
      const c = doc.querySelector("#chute"), found = (c.title.match(/Bords trouvés : (.*)\.$/) || [])[1] || "?";
      log(`A38 61dd94c4 (30 m) : ${c.textContent.replace(/\n/g, " · ")} · bords trouvés : ${found}`);
      const far = /séparateur de chaussée \(trouvé dans le relief\) et de l'autre chaussée/.exec(found);
      const widths = [...found.matchAll(/à (\d+(?:,\d+)?) m de/g)].map((m) => Number(m[1].replace(",", ".")));
      twin = far && widths.some((d) => d > 15) ? 1 : 0;
      if (!doc.querySelector("#profil").disabled) {
        doc.querySelector("#profil").click();
        await sleep(1000);
        const dialog = doc.querySelector("#fenetre-profil");
        if (![...dialog.querySelectorAll("svg text")].some((e) => e.textContent === "séparateur de chaussée (relief)")
          || !dialog.querySelector("svg .separateur")) twin = 0;
        const blob = await w.eval("Profil").png(dialog.querySelector("svg"), dialog.querySelector("h2").textContent, dialog.querySelector(".legende"));
        await log("IMAGE 61dd94c4 " + await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }));
        // Hauteurs à l'échelle : profil presque plat, étiquettes écartées l'une de l'autre
        const scale = doc.querySelector("#profil-echelle");
        scale.checked = true; scale.dispatchEvent(new w.Event("change"));
        const flat = await w.eval("Profil").png(dialog.querySelector("svg"), dialog.querySelector("h2").textContent, dialog.querySelector(".legende"));
        await log("IMAGE 61dd94c4-echelle " + await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(flat); }));
        scale.checked = false; scale.dispatchEvent(new w.Event("change"));
        dialog.close();
      } }
    log(`encadrés affichés : ${shown} · profils dessinés : ${drawn} · loupe : ${zoomed} · chaussées séparées : ${twin} · séparateur dans le relief : ${separated}`);
  } catch (e) { log("exception " + e); }
  log(shown && drawn === shown - 1 && butte && zoomed > 0 && twin && separated === 4 ? "FIN" : `ERREUR encadrés ${shown}, profils ${drawn}`);  // le pont : pas de profil
})();
</script>
