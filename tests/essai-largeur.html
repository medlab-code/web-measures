<!-- Largeur sur deux photos imajbox à position RTK (Pouilly-en-Auxois) : premier bord
     triangulé sur une cible fictive à 5 m sur le côté, puis bord opposé cliqué à 8 m sur la
     droite de mesure, depuis une photo prise avant. Directions calculées depuis le cap EXIF
     précis. Lancer comme tests/navigateur.html (voir CLAUDE.md). -->
<script>try { localStorage.clear(); } catch {}</script>
<iframe id="f" src="../index.html" style="width:1400px;height:900px"></iframe>
<script>
const log = (t) => fetch("/journal", { method: "POST", body: String(t) }).catch(() => {});
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// Contrôles : valeur comparée à l'attendu, avec une tolérance ; échecs journalisés (« ÉCHEC ») et
// comptés, bilan avant « FIN » (« ERREUR » s'il y en a : le serveur d'essai s'arrête)
let failures = 0, checks = 0;
const expect = (what, ok, detail = "") => {
  checks++;
  if (!ok) {
    failures++;
    log("ÉCHEC " + what + (detail ? " : " + detail : ""));
  }
};
const near = (what, value, expected, tol) =>
  expect(what, Math.abs(value - expected) <= tol, `${value} au lieu de ${expected.toFixed(3)} (±${tol})`);
const metresIn = (text) => Number(((text || "").match(/(\d+,\d+) m\b/) || [])[1]?.replace(",", "."));
const verdict = () => log(failures ? `ERREUR ${failures} contrôle(s) sur ${checks} en échec` : `contrôles : ${checks} réussis`);
async function until(test, ms, what) { const t0 = Date.now(); while (!test()) { if (Date.now() - t0 > ms) throw new Error("délai dépassé : " + what); await sleep(250); } }
const feature = async (id) => (await (await fetch("https://api.panoramax.xyz/api/search?ids=" + id)).json()).features[0];
const IDS = ["cd8cf3a0-6567-40f0-8805-94172a5dfc3c", "1108ca14-6669-49e8-a26a-955becc79e81"];
(async () => {
  const w = document.getElementById("f").contentWindow;
  try {
    await until(() => w.mesures?.app && w.mesures.map?.loaded?.(), 120000, "Pyodide");
    const app = w.mesures.app, doc = w.document;
    // Incertitude annoncée sur le bouton d'une photo proposée, puis obtenue après la visée réelle
    const predicted = (id) => (JSON.parse(app.state()).guide?.choices || []).find((c) => c.id === id)?.expect;
    const obtained = () => { const r = app.triangulator.result; return r ? r.get("uncertainty") : null; };
    const compare = (what, before) => {
      const after = obtained();
      log(`${what} : annoncée ±${before?.toFixed(3)} m, obtenue ±${after?.toFixed(3)} m`);
      expect(`${what} : incertitude annoncée à 30 % près`, before != null && after != null
        && Math.abs(after - before) <= 0.3 * after, `annoncée ${before}, obtenue ${after}`);
    };
    doc.querySelector("#reglages-defaut")?.close();  // réglages par défaut (CD21, instance IGN) : fenêtre fermée
    // Photos de niveau : inclinaison nulle calée à la main (deux objets verticaux à 90°), comme
    // le supposent les clics de l'essai, calculés sans inclinaison. Sans cela, l'inclinaison
    // automatique, arrivée après coup, recalculerait visées, point et mesures (session._recompute)
    // loin des valeurs attendues.
    const level = [[[30, -10], [30, 15]], [[120, -10], [120, 15]]];
    app.merge_calibration(JSON.stringify({ format: 1, verticals: Object.fromEntries(IDS.map((id) => [id, level])) }));
    // Sol LiDAR au point non lu : les clics de l'essai visent un pied à 2 m sous la caméra
    // (inclinaison fixe), pas le sol réel ; le calcul l'opposerait à l'altitude lue au point
    // (vérifié par les tests du cœur, test_triangulation et test_session)
    const noGround = (lon, lat, done) => done(undefined);
    app._ground_lookup = noGround;
    app.triangulator.ground_lookup = noGround;
    const psvClick = (yaw, pitch) => { const e = new Event("click"); e.data = { yaw, pitch, rightclick: false }; w.mesures.psv.dispatchEvent(e); };
    const psvRight = (yaw, pitch) => { const e = new Event("click"); e.data = { yaw, pitch, rightclick: true }; w.mesures.psv.dispatchEvent(e); };
    doc.querySelector("#mesure").click();
    doc.querySelector("#mode").value = "road"; doc.querySelector("#mode").dispatchEvent(new Event("change"));
    const photos = await Promise.all(IDS.map(feature));
    const heading = (f) => { const [n, d] = f.properties.exif["Exif.GPSInfo.GPSImgDirection"].split("/"); return n / d; };
    const metres = ([lon, lat], [lon0, lat0]) => [(lon - lon0) * 111320 * Math.cos(lat0 * Math.PI / 180), (lat - lat0) * 111320];
    const [p0, p1] = photos.map((f) => f.geometry.coordinates);
    const mid = [(p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2];
    const along = Math.atan2(...metres(p1, p0));
    const target = [mid[0] + 5 * Math.cos(along) / (111320 * Math.cos(mid[1] * Math.PI / 180)), mid[1] - 5 * Math.sin(along) / 111320];
    const yawTo = (f, pt) => { const [x, y] = metres(pt, f.geometry.coordinates); return Math.atan2(x, y) - heading(f) * Math.PI / 180; };
    log("photos à " + Math.hypot(...metres(p1, p0)).toFixed(2) + " m l'une de l'autre");
    // Visée suivante : vue tournée vers le point placé par la première visée, zoom gardé
    const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
    const aimedAt = (what, f, pt, zoom0) => {
      const pos = w.mesures.psv.getPosition(), zoom = w.mesures.psv.getZoomLevel();
      expect("vue tournée vers " + what, Math.abs(wrap(pos.yaw - yawTo(f, pt))) < 0.1, `cap ${pos.yaw.toFixed(3)} au lieu de ${yawTo(f, pt).toFixed(3)}`);
      expect("zoom gardé pour viser " + what, Math.abs(zoom - zoom0) < 1, `zoom ${zoom} au lieu de ${zoom0}`);
    };
    for (const f of photos) {
      w.mesures.psv.zoom(f === photos[0] ? 0 : 60);  // dézoomé sur la 1re : rappel de zoom
      w.mesures.openPhoto(f);
      await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === f.id, 30000, "photo");
      const zoom0 = w.mesures.psv.getZoomLevel();
      await until(() => JSON.parse(app.state()).quality.includes("vérifiée"), 60000, "position vérifiée");
      await sleep(1000);
      if (f === photos[1]) {
        await sleep(1500);
        aimedAt("le point de référence", f, target, zoom0);
      }
      const announced = f === photos[1] ? predicted(f.id) : null;
      doc.querySelector("#avis").hidden = true;
      psvClick(yawTo(f, target), -0.35);
      if (f === photos[1]) compare("bord A, 2e visée", announced);
      { const psv = w.mesures.psv, px = psv.state.vFov / psv.container.clientHeight;  // degrés par pixel de l'écran
        const photoPx = 360 / (psv.state.textureData?.panoData?.fullWidth || 12288), avis = doc.querySelector("#avis");
        const shown = !avis.hidden && avis.textContent.startsWith("Zoomez");
        log(`zoom ${psv.getZoomLevel()} : ${px.toFixed(4)}°/px écran, ${photoPx.toFixed(4)}°/px photo · rappel ${shown}`);
        expect("rappel de zoom si un pixel de l'écran couvre plus de 2 pixels de la photo", shown === px > 2 * photoPx); }
    }
    log("liseré pendant les visées : " + doc.querySelector("#vue").className + " · " + getComputedStyle(doc.querySelector("#vue"), "::after").borderTopColor
      + " · état : " + doc.querySelector("#etat-mesure").textContent + " " + getComputedStyle(doc.querySelector("#etat-mesure")).color
      + " " + getComputedStyle(doc.querySelector("#etat-mesure"), "::before").animationName);
    log("visées : " + app.status());
    // Points d'un repère dans la vue affichée (cap, élévation dans le champ de la visionneuse)
    const inView = (points) => {
      const psv = w.mesures.psv, pos = psv.getPosition(), vfov = psv.state.vFov * Math.PI / 180;
      const hfov = psv.state.hFov * Math.PI / 180, wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
      return points.every((p) => Math.abs(wrap(p[0] - pos.yaw)) < hfov / 2 && Math.abs(p[1] - pos.pitch) < vfov / 2);
    };
    doc.querySelector("#garder").click();
    log("validé : " + doc.querySelector("#statut").textContent);
    await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === photos[0].id, 30000, "retour sur la photo de référence (A)");
    await sleep(2500);  // animation du cadrage
    { const markA = JSON.parse(app.viewer_marks()).find((m) => m.points.length === 1 && !m.guide && !m.sighting && !m.vertical && !m.name);
      expect("vue cadrée sur A au retour", markA && inView(markA.points)); }
    log("liseré après validation : " + doc.querySelector("#vue").className + " · " + getComputedStyle(doc.querySelector("#vue"), "::after").borderTopColor
      + " · état : " + doc.querySelector("#etat-mesure").textContent + " " + getComputedStyle(doc.querySelector("#etat-mesure")).color
      + " " + getComputedStyle(doc.querySelector("#etat-mesure"), "::before").animationName);

    await sleep(300);
    log("croix du point de référence : " + w.mesures.psv.container.querySelectorAll(".croix:not(.visee)").length
      + " · visées bleues : " + w.mesures.psv.container.querySelectorAll(".croix.visee").length);
    await until(() => JSON.parse(app.map_geojson()).features.some((f) => f.properties.kind === "trace"), 30000, "axe de la route");
    const features = JSON.parse(app.map_geojson()).features;
    const ref = features.filter((f) => f.properties.kind === "triangule").pop().geometry.coordinates;
    const [g0, g1] = features.find((f) => f.properties.kind === "trace").geometry.coordinates;
    const [ux, uy] = metres(g1, g0).map((v) => v / 30);  // droite de mesure : 2 × 15 m
    log("étape 2 : " + app.status().slice(0, 200));
    const box = w.mesures.psv.container;
    await sleep(500);
    log("droite dans la photo : " + box.querySelectorAll("[id*='-guide']").length + " · flèches masquées : "
      + [...box.querySelectorAll(".psv-virtual-tour-arrows")].every((a) => a.style.visibility === "hidden")
      + " · rappel : " + doc.querySelector("#mode-mesure").textContent);
    // Bord opposé à 8 m sur la droite, de l'autre côté de la route, depuis la première photo
    const side = Math.sign(ux * metres(p0, ref)[0] + uy * metres(p0, ref)[1]);
    const toLonLat = ([x, y]) => [ref[0] + x / (111320 * Math.cos(ref[1] * Math.PI / 180)), ref[1] + y / 111320];
    const b = toLonLat([side * 8 * ux, side * 8 * uy]);
    w.mesures.openPhoto(photos[0]);
    await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === photos[0].id, 30000, "photo 1");
    await sleep(1000);
    log("croix du point sur l'autre photo : " + box.querySelectorAll(".croix:not(.visee)").length);
    // Point de référence sélectionnable dès sa validation, avant toute largeur
    const refMark = JSON.parse(app.viewer_marks()).find((m) => m.points.length === 1 && !m.guide && !m.sighting && !m.vertical);
    psvClick(refMark.points[0][0], refMark.points[0][1]);
    expect("A sélectionné avant la largeur", JSON.parse(app.state()).point_sel);
    doc.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    expect("Entrée : A désélectionné", !JSON.parse(app.state()).point_sel);
    psvClick(yawTo(photos[0], b), -0.3);
    await sleep(500);
    log("largeur : " + doc.querySelector("#statut").textContent);
    near("largeur", metresIn(doc.querySelector("#statut").textContent), 8, 0.02);
    // Largeur faite : un autre clic n'en mesure pas une autre, jusqu'à « Nouvelle mesure depuis A »
    const again = doc.querySelector("#nouvelle-mesure");
    const widthsCount = () => JSON.parse(app.viewer_marks()).filter((m) => m.label.startsWith("↔")).length;
    expect("bouton « Nouvelle mesure depuis A » affiché", !again.hidden && again.textContent.includes("depuis A"));
    expect("pas de « Nouveau point de référence » en largeur", doc.querySelector("#nouvelle-reference").hidden);
    psvClick(yawTo(photos[0], toLonLat([side * 12 * ux, side * 12 * uy])), -0.3);
    await sleep(300);
    expect("autre clic refusé : une seule largeur", widthsCount() === 1);
    log("autre clic : " + doc.querySelector("#statut").textContent.slice(0, 80));
    log("étiquettes : " + [...box.querySelectorAll(".etiquette")].map((e) => e.textContent).join(" | ")
      + " · carte : " + JSON.parse(app.map_geojson()).features.map((f) => f.properties.kind).join(","));
    if (location.hash === "#capture") await sleep(5000);  // capture d'écran de la vue (outil d'essai)
    // Carte : l'étiquette de la largeur ne couvre ni le trait ni ses bouts (croix), même trait court
    const map = w.mesures.map;
    const clearOfLine = (what) => {
      const f = JSON.parse(app.map_geojson()).features.find((g) => g.properties.kind === "mesure" && g.properties.label);
      const el = [...map.getContainer().querySelectorAll(".etiquette")].find((e) => e.textContent === f.properties.label);
      const r = el.getBoundingClientRect(), c = map.getContainer().getBoundingClientRect();
      const [pa, pb] = [f.geometry.coordinates[0], f.geometry.coordinates.at(-1)].map((p) => map.project(p))
        .map((p) => ({ x: p.x + c.left, y: p.y + c.top }));
      const inside = (p, m) => p.x > r.left - m && p.x < r.right + m && p.y > r.top - m && p.y < r.bottom + m;
      const line = Array.from({ length: 101 }, (_, i) => ({ x: pa.x + (pb.x - pa.x) * i / 100, y: pa.y + (pb.y - pa.y) * i / 100 }));
      const length = Math.round(Math.hypot(pb.x - pa.x, pb.y - pa.y));
      expect(what, !line.some((p) => inside(p, 1)) && ![pa, pb].some((p) => inside(p, 9)),
        `étiquette ${Math.round(r.left)},${Math.round(r.top)} ${Math.round(r.width)}×${Math.round(r.height)}, trait de ${length} px`);
      return length;
    };
    const length = clearOfLine("carte : étiquette à côté du trait");
    for (const target of [60, 35]) {  // trait court : l'étiquette tombait sur un bout
      map.jumpTo({ zoom: map.getZoom() + Math.log2(target / length) });
      await sleep(500);
      clearOfLine(`carte : étiquette à côté d'un trait de ${target} px`);
      map.jumpTo({ zoom: map.getZoom() - Math.log2(target / length) });
    }
    // Autre photo : la largeur reste visible ; recalage du bord, puis du point de référence
    w.mesures.openPhoto(photos[1]);
    await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === photos[1].id, 30000, "photo 2");
    await sleep(1000);
    const width = () => JSON.parse(app.viewer_marks()).find((m) => m.label.startsWith("↔"));
    log("sur l'autre photo : " + [...box.querySelectorAll(".etiquette")].map((e) => e.textContent).join(" | ")
      + " · croix " + box.querySelectorAll(".croix").length);
    const [markA, markB] = width().points;
    psvClick(markB[0], markB[1]);  // clic gauche sur la croix : sélection
    log("clic sur B : " + doc.querySelector("#statut").textContent.slice(0, 60) + " · choisi : " + width().points[1][2]);
    const b9 = toLonLat([side * 9 * ux, side * 9 * uy]);
    psvClick(yawTo(photos[1], b9), -0.3);
    log("B recalé : " + doc.querySelector("#statut").textContent.slice(0, 120));
    near("bord recalé au clic", metresIn(doc.querySelector("#statut").textContent), 9, 0.05);
    // Flèches du clavier : bord puis point de référence, de 1 cm le long de la droite
    const key = (k) => doc.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true }));
    const [, markB2] = width().points;
    const yawOf = (i) => width().points[i][0];
    psvRight(markB2[0], markB2[1]);
    let y0 = yawOf(1);
    key("ArrowRight"); key("ArrowRight");
    const right = yawOf(1) > y0;
    y0 = yawOf(1);
    key("ArrowLeft");
    expect("bord : → vers la droite, ← vers la gauche", right && yawOf(1) < y0);
    log("bord : → vers la droite " + right + " · ← vers la gauche " + (yawOf(1) < y0) + " · "
      + doc.querySelector("#statut").textContent.slice(0, 160));
    key("Enter");
    log("après Entrée : " + JSON.parse(app.results()).map((r) => r.text).join(" | ") + " · sélection : " + JSON.parse(app.state()).point_sel);
    psvRight(markA[0], markA[1]);
    y0 = yawOf(0);
    key("ArrowRight"); key("ArrowRight");
    const rightA = yawOf(0) > y0;
    y0 = yawOf(0);
    key("ArrowLeft");
    expect("point : → vers la droite, ← vers la gauche", rightA && yawOf(0) < y0);
    log("point : → vers la droite " + rightA + " · ← vers la gauche " + (yawOf(0) < y0) + " · "
      + doc.querySelector("#statut").textContent.slice(0, 120));
    doc.querySelector("#effacer").click();
    psvRight(markA[0], markA[1]);
    log("clic droit sur A : " + doc.querySelector("#statut").textContent.slice(0, 60));
    psvClick(yawTo(photos[1], target), -0.35);
    log("A recalé : " + doc.querySelector("#statut").textContent + " · " + JSON.parse(app.results()).map((r) => r.text).join(" | "));
    expect("A recalé sur la droite de mesure", doc.querySelector("#statut").textContent.includes("le long de la droite de mesure"));
    again.click();
    expect("« Nouvelle mesure » : bouton masqué", again.hidden);
    psvClick(yawTo(photos[1], toLonLat([side * 12 * ux, side * 12 * uy])), -0.3);
    await sleep(300);
    expect("seconde largeur depuis A", widthsCount() === 2 && !again.hidden);
    {  // Bord posé sur la droite de mesure dans la direction du clic, pas là où l'on a cliqué (#18)
      const marks = JSON.parse(app.viewer_marks()), wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
      const line = marks.find((m) => m.guide && !m.vertical && !m.epipolar).points;
      const onLine = (yaw) => {  // élévation de la droite tracée sous ce cap
        for (let i = 1; i < line.length; i++) {
          const span = wrap(line[i][0] - line[i - 1][0]), t = span ? wrap(yaw - line[i - 1][0]) / span : -1;
          if (t >= 0 && t <= 1) return line[i - 1][1] + t * (line[i][1] - line[i - 1][1]);
        }
        return NaN;
      };
      const edge = marks.filter((m) => m.label.startsWith("↔")).pop().points[1];
      const clickYaw = yawTo(photos[1], toLonLat([side * 12 * ux, side * 12 * uy]));
      log(`bord : cap ${edge[0].toFixed(4)} (clic ${clickYaw.toFixed(4)}), élévation ${edge[1].toFixed(4)} (droite ${onLine(edge[0]).toFixed(4)}, clic -0.3)`);
      expect("bord dans la direction du clic", Math.abs(wrap(edge[0] - clickYaw)) < 0.01);
      expect("bord posé sur la droite de mesure", Math.abs(edge[1] - onLine(edge[0])) < 0.005);
      // Pointeur au-dessus de la droite : repère qui glisse dessus, sous le même cap
      const psv = w.mesures.psv, box = psv.container.getBoundingClientRect();
      const markA = marks.filter((m) => m.label.startsWith("↔")).pop().points[0];
      const mid = edge[0] + wrap(markA[0] - edge[0]) / 2;  // entre A et le bord : sur la droite tracée
      psv.rotate({ yaw: mid, pitch: edge[1] });
      await sleep(300);
      const at = psv.dataHelper.sphericalCoordsToViewerCoords({ yaw: mid, pitch: edge[1] + 0.1 });
      const canvas = psv.container.querySelector(".psv-canvas-container");
      const move = async (target) => {
        target.dispatchEvent(new w.PointerEvent("pointermove", { clientX: box.left + at.x, clientY: box.top + at.y, bubbles: true }));
        await sleep(200);
        try { return psv.getPlugin("markers").getMarker("glisse-largeur"); } catch { return null; }  // absent
      };
      // Largeur faite : un clic ne pose plus de bord, pointeur libre (pour les boutons de la visionneuse)
      expect("largeur faite : réticule libre", !(await move(canvas)) && !psv.container.classList.contains("sur-droite"));
      psvClick(edge[0], edge[1]);  // clic sur la croix du bord : sélectionné, à recaler
      expect("bord sélectionné", JSON.parse(app.state()).point_sel);
      const slide = await move(canvas);
      const pos = slide?.state?.position ?? slide?.config?.position;
      log("repère glissant : " + (pos ? `cap ${pos.yaw.toFixed(4)}, élévation ${pos.pitch.toFixed(4)} (droite ${onLine(pos.yaw).toFixed(4)})` : "absent"));
      expect("repère glissant sur la droite sous le pointeur", pos && Math.abs(wrap(pos.yaw - mid)) < 0.01
        && Math.abs(pos.pitch - onLine(pos.yaw)) < 0.005);
      expect("pointeur masqué, remplacé par le réticule", getComputedStyle(psv.container.querySelector(".psv-canvas-container") || psv.container).cursor === "none"
        && psv.container.querySelector(".glisse svg circle"));
      const button = psv.container.querySelector("button, .psv-button");  // flèche de la visite
      expect("pointeur rendu sur les boutons de la visionneuse", button && !(await move(button)) && !psv.container.classList.contains("sur-droite"));
      await move(canvas);
      psv.container.dispatchEvent(new w.PointerEvent("pointerleave"));
      expect("pointeur rendu hors de la photo", !psv.container.classList.contains("sur-droite"));
      key("Enter");
      expect("Entrée : bord désélectionné", !JSON.parse(app.state()).point_sel);
    }
    log("résultats : " + JSON.parse(app.results()).map((r) => r.text).join(" | "));
    // Bord opposé triangulé à son tour : bouton proposé après le clic simple, visées depuis la
    // photo de référence puis une autre, validation, retour sur la photo de référence
    const triB = doc.querySelector("#trianguler-b");
    // le bouton nomme le bord cliqué par sa lettre (provisoire)
    expect(`bouton « ${triB.textContent} » proposé`, !triB.hidden && /Trianguler le point [A-Z]+ /.test(triB.textContent));
    const edgeB = JSON.parse(app.viewer_marks()).filter((m) => m.label.startsWith("↔")).pop().points[1];
    triB.click();
    expect("bord opposé en visée, bouton masqué", JSON.parse(app.state()).edge_b_aiming && triB.hidden);
    expect("clic rapide compté comme 1re visée", app.status().includes("première visée"));
    { const marks = JSON.parse(app.viewer_marks()), cross = marks.find((m) => m.sighting)?.points[0];
      log("croix bleue : " + JSON.stringify(cross) + " · bord B avant : " + JSON.stringify(edgeB));
      expect("croix bleue de la 1re visée sur la croix B", cross && Math.hypot(cross[0] - edgeB[0], cross[1] - edgeB[1]) < 0.002); }
    expect("photo voisine proposée tout de suite", !doc.querySelector("#guide-photos").hidden
      && doc.querySelectorAll("#guide-photos button").length === 1);
    log("photo proposée : " + doc.querySelector("#guide-photos").textContent);
    expect("incertitude attendue sur la photo proposée", /±\d+,\d\d m/.test(doc.querySelector("#guide-photos").textContent));
    const b12 = toLonLat([side * 12 * ux, side * 12 * uy]);
    for (const f of [photos[1], photos[0]]) {
      w.mesures.psv.zoom(60);
      w.mesures.openPhoto(f);
      await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === f.id, 30000, "photo du bord B");
      const zoom0 = w.mesures.psv.getZoomLevel();
      await sleep(800);
      if (f === photos[0]) {  // autre photo que celle de la mesure : ni droite ni largeur
        await sleep(1500);  // animation du cadrage
        aimedAt("le bord B", f, b12, zoom0);
        expect("droite de mesure masquée hors de la photo de la mesure", box.querySelectorAll("[id*='-guide']").length === 0);
      }
      const announced = f === photos[0] ? predicted(f.id) : null;
      psvClick(yawTo(f, b12), -0.3);
      if (f === photos[0]) compare("bord B, 2e visée", announced);
    }
    log("bord B visé : " + app.status().slice(0, 160));
    doc.querySelector("#garder").click();
    await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === photos[1].id, 30000, "retour sur la photo de référence");
    await sleep(500);
    log("bord B triangulé : " + doc.querySelector("#statut").textContent);
    expect("largeur entre les points triangulés A et B", doc.querySelector("#statut").textContent.includes("entre les points triangulés"));
    expect("droite de mesure de retour sur la photo de la mesure", box.querySelectorAll("[id*='-guide']").length > 0);
    await sleep(2500);  // animation du cadrage
    { const last = JSON.parse(app.viewer_marks()).filter((m) => m.label.startsWith("↔")).pop();
      const pos = w.mesures.psv.getPosition(), wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
      const mid = Math.atan2(last.points.reduce((t, p) => t + Math.sin(p[0]), 0), last.points.reduce((t, p) => t + Math.cos(p[0]), 0));
      expect("vue centrée sur la largeur au retour", Math.abs(wrap(pos.yaw - mid)) < 0.05);
      log("largeur entière dans la vue : " + inView(last.points));
      log("cadrage : " + JSON.stringify(w.mesures.psv.getPosition()) + " · champ " + w.mesures.psv.state.vFov.toFixed(0) + "°"); }
    near("largeur avec le bord B triangulé", metresIn(doc.querySelector("#statut").textContent), 12, 0.15);
    log("csv : " + app.export_csv().split("\n").filter((l) => l.startsWith("largeur")).join(" // "));
    verdict();
  } catch (e) { log("ERREUR " + e); }
  log("FIN");
})();
