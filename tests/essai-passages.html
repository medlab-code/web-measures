<!-- Vue du dessus contrôlée sur les passages piétons de l'auteur (tests/passages-pietons.js, bandes de 0,50 m), avec le
     réseau : pour chaque photo, vue calée par la route puis par les verticales (quand elle en a), largeur des bandes et
     roulis restant (largeur = w0 (1 + 2 v δ cos²φ / H), v : écart en travers du véhicule, φ : angle des bandes au cap, voir
     docs/BIRDEYE.md § 4.1). Contrôles sur l'ensemble : largeur médiane des vues à 0,50 m près, roulis restant médian
     (protègent le roulis par défaut de la campagne, profil de campagne, py/web_profils.py) ; incertitude affichée (shownError) comparée à
     l'écart de chaque bande à 0,50 m (journal). Environ 20 s par photo, surtout la vue du dessus elle-même (voisines,
     hauteur, raccords) : 17 photos (environ 6 min) ; #rapide : 6 (environ 2 min) ; #ids=<id>,… : photos choisies ;
     #captures : image des bandes de chaque vue dans tests/captures/. -->
<iframe id="f" src="about:blank" style="width:1400px;height:900px"></iframe>
<script src="commun.js"></script>
<script src="passages-pietons.js"></script>
<script>
const { log, sleep, soon, expect, fail, fin } = Essai;
const QUICK = /rapide/.test(location.hash), CHOSEN = /ids=([\w,-]+)/.exec(location.hash)?.[1].split(",");
const SITES = CHOSEN ? CHOSEN.map((id) => PassagesPietons.find((p) => p.id.startsWith(id)) || { id })
  : PassagesPietons.filter((p) => p.essai === "rapide" || (!QUICK && p.essai === "complet"));
// Tolérances : médianes de 6 vues plus dispersées que de 15 (largeur d'une vue à ±4 % environ, roulis à ±1°). Avant la
// correction du roulis par défaut de la campagne (13/11/2026) : roulis restant +0,98° par la route.
const WIDTH_TOL = QUICK ? 0.04 : 0.02, ROLL_TOL = QUICK ? 0.6 : 0.5;
const WAIT = 90000, PX = 4096, RAD = Math.PI / 180, STRIPE = 0.5, SIGMA_GROUND = 0.02;
const frame = document.getElementById("f");
const f3 = (v) => (v == null || Number.isNaN(v) ? "-" : v.toFixed(3));
const pct = (values, q) => { const v = values.filter((x) => !Number.isNaN(x)).sort((a, b) => a - b); return v.length ? v[Math.min(v.length - 1, Math.floor(q * v.length))] : NaN; };
const med = (v) => pct(v, 0.5);

async function open(id) {
  frame.contentWindow.localStorage?.setItem("web-measures/photo", id);
  await new Promise((resolve) => { frame.onload = resolve; frame.src = `../index.html?essai=${Date.now()}`; });
  const w = frame.contentWindow, doc = w.document, $ = (s) => doc.querySelector(s);
  const start = Date.now();
  while (Date.now() - start < WAIT && $("#dessus").disabled) {
    [...doc.querySelectorAll("dialog[open] button.oui, dialog[open] button.non")].forEach((b) => b.click());
    await sleep(250);
  }
  if ($("#dessus").disabled) return null;
  times.page = Date.now() - start;
  $("#dessus").click();
  $("#dessus-position").click();  // recalage sur l'orthophoto : éteint par défaut, allumé pour garder les références
  $("#dessus-voisines").click();
  const ok = await soon(() => !busy(w), WAIT);
  times.dessus = Date.now() - start - times.page;
  return ok ? w : null;
}
const busy = (w) => { const state = w.document.querySelector("#dessus-etat").textContent; return !/caméra à/.test(state) || /en calcul|en cours|Lecture/.test(state); };

// Vue de la photo seule à PX px (0,73 cm par pixel), lue en (est, nord) depuis la caméra par interpolation bilinéaire
function bigView(Dessus, layer, terrain) {
  const canvas = Dessus.render([layer], terrain, layer.pose, null, PX), g = canvas.getContext("webgl2");
  const rgba = new Uint8Array(4 * PX * PX);
  g.readPixels(0, 0, PX, PX, g.RGBA, g.UNSIGNED_BYTE, rgba);
  const M = 2 * Dessus.REACH / PX;
  return (east, north) => {
    const x = (east + Dessus.REACH) / M - 0.5, y = (north + Dessus.REACH) / M - 0.5, i = Math.floor(x), j = Math.floor(y);
    if (i < 0 || j < 0 || i >= PX - 1 || j >= PX - 1) return NaN;
    const v = (a, b) => { const k = 4 * (b * PX + a); return rgba[k + 3] > 100 ? (rgba[k] + rgba[k + 1] + rgba[k + 2]) / 3 : NaN; };
    const u = x - i, t = y - j;
    return (v(i, j) * (1 - u) + v(i + 1, j) * u) * (1 - t) + (v(i, j + 1) * (1 - u) + v(i + 1, j + 1) * u) * t;
  };
}

// Bandes : image dans leur repère (travers -8..8 m, le long 12..-12 m, 2 cm par pixel), rangées qui en traversent au moins 4
const RW = 800, RR = 1200, RPX = 0.02, along = (r) => 12 - r * RPX, across = (q) => -8 + q * RPX;
// passage à moins de NEAR m de la caméra (6 à 8 m devant elle d'ordinaire) : pas un autre passage du carrefour, plus loin
const NEAR = 9.5, close = ({ r, run }) => Math.hypot(along(r), across((run[0][0] + run.at(-1)[1]) / 2)) < NEAR;
const axes = (theta) => { const ua = [Math.sin(theta), Math.cos(theta)]; return { ua, us: [ua[1], -ua[0]] }; };
function raster(sample, theta, r0 = 0, r1 = RR - 1, step = 1) {  // rangées r0 à r1 tous les step pixels (les autres vides)
  const { ua, us } = axes(theta), img = new Float32Array(RW * RR).fill(NaN);
  for (let r = Math.max(0, r0); r <= Math.min(RR - 1, r1); r += step) for (let q = 0; q < RW; q++) {
    const a = along(r), s = across(q);
    img[r * RW + q] = sample(a * ua[0] + s * us[0], a * ua[1] + s * us[1]);
  }
  return img;
}
function segments(row, q0, q1, mid) {  // bandes claires : bords à mi-chemin entre enrobé et peinture, interpolés
  const out = [];
  let s0 = null;
  for (let q = q0 + 1; q < q1; q++) {
    const p = row[q - 1], c = row[q];
    if (Number.isNaN(p) || Number.isNaN(c)) { s0 = null; continue; }
    const x = c !== p ? q - 1 + (mid - p) / (c - p) : q;
    if (p < mid && c >= mid) s0 = x;
    else if (p >= mid && c < mid && s0 !== null) { out.push([s0, x]); s0 = null; }
  }
  return out;
}
function regular(segs) {  // plus longue suite de bandes de 0,3 à 0,7 m, centres à 0,8 à 1,5 m les uns des autres
  let run = [], best = [];
  for (const g of segs) {
    if (!((g[1] - g[0]) * RPX > 0.3 && (g[1] - g[0]) * RPX < 0.7)) continue;
    const c = (g[0] + g[1]) / 2, prev = run.at(-1), gap = prev ? (c - (prev[0] + prev[1]) / 2) * RPX : 0;
    run = prev && gap >= 0.8 && gap <= 1.5 ? [...run, g] : [g];
    if (run.length > best.length) best = run;
  }
  return best;
}
function detect(img, step = 1, r0 = 0, r1 = RR - 1) {  // seuil repris sur l'étendue du passage, tant qu'il s'étend
  const rows = [];
  for (let r = Math.max(0, r0); r <= Math.min(RR - 1, r1); r += step) {
    const row = img.subarray(r * RW, (r + 1) * RW);
    let run = regular(segments(row, 0, RW, (pct(row, 0.2) + pct(row, 0.9)) / 2));
    if (run.length < 3) continue;
    for (let i = 0; i < 3; i++) {
      const q0 = Math.max(0, Math.floor(run[0][0] - 60)), q1 = Math.min(RW, Math.ceil(run.at(-1)[1] + 60)), part = row.slice(q0, q1);
      const again = regular(segments(row, q0, q1, (pct(part, 0.25) + pct(part, 0.75)) / 2));
      const grew = again.length > run.length;
      if (again.length >= run.length) run = again;
      if (!grew) break;
    }
    if (run.length >= 4) rows.push({ r, run });
  }
  return rows;
}
function sharpness(img, rows, step) {  // variance du profil moyen des colonnes, sur le cadre du passage (rangées lues)
  if (rows.length < 5) return -1;
  const r0 = Math.min(...rows.map((x) => x.r)), r1 = Math.max(...rows.map((x) => x.r)), cols = [];
  const q0 = Math.max(0, Math.floor(Math.min(...rows.map((x) => x.run[0][0]))) - 10), q1 = Math.min(RW, Math.ceil(Math.max(...rows.map((x) => x.run.at(-1)[1]))) + 10);
  for (let q = q0; q < q1; q++) { let s = 0, n = 0; for (let r = r0; r <= r1; r += step) { const v = img[r * RW + q]; if (!Number.isNaN(v)) { s += v; n++; } } if (n) cols.push(s / n); }
  const m = cols.reduce((t, v) => t + v, 0) / cols.length;
  return cols.reduce((t, v) => t + (v - m) ** 2, 0) / cols.length;
}
const span = (rows, margin) => [Math.min(...rows.map((x) => x.r)) - margin, Math.max(...rows.map((x) => x.r)) + margin];
/** Bandes entières du passage (hors véhicule, largeur stable le long d'elles) : { theta, stripes: [{ left, right, a, width }] }. */
let tag = "", lastImage = null, times = {};
async function capture(img, name) {  // #captures : image dans le repère des bandes, déposée dans tests/captures/
  const c = new OffscreenCanvas(RW, RR), x = c.getContext("2d"), data = x.createImageData(RW, RR);
  img.forEach((v, i) => { data.data.fill(Number.isNaN(v) ? 0 : v, 4 * i, 4 * i + 3); data.data[4 * i + 3] = 255; });
  x.putImageData(data, 0, 0);
  await fetch(`/capture/${name}`, { method: "POST", body: await c.convertToBlob({ type: "image/png" }) });
}
function findStripes(sample, headingDeg, roadDeg) {
  // Bandes parallèles à l'axe de la route (passages droits ; en biais : angle donné dans tests/passages-pietons.js).
  // Orientation affinée à ±4° par la netteté du profil des colonnes, toujours sur le même cadre (celui trouvé dans l'axe) :
  // une erreur de 2° ne change la largeur que de 0,06 %. Chercher sur ±45° trouvait parfois une direction à 20-30° des
  // bandes (rangées en biais qui les traversent aussi), d'où des largeurs fausses de 6 à 15 %.
  const base = roadDeg * RAD, rows0 = detect(raster(sample, base, 0, RR - 1, 3), 3).filter(close);
  if (rows0.length < 3) return null;
  const sharp = (phi) => sharpness(raster(sample, base + phi * RAD, Math.min(...rows0.map((x) => x.r)), Math.max(...rows0.map((x) => x.r)), 3), rows0, 3);
  const values = [], steps = [];
  for (let d = -4; d <= 4; d += 0.5) { steps.push(d); values.push(sharp(d)); }
  const k = values.indexOf(Math.max(...values));
  let phi = steps[k];
  if (k > 0 && k < values.length - 1) {
    const [l, m, r] = values.slice(k - 1, k + 2), curve = l - 2 * m + r;
    if (curve < 0) phi += 0.25 * (l - r) / curve;
  }
  const theta = base + phi * RAD, [f0, f1] = span(detect(raster(sample, theta, 0, RR - 1, 3), 3).filter(close), 6);
  const final = raster(sample, theta, f0, f1), rows = detect(final, 1, f0, f1).filter(close), { ua, us } = axes(theta);
  lastImage = { img: final, name: `passage-${tag}.png` };
  const hr = headingDeg * RAD, car = (s, a) => {  // empreinte du véhicule (3,2 m le long, 1,1 m en travers du cap)
    const e = a * ua[0] + s * us[0], n = a * ua[1] + s * us[1];
    return Math.abs(e * Math.sin(hr) + n * Math.cos(hr)) < 3.2 && Math.abs(e * Math.cos(hr) - n * Math.sin(hr)) < 1.1;
  };
  const groups = [];
  for (const { r, run } of rows) {
    const a = along(r);
    for (const [s0, s1] of run) {
      const c = (s0 + s1) / 2;
      if (car(-8 + c * RPX, a)) continue;
      let g = groups.find((g) => Math.abs(g.c - c) * RPX < 0.25);
      if (!g) groups.push(g = { c, cs: [], left: [], right: [], a: [] });
      g.cs.push(c); g.c = g.cs.reduce((t, v) => t + v, 0) / g.cs.length;
      g.left.push(-8 + s0 * RPX); g.right.push(-8 + s1 * RPX); g.a.push(a);
    }
  }
  const most = Math.max(0, ...groups.map((g) => g.a.length));
  if (/captures/.test(location.hash)) log(`  détail ${tag} : angle ${phi.toFixed(2)}° de la route, rangées ${rows.length}, groupes ${groups.map((g) => `${(-8 + g.c * RPX).toFixed(2)}:${g.a.length}:${(pct(g.right.map((r, i) => r - g.left[i]), 0.75) - pct(g.right.map((r, i) => r - g.left[i]), 0.25)).toFixed(3)}`).join(" ")}`);
  let stripes = groups.filter((g) => g.a.length >= Math.max(10, most / 2)).map((g) => {
    const widths = g.left.map((l, i) => g.right[i] - l);
    return { left: med(g.left), right: med(g.right), a: med(g.a), width: med(widths), iqr: pct(widths, 0.75) - pct(widths, 0.25) };
  }).filter((s) => s.iqr < 0.03);
  if (stripes.length >= 4) {  // largeur aberrante (bande usée, cachée) : à plus de 3 écarts médians de la médiane
    const m = med(stripes.map((s) => s.width)), mad = med(stripes.map((s) => Math.abs(s.width - m))) || 0.005;
    stripes = stripes.filter((s) => Math.abs(s.width - m) <= 3 * mad);
  }
  return { theta, stripes: stripes.sort((x, y) => x.left - y.left) };
}

/** Mesure de la vue affichée : bandes, roulis restant, incertitude affichée de chaque bande. */
function measure(Dessus, site) {
  const now = Dessus.layersNow(), main = now.layers[0], pose = main.pose, H = pose.height;
  const t0 = Date.now(), view = bigView(Dessus, main, now.terrain);
  times.rendu = (times.rendu || 0) + Date.now() - t0;
  lastImage = null;
  const found = findStripes(view, pose.heading, site.angle != null ? pose.heading + site.angle : Dessus.roadHeading(view, pose.heading) / RAD);
  if (!found && /captures/.test(location.hash)) lastImage = { img: raster(view, pose.heading * RAD), name: `passage-${tag}-rien.png` };
  if (!found || found.stripes.length < 3) return { pose, n: found?.stripes.length || 0 };
  const { ua, us } = axes(found.theta), hr = pose.heading * RAD, across = [Math.cos(hr), -Math.sin(hr)];
  const phi = found.theta - hr, k = Math.cos(phi) ** 2;
  const at = (s, a) => [a * ua[0] + s * us[0], a * ua[1] + s * us[1]];
  const stripes = found.stripes.map((s) => {
    const p = at(s.left, s.a), q = at(s.right, s.a), c = at((s.left + s.right) / 2, s.a);
    return { ...s, x: 2 * (c[0] * across[0] + c[1] * across[1]) * k / H, shown: Dessus.shownError(p, q, [main], SIGMA_GROUND),
      model: Dessus.measureError(p, q, [main], SIGMA_GROUND) };
  });
  // largeur = w0 (1 + x δ) : droite des largeurs selon x, roulis restant δ = pente / w0
  const n = stripes.length, mx = stripes.reduce((t, s) => t + s.x, 0) / n, mw = stripes.reduce((t, s) => t + s.width, 0) / n;
  const sxx = stripes.reduce((t, s) => t + (s.x - mx) ** 2, 0), b = stripes.reduce((t, s) => t + (s.x - mx) * (s.width - mw), 0) / sxx;
  const w0 = mw - b * mx;
  return { pose, n, stripes, median: med(stripes.map((s) => s.width)), roll: b / w0 / RAD, phi: phi / RAD };
}

(async () => {
  frame.src = "../index.html";
  await new Promise((resolve) => { frame.onload = resolve; });
  const views = { route: [], verticales: [] };
  for (const site of SITES) {
    const { id } = site;
    const t0 = Date.now(), w = await open(id);
    tag = id.slice(0, 8);
    if (!w) { log(`${tag} : vue indisponible`); continue; }
    try {
      log(`${tag} état : ${w.document.querySelector("#dessus-etat").textContent.replace(/\s+/g, " ")}`);
      const Dessus = w.modules.Dessus, box = w.document.querySelector("#dessus-verticales");
      const modes = [Dessus.layersNow().layers[0].pose.groundTilt ? "route" : "verticales"];
      if (box && !box.disabled) modes.push(modes[0] === "route" ? "verticales" : "route");
      for (const mode of modes) {
        if (mode !== modes[0]) {
          const t1 = Date.now();
          box.click();
          const done = await soon(() => !busy(w) && Boolean(Dessus.layersNow()?.layers[0]?.pose.groundTilt) === (mode === "route"), 30000);
          times["bascule"] = Date.now() - t1;
          if (!done) { log(`${tag} : calage par ${mode === "route" ? "la route" : "les verticales"} non obtenu`); continue; }
        }
        if (mode === "route" && mode !== modes[0]) log(`${tag} état route : ${w.document.querySelector("#dessus-etat").textContent.replace(/\s+/g, " ")}`);
        const t1 = Date.now(), m = measure(Dessus, site);
        times[mode] = Date.now() - t1;
        if (/captures/.test(location.hash) && lastImage) await capture(lastImage.img, mode + "-" + lastImage.name).catch((e) => log("capture : " + e));
        if (!m.stripes) { log(`${tag} ${mode} : ${m.n} bande(s) entière(s), passage non mesuré`); continue; }
        views[mode].push(m);
        log(`${tag} ${mode} : H ${f3(m.pose.height)} m, bandes à ${m.phi.toFixed(1)}° du cap, ${m.n} bandes `
          + m.stripes.map((s) => f3(s.width)).join(" ") + ` → médiane ${f3(m.median)} m, roulis restant ${m.roll >= 0 ? "+" : ""}${m.roll.toFixed(2)}°`
          + `, incertitude affichée ${(1000 * med(m.stripes.map((s) => s.shown))).toFixed(0)} mm (modèle ${(1000 * med(m.stripes.map((s) => s.model))).toFixed(1)} mm)`);
      }
    } catch (e) { await fail(`${tag} : ${e.stack || e}`); }
    log(`  ${tag} : ${((Date.now() - t0) / 1000).toFixed(1)} s (${Object.entries(times).map(([k, v]) => `${k} ${(v / 1000).toFixed(1)}`).join(", ")})`);
    times = {};
  }
  for (const [mode, list] of Object.entries(views)) {
    if (!list.length) continue;
    const width = med(list.map((m) => m.median)), roll = med(list.map((m) => m.roll)), all = list.flatMap((m) => m.stripes);
    const errors = all.map((s) => Math.abs(s.width - STRIPE)), within = (f) => all.filter((s) => Math.abs(s.width - STRIPE) <= f(s)).length / all.length;
    log(`BILAN ${mode} : ${list.length} vues, ${all.length} bandes ; largeur médiane ${f3(width)} m, roulis restant médian ${roll >= 0 ? "+" : ""}${roll.toFixed(2)}° `
      + `(quartiles ${pct(list.map((m) => m.roll), 0.25).toFixed(2)} à ${pct(list.map((m) => m.roll), 0.75).toFixed(2)}°)`);
    log(`ÉCARTS ${mode} : écart de bande à 0,50 m, médiane ${(100 * med(errors) / STRIPE).toFixed(1)} %, 68 % sous ${(100 * pct(errors, 0.68) / STRIPE).toFixed(1)} %, `
      + `95 % sous ${(100 * pct(errors, 0.95) / STRIPE).toFixed(1)} % ; dans l'incertitude affichée ${(100 * within((s) => s.shown)).toFixed(0)} %, `
      + `dans le double ${(100 * within((s) => 2 * s.shown)).toFixed(0)} % ; dans celle du modèle seul ${(100 * within((s) => s.model)).toFixed(0)} %`);
    log(`ÉCARTS-BRUTS ${mode} ${all.map((s) => (s.width - STRIPE).toFixed(4)).join(" ")}`);
    expect(`${mode} : largeur médiane des bandes`, Math.abs(width - STRIPE) <= WIDTH_TOL * STRIPE, `${f3(width)} m au lieu de 0,500 ± ${100 * WIDTH_TOL} %`);
    expect(`${mode} : roulis restant médian`, Math.abs(roll) < ROLL_TOL, `${roll.toFixed(2)}° (${ROLL_TOL}° au plus)`);
  }
  expect("vues mesurées", views.route.length >= 0.75 * SITES.length, `${views.route.length} calées par la route sur ${SITES.length} sites`);
  await fin();
})();
</script>
