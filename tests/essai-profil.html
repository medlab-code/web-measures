<!-- Fond du graphique du profil en travers (ticket #38) sur des profils synthétiques, sans réseau : 1 m sous le point le
     plus bas du terrain si son haut reste dans la moitié basse du cadre, sinon 0,3 m ; place libre en haut ; toujours assez
     de place sous la chaussée pour ses deux étiquettes (2,85 m à l'échelle de ces profils, 20,35 px/m).
     Lancer comme tests/navigateur.html (voir CLAUDE.md). -->
<script src="../src/profil.js"></script>
<script src="../src/nuage.js"></script>
<script src="commun.js"></script>
<script>
const { expect, fail, fin } = Essai;
Essai.verbose = true;  // chaque contrôle journalisé, avec sa valeur
// Un travers : plateforme plane de −3 à +3 m (z = 0), terrain de part et d'autre selon h(distance au bord), jusqu'à width m
const crossing = (along, h, width) => ["gauche", "droit"].map((cote) => ({ le_long: along, cote, bord: 3, relief: "marche", arret: null,
  points: [...Array(width + 1).keys()].map((k) => [k, k <= 3 ? 0 : h(k - 3)]) }));
const profile = (crossings, origine = "axe") => ({ origine, source: "essai", erreur: 0.1, resultats: { gauche: null, droit: null },
  arrets: {}, zone: 10, remontee: 1, profils: crossings.flat() });
// Mètres de sol sous le point le plus bas, lus sur le SVG (échelle verticale : ligne zéro et un autre repère)
function ground(svg) {
  document.documentElement.append(svg);
  const zero = svg.querySelector("line.zero"), y0 = Number(zero.getAttribute("y1"));
  const row = [...svg.querySelectorAll("line.grille")].find((l) => l !== zero && l.getAttribute("y1") === l.getAttribute("y2"));
  const y1 = Number(row.getAttribute("y1")), label = [...svg.querySelectorAll("text.graduation[text-anchor=end]")]
    .find((t) => Math.abs(Number(t.getAttribute("y")) - 4 - y1) < 0.6);
  const px = (y0 - y1) / Number(label.textContent.replace(",", ".").replace("−", "-"));
  const low = Math.max(...[...svg.querySelectorAll(".sol, .autre-travers")].map((e) => { const b = e.getBBox(); return b.y + b.height; }));
  const metres = (svg.viewBox.baseVal.height - 44 - low) / px;
  svg.remove();
  return metres;
}
const check = (what, drawn, expected) => {
  const metres = ground(drawn.svg);
  expect(`${what} : ${metres.toFixed(2)} m de sol sous le point le plus bas (attendu ${expected})`, Math.abs(metres - expected) <= 0.02);
};
try {
  const flat = [crossing(0, () => -0.1, 17)];
  check("terrain plat, à l'échelle", Profil.draw(profile(flat), true), 2.75);
  check("talus descendant à −3 m, à l'échelle", Profil.draw(profile([crossing(0, (x) => -Math.min(3, x), 17)]), true), 1);
  check("talus montant à +8 m, à l'échelle", Profil.draw(profile([crossing(0, (x) => Math.min(8, x * 1.5), 17)]), true), 2.85);
  check("terrain plat, hauteurs exagérées", Profil.draw(profile(flat), false), 0.3);
  check("point le plus bas sur un autre travers", Profil.draw(profile([...flat, crossing(5, (x) => -Math.min(2, x), 17)]), true), 1);
  // Étiquettes sous la chaussée : ni sur la chaussée, ni l'une sur l'autre, ni collées au bas du cadre
  const roomy = (what, crossings, trueScale) => {
    const { svg } = Profil.draw({ ...profile(crossings), plateforme: { type: "sens", pente: 2.3 } }, trueScale);
    document.documentElement.append(svg);
    const [width, slope] = [...svg.querySelectorAll("text.place")].filter((t) => /^(plateforme|dévers)/.test(t.textContent)).map((t) => t.getBBox());
    const road = svg.querySelector(".chaussee").getBBox(), plotBottom = Math.max(...[...svg.querySelectorAll("line.grille")].map((l) => Number(l.getAttribute("y2"))));
    svg.remove();
    const ok = width.y >= road.y + road.height && slope.y >= width.y + width.height - 2 &&  /* cadres de ligne : 17,4 px pour 16 px de pas, sans contact des lettres */ slope.y + slope.height <= plotBottom - 8;
    expect(`étiquettes sous la chaussée, ${what} : ${(plotBottom - slope.y - slope.height).toFixed(0)} px au-dessus du bas`, ok);
  };
  const tilted = crossing(0, () => -0.1, 17).map((c) => ({ ...c, points: c.points.map(([d, z]) => [d, d <= 3 && c.cote === "droit" ? -0.03 * d : z]) }));
  const hill = (x) => Math.min(8, x * 1.5);
  roomy("terrain plat, à l'échelle", flat, true);
  roomy("terrain plat, exagéré", flat, false);
  roomy("talus montant, à l'échelle", [crossing(0, hill, 17)], true);
  roomy("talus montant, exagéré", [crossing(0, hill, 17)], false);
  roomy("chaussée en dévers, exagéré", [tilted], false);
  // Dévers de la plateforme : sur le graphique et dans la légende
  const text = (plateforme) => { const d = Profil.draw({ ...profile(flat), plateforme }, true); return [d.svg.textContent, d.legend.textContent]; };
  const says = (what, [graph, legend], inGraph, inLegend) => expect(`${what} : ${inLegend}`, graph.includes(inGraph) && legend.includes(inLegend));
  says("un sens", text({ type: "sens", pente: 2.3 }), "dévers 2\u00a0% →", "dévers 2\u00a0% vers la droite");
  says("toit", text({ type: "toit", pente: 2.5, gauche: -2.4, droite: 2.6 }), "toit 3\u00a0%", "en toit, pente moyenne 3\u00a0%");
  says("demi-chaussées", text({ type: "demi", gauche: -3, droite: 0.2 }), "dévers ← 3\u00a0% | moins de 1\u00a0%", "à gauche 3\u00a0% vers la gauche, à droite moins de 1\u00a0%");
  says("non déterminé", text({ type: "indetermine" }), "plateforme", "dévers non déterminé");
  // Canopée hors du cadre : sa hauteur, à l'échelle seulement, de chaque côté où elle dépasse
  const fine = (vegetation) => ({ points: 100, lignes: [], bords: {}, herbe: [], eau: [], separateur: null, vegetation });
  const trees = (x0, z) => [...Array(9).keys()].map((k) => [x0 + k * 0.5, z]);
  const labels = (veg, scale = true, plants = true) => [...Profil.draw(profile(flat), scale, fine(veg), plants).svg.querySelectorAll("text.canopee")].map((t) => t.textContent).join(" | ");
  const canopy = (what, got, expected) => expect(`${what} : « ${got} » (attendu « ${expected} »)`, got === expected);
  canopy("arbres de 40 m à droite", labels(trees(5, 40)), "canopée +40 m");
  canopy("arbres des deux côtés", labels([...trees(-12, 30), ...trees(5, 40)]), "canopée +30 m | canopée +40 m");
  canopy("arbres de 5 m, dans le cadre", labels(trees(5, 5)), "");
  canopy("hauteurs exagérées", labels(trees(5, 40), false), "");
  canopy("case Végétation décochée", labels(trees(5, 40), true, false), "");
  // Profil en long : noms de carrefours dans la bande au-dessus du cadre, jamais sur le terrain, ni l'un sur l'autre ni coupés
  const road = (fins) => { const svg = Profil.draw({ ...profile(flat), en_long: { pente: 4.7, max: null, fins,
    points: [...Array(51).keys()].map((k) => [k * 2 - 50, (k * 2 - 50) * 0.047]) } }, true).long; document.documentElement.append(svg); return svg; };
  const names = (what, fins, count) => {
    const svg = road(fins), width = svg.viewBox.baseVal.width, plotTop = Math.min(...[...svg.querySelectorAll(".grille")].map((l) => Number(l.getAttribute("y1"))));
    const boxes = [...svg.querySelectorAll("text.etiquette-profil.place")].map((t) => t.getBBox()), ground = svg.querySelector(".sol").getBBox();
    const ok = boxes.length === count && boxes.every((b, i) => b.y + b.height <= plotTop + 1 && b.y + b.height <= ground.y && b.x >= 0 && b.x + b.width <= width
      && boxes.every((o, j) => j === i || b.x + b.width <= o.x || o.x + o.width <= b.x || b.y + b.height <= o.y + 4 || o.y + o.height <= b.y + 4));  // boîtes de 17,4 px pour 14 px d'interligne
    svg.remove(); expect(`${what} : ${boxes.length} nom(s), cadre à ${plotTop.toFixed(0)} px`, ok);
  };
  const near = { d: 30, type: "carrefour", avec: ["CHE DE L'ARGENTALET"] };
  names("carrefour de l'image du 05/11", [near], 1);
  names("carrefour en début d'axe", [{ d: -45, type: "carrefour", avec: ["D18"] }], 1);
  names("deux carrefours proches", [near, { d: 25, type: "carrefour", avec: ["RUE DE LA GARE"] }], 2);
  names("fin de route et carrefour", [{ d: 20, type: "fin", voie: "D16", avec: ["D18"] }, near], 2);
  // Bord d'enrobé (D70 9b97c187) : enrobé à 300, ligne centrale, reprise plus claire, herbe à 1400 à partir de 5 m
  const rows = (fn) => new Map([...Array(49).keys()].map((k) => { const x = k * 0.25; return [k, fn(x)]; }));
  const paved = (what, fn, expected) => { const got = Nuage.pavedEdge(rows(fn), 1, 1, 12, 300), ok = expected === null ? got === null : got !== null && Math.abs(got - expected) <= 0.13;
    expect(`bord d'enrobé, ${what} : ${got} (attendu ${expected})`, ok); };
  const asphalt = (x) => (x < 5 ? 300 : 1400);
  paved("net", asphalt, 4.9);
  paved("ligne blanche étroite", (x) => (Math.abs(x - 2) < 0.1 ? 900 : asphalt(x)), 4.9);
  paved("reprise claire à 1,6 fois", (x) => (x >= 1.5 && x < 3 ? 480 : asphalt(x)), 4.9);
  paved("gravillons à 3 fois puis herbe", (x) => (x < 5 ? 300 : x < 8 ? 900 : 2000), 4.9);
  paved("gravier à 1,5 fois jusqu'à l'herbe (D70 c6c065fa)", (x) => (x < 2 ? 300 : x < 5 ? 450 : 1400), 1.9);
  paved("surlargeur claire après la ligne de rive (RD903bis 1640bc3f)", (x) => (Math.abs(x - 1.4) < 0.13 ? 3000 : x < 1.5 ? 300 : x < 3.2 ? 480 : 1400), 3.1);
  paved("pas d'abords clairs", () => 320, null);
  paved("bord au-delà de la limite", (x) => (x < 14 ? 300 : 1400), null);
  // Bordure (altitude médiane du sol par case, m) : trottoir en enrobé (D119M f533e240, M996 6eea86cc) ; ni dévers, ni
  // bombement, ni ornière, ni bosse étroite
  const heights = (fn) => new Map([...Array(97).keys()].map((j) => j - 48).map((k) => [k, fn(k * 0.25)]));
  const kerb = (what, fn, expected) => { const got = Nuage.kerbEdge(heights(fn), 1, 1, 12), ok = expected === null ? got === null : got !== null && Math.abs(got - expected) <= 0.26;
    expect(`bordure, ${what} : ${got} (attendu ${expected})`, ok); };
  kerb("9 cm à 1,75 m après un caniveau", (x) => (Math.abs(x) < 1.75 ? 100 - 0.02 * Math.abs(x) : 100.09), 1.75);
  kerb("fine, 5,5 cm de 2,4 à 3,15 m", (x) => { const a = Math.abs(x); return a < 2.4 ? 100 - 0.02 * a : 99.952 + Math.min(0.055, (a - 2.4) * 0.073); }, 2.75);
  kerb("dévers qui monte de 12 %", (x) => 100 + 0.12 * x, null);
  kerb("bombement", (x) => 100 - 0.025 * Math.abs(x - 1.5), null);
  kerb("ornière de 3 cm", (x) => 100 - (Math.abs(Math.abs(x) - 1.5) < 0.3 ? 0.03 : 0), null);
  kerb("bosse de 6 cm sur 0,5 m", (x) => 100 + (Math.abs(Math.abs(x) - 2) < 0.3 ? 0.06 : 0), null);
  kerb("chaussée qui monte de 1 % et bruit de 3 cm", (x) => 100 + 0.01 * Math.abs(x) + [0, 0.015, -0.015, 0.01][Math.abs(Math.round(x * 4)) % 4], null);
  // Ligne blanche : nettement plus claire que ses voisines ; surface du séparateur au seuil (1640bc3f, −3,5 m) écartée, malgré la case vide à côté
  const narrow = (what, cases, expected) => { const got = Nuage.brightRuns(cases.map(([x, i]) => ({ x, i })), 100).map((r) => r[2]), ok = JSON.stringify(got) === JSON.stringify(expected);
    expect(`ligne blanche, ${what} : ${JSON.stringify(got)} (attendu ${JSON.stringify(expected)})`, ok); };
  narrow("sur l'enrobé", [[-0.25, 110], [0, 1000], [0.25, 120]], [true]);
  narrow("sur deux cases", [[-0.25, 110], [0, 900], [0.25, 1600], [0.5, 370]], [true]);
  narrow("surface du séparateur", [[-3.75, 290], [-3.5, 300], [-3, 200]], [false]);
  narrow("large : pas de la peinture", [0, 1, 2, 3, 4].map((k) => [k * 0.25, 900]), [false]);
  // Lignes à tirets (f478a847) : vue sur 2 travers, gardée au plus près de la photo ; vue sur 1 seul, écartée ; deux lignes distinctes
  const dashes = (what, sections, expected) => { const got = Nuage.dashedLines(sections), ok = JSON.stringify(got) === JSON.stringify(expected);
    expect(`lignes à tirets, ${what} : ${JSON.stringify(got)} (attendu ${JSON.stringify(expected)})`, ok); };
  dashes("deux travers, le plus proche de la photo", [[-4, [1.25]], [-2, []], [0, []], [2, [1]], [4, [1.25]]], [1]);
  dashes("un seul travers : écartée", [[-4, []], [-2, [1]], [0, []], [2, []], [4, []]], []);
  dashes("deux lignes distinctes", [[-4, [-2.5, 1]], [2, [-2.25, 1.25]]], [-2.25, 1.25]);
  dashes("trop éloignées d'un travers à l'autre", [[-4, [1]], [2, [2]]], []);
  // Route étroite : le graphique est à sa hauteur ; la caméra (1,9 m) ne compte pas comme haut du terrain
  check("caméra au-dessus d'un terrain plat", Profil.draw(profile([crossing(0, () => -0.1, 4)], "caméra"), true, null, true, 1.9), 1);
} catch (error) { fail("exception : " + (error.stack || error)); }
fin();
</script>
