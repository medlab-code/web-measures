<!-- Raccord entre deux séquences sur la D906, du PR 76 + 658 au PR 76 + 373 (cas de l'utilisateur du 08/11/2026, ticket
     #44 ; autre parcours : #route,PR,distance,route,PR,distance ou #lon,lat,lon,lat) : parcours saisi par ses PR, photos et raccords dans le journal, un extrait vidéo par raccord (24 photos,
     50 km/h, stabilisation et exposition) dans le stockage de la page (OPFS, raccord-n.mp4 : une centaine de Mo, trop lourd
     pour l'envoi au serveur d'essai ; le copier depuis le profil de Chrome). Lancer comme tests/navigateur.html. -->
<script>try { localStorage.clear(); } catch {}</script>
<iframe id="f" src="../index.html" style="width:1400px;height:1000px"></iframe>
<script>
const log = (t) => fetch("/journal", { method: "POST", body: String(t) }).catch(() => {});
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(test, ms, what) { const t0 = Date.now(); while (!test()) { if (Date.now() - t0 > ms) throw new Error("délai dépassé : " + what); await sleep(250); } }
let failures = 0, checks = 0;
const expect = (what, ok, detail = "") => { checks++; if (!ok) { failures++; log("ÉCHEC " + what + (detail ? " : " + detail : "")); } };
(async () => {
  const w = document.getElementById("f").contentWindow;
  try {
    await until(() => w.mesures?.app && w.mesures.map?.loaded?.(), 180000, "Pyodide");
    const doc = w.document;
    doc.querySelector("#reglages-defaut")?.close();
    doc.querySelector("#onglet-parcours").click();
    const pane = doc.querySelector("#parcours"), button = doc.querySelector("#parcours-video");
    const status = () => doc.querySelector("#statut")?.textContent || "";
    const [route, startPr, endPr] = pane.querySelectorAll(".champ input"), [startDistance, endDistance] = pane.querySelectorAll(".distance");
    const type = (input, value) => {
      input.focus();
      input.value = value;
      input.dispatchEvent(new w.Event("input", { bubbles: true }));
    };
    // Parcours : #route,PR,distance,route,PR,distance (départ puis arrivée, routes différentes possibles) ; chaque
    // extrémité saisie sur sa route, lue sur son repère, puis départ et arrivée posés sur la carte
    // (ou #lon,lat,lon,lat : départ et arrivée directement)
    const asked = decodeURIComponent(location.hash.slice(1) || "D906,76,658,D906,76,373").split(",");
    const lonlats = asked.length === 4 ? [asked.slice(0, 2).map(Number), asked.slice(2).map(Number)] : null;
    const [r0, p0, d0, r1, p1, d1] = lonlats ? ["", "", "", "-", "", ""] : asked;
    const m = w.mesures.map;
    const markerAt = (css) => {
      const e = doc.querySelector(`.repere-requete.${css}`), xy = e && /translate\((-?[\d.]+)px, (-?[\d.]+)px\)/.exec(e.style.transform);
      return xy ? m.unproject([Number(xy[1]), Number(xy[2])]).toArray() : null;
    };
    const byPr = async (road, pr, distance, side) => {
      type(route, road);
      await sleep(2000);
      for (const [prInput, distanceInput] of side == null ? [[startPr, startDistance], [endPr, endDistance]] : [[side ? endPr : startPr, side ? endDistance : startDistance]]) {
        type(prInput, pr);  // (null : même point aux deux bouts, repère posé seulement quand les deux sont saisis)
        type(distanceInput, distance);
      }
      await sleep(4000);
      return markerAt(side ? "arrivee" : "depart");  // (null : repère du départ)
    };
    if (r0 === r1) {
      await byPr(r0, p0, d0, 0);
      await byPr(r1, p1, d1, 1);
    } else {
      const [start, end] = lonlats || [await byPr(r0, p0, d0, null), await byPr(r1, p1, d1, null)];
      log(`départ ${r0} PR ${p0} + ${d0} : ${start} ; arrivée ${r1} PR ${p1} + ${d1} : ${end}`);
      expect("extrémités trouvées", start && end);
      const click = (lonlat) => {
        m.jumpTo({ center: lonlat, zoom: 16 });
        m.fire("click", { lngLat: new w.maplibregl.LngLat(...lonlat), point: m.project(lonlat), originalEvent: new w.MouseEvent("click") });
      };
      pane.querySelector('.sur-carte[data-cote="start"]').click();
      click(start);
      await sleep(4000);
      if (!pane.querySelector('.sur-carte[data-cote="end"]').getAttribute("aria-pressed").includes("true")) pane.querySelector('.sur-carte[data-cote="end"]').click();
      click(end);
      await sleep(4000);
    }
    const t0 = Date.now();
    button.click();
    await until(() => /Enregistrer/.test(button.textContent) || /impossible/.test(status()), 600000, "fin de la préparation");
    const plan = w.mesures.videoPlan, photos = plan?.photos || [];
    log(`préparée en ${((Date.now() - t0) / 1000).toFixed(0)} s : ${photos.length} photos, ${plan?.switches} changement(s) ; ${status()}`);
    expect("vidéo préparée", photos.length > 5, status());
    const Video = w.eval("Video"), path = Video.trajectory(photos);
    path.list.forEach((p, i) => log(`${String(i).padStart(3)} s ${path.s[i].toFixed(1).padStart(6)} ${p.collection.slice(0, 8)} ${p.coords.map((v) => v.toFixed(6))} cap ${p.heading?.toFixed(1)} ${p.id.slice(0, 8)}`));
    expect("au moins un raccord", plan?.switches >= 1, plan?.switches);
    // Un extrait par raccord : 12 photos de part et d'autre (prises dans la liste du plan : la trajectoire en écarte)
    const dir = await w.navigator.storage.getDirectory();
    const seams = photos.flatMap((p, i) => (i && p.collection !== photos[i - 1].collection ? [i] : []));
    for (const [n, k] of seams.entries()) {
      const handle = await dir.getFileHandle(`raccord-${n + 1}.mp4`, { create: true }), t1 = performance.now();
      await Video.mp4(photos.slice(Math.max(0, k - 12), k + 12), 50, () => {}, null, { stream: await handle.createWritable(), stabilize: true, exposure: true });
      log(`raccord ${n + 1} (photo ${k}, ${photos[k - 1].coords.map((v) => v.toFixed(5))}) : rendu en ${((performance.now() - t1) / 1000).toFixed(1)} s`);
    }
  } catch (error) {
    failures++;
    log("ERREUR " + error + " " + (error.stack || "").split("\n")[1]);
  }
  log(failures ? `ERREUR ${failures} contrôle(s) sur ${checks} en échec` : `contrôles : ${checks} réussis`);
  log(failures ? "ERREUR" : "FIN");
})();
</script>
