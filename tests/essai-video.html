<!-- Vidéo MP4 sans lire le parcours : D115D du PR 1 + 146 au PR 1 + 0 (photos du CD21 du 10 juillet 2025), « Préparer »
     (toutes les photos, une tous les 5 m), vidéo à 180 km/h avec une photo sur 2 calculée par Video.mp4 puis relue :
     taille, durée ; une image par seconde dans le journal en JPEG (« IMAGE nom data: », #fichier : le MP4 aussi) ;
     « Enregistrer » par le bouton (boîte d'enregistrement simulée). Puis carrefour RD18 / D115D (photos 69f5822b →
     3dc34aaf, sans filtre) : changement de séquence signalé. Petite planète (#planete) : au milieu des 300 premiers
     mètres depuis le PR 1 + 146 (une photo sur 4), enroulement, tenue, déroulement. Parcours gardés (#garder) : « ☆ Garder »,
     export d'un seul, import, réglages et endroits rétablis d'un clic. Tour d'horizon (#tour) : arrêt sur une photo, tour
     complet à l'horizontale, sens alterné. Haute qualité (#hq) : 1080p à 80 Mbit/s, plus nette, durée du calcul comparée. Serveur d'images bloqué (#attente) :
     avertissement au bout de 30 s, reprise, annulation. Lancer comme tests/navigateur.html. -->
<script>try {
  localStorage.clear();
  localStorage.setItem("web-measures/filtre", JSON.stringify({ since: "2025-07-05" }));
} catch {}</script>
<iframe id="f" src="../index.html" style="width:1400px;height:1000px"></iframe>
<script>
const log = (t) => fetch("/journal", { method: "POST", body: String(t) }).catch(() => {});
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(test, ms, what) { const t0 = Date.now(); while (!test()) { if (Date.now() - t0 > ms) throw new Error("délai dépassé : " + what); await sleep(250); } }
let failures = 0, checks = 0;
const expect = (what, ok, detail = "") => { checks++; if (!ok) { failures++; log("ÉCHEC " + what + (detail ? " : " + detail : "")); } };
(async () => {
  const w = document.getElementById("f").contentWindow;
  try {
    await until(() => w.mesures?.app && w.mesures.map?.loaded?.(), 180000, "Pyodide");
    const doc = w.document;
    const warn = w.console.warn.bind(w.console);
    w.console.warn = (...args) => { log("AVERT " + args.map(String).join(" ").slice(0, 300)); warn(...args); };
    doc.querySelector("#reglages-defaut")?.close();
    w.mesures.map.jumpTo({ center: [4.85562, 47.06807], zoom: 15 });
    await sleep(1500);
    const type = (input, text) => { input.focus(); input.value = text; input.dispatchEvent(new w.Event("input", { bubbles: true })); };
    doc.querySelector("#onglet-parcours").click();
    const dialog = doc.querySelector("#parcours");
    const [route, pr, end] = dialog.querySelectorAll(".champ input");
    const [distance, endDistance] = dialog.querySelectorAll(".distance");
    const button = doc.querySelector("#parcours-video");
    const status = () => doc.querySelector("#statut")?.textContent || "";
    expect("« 🎬 Préparer la vidéo » grisé sans départ ni arrivée", button.disabled && /Préparer/.test(button.textContent));
    expect("« ↺ RAZ » grisé à l'ouverture (tout à zéro)", doc.querySelector("#parcours-raz").disabled);
    type(route, "115d");
    type(pr, "1");
    distance.value = "146";
    type(end, "1");
    endDistance.value = "0";
    await sleep(3000);
    expect("« 🎬 Préparer la vidéo » actif une fois départ et arrivée saisis (sans lire le parcours)", !button.disabled);
    const k = 111320 * Math.cos(47.07 * Math.PI / 180);
    const dist = (p, q) => Math.hypot((p[0] - q[0]) * k, (p[1] - q[1]) * 111320);
    // Parties : 1,1 km (rampe de vitesse, titre, compteur PR), D115D courte (vidéo calculée et enregistrée), carrefour
    // (changement de séquence, exposition) ; ancre #long ou #exposition : cette partie seule (mise au point, plus court)
    const only = location.hash.match(/#(long|exposition|planete|garder|tour|hq|attente)/)?.[1];
    const Video = w.eval("Video");
    let select = doc.querySelector("#video-vitesse");
    let canvas = Object.assign(document.createElement("canvas"), { width: 960, height: 540 });
    let ctx = canvas.getContext("2d");
    if (only === "attente") {
      // Serveur d'images bloqué (tuiles sans réponse, requêtes reprises par Video) : avertissement au bout de 30 s, fenêtre
      // refermée dès que les images reviennent, vidéo écrite ; puis nouveau blocage et « Annuler la vidéo »
      button.click();
      await until(() => /Enregistrer/.test(button.textContent) || /impossible/.test(status()), 120000, "vidéo préparée");
      let hold = true, closed = false;
      const pass = w.fetch;
      w.fetch = (url, options = {}) => (hold && /\/tiles\//.test(String(url))
        ? new Promise((_, reject) => options.signal?.addEventListener("abort", () => reject(options.signal.reason)))
        : pass(url, options));
      w.showSaveFilePicker = async (o) => ({ name: o.suggestedName, createWritable: async () => ({ write: async () => {}, close: async () => { closed = true; } }) });
      const dialog = doc.querySelector("#video-attente");
      const t0 = Date.now();
      button.click();
      await until(() => dialog.open, 60000, "avertissement du serveur bloqué");
      const after = (Date.now() - t0) / 1000;
      log(`avertissement au bout de ${after.toFixed(0)} s : ${dialog.querySelector("p").textContent}`);
      expect("serveur bloqué : avertissement au bout de 30 s", after >= 29 && after < 40, after);
      expect("serveur bloqué : boutons Annuler la vidéo / Attendre", /Annuler la vidéo/.test(dialog.textContent) && /Attendre/.test(dialog.textContent));
      hold = false;
      await until(() => !dialog.open, 60000, "fenêtre refermée à la reprise");
      await until(() => closed || /impossible|arrêtée/.test(status()), 300000, "vidéo écrite après la reprise");
      expect("serveur revenu : vidéo écrite", closed, status());
      hold = true;
      button.click();
      await until(() => dialog.open, 60000, "second avertissement");
      dialog.querySelector("button[value=annuler]").click();
      await until(() => /arrêtée/.test(status()), 30000, "vidéo annulée");
      expect("« Annuler la vidéo » : calcul arrêté, rien d'enregistré", /Vidéo arrêtée : rien d'enregistré/.test(status()), status());
      w.fetch = pass;
    }
    if (!only || only === "long") {
      // Rampe de vitesse, D115D du PR 1 + 146 au PR 0 (1,1 km : virages de la sortie d'Aloxe-Corton, carrefour de la
      // RD18) à 90 km/h (25 m/s) : pleine vitesse en ligne droite, ralentie au virage le plus serré, jamais sous 35 %,
      // départ et arrivée en douceur ; vidéo seulement préparée (pas calculée)
      // Mode Présentation à l'ouverture : compteurs PR et vitesse et titre cochés, le reste non (allure à la place de la
      // rampe et de la vitesse, grisées) ; options actuelles
      // repliées dans « Options avancées », dans l'ordre demandé : compteurs, accélération, qualité, flou, exposition,
      // rampe, avancée ; titre à part, au-dessus
      const boxes = [...doc.querySelectorAll("#video-avancees .options > label.option > input[type=checkbox]")];
      const on = (list) => list.filter((b) => b.checked).map((b) => b.id).join(" ");
      expect("mode Présentation par défaut", doc.querySelector("#video-mode").value === "presentation" && doc.querySelector("#video-titre").checked
        && on(boxes) === "video-compteur video-compteur-vitesse" && !doc.querySelector("#video-presentation").hidden
        && doc.querySelector("#video-rampe").disabled && doc.querySelector("#video-vitesse").disabled, on(boxes));
      expect("options avancées repliées, dans l'ordre demandé", !doc.querySelector("#video-avancees").open && boxes.slice(0, 8).map((b) => b.id).join(" ")
        === "video-compteur video-compteur-vitesse video-acceleration video-vmax-arp video-hq video-flou video-expo video-rampe",
        boxes.map((b) => b.id).join(" "));
      const mode = doc.querySelector("#video-mode");
      mode.value = "revue";
      mode.dispatchEvent(new w.Event("change"));
      expect("mode Revue : quatre compteurs, sans rampe, sans allure", on(boxes) === "video-compteur video-compteur-vitesse video-acceleration video-vmax-arp"
        && doc.querySelector("#video-presentation").hidden && !doc.querySelector("#video-vitesse").disabled, on(boxes));
      mode.value = "presentation";
      mode.dispatchEvent(new w.Event("change"));
      expect("titre : champs grisés sans titre", (() => { const t = doc.querySelector("#video-titre"); t.click();
        const off = doc.querySelector("#video-titre-texte").disabled; t.click(); return off && !doc.querySelector("#video-titre-texte").disabled; })());
      expect("options : plus de panoramique au changement de séquence", !doc.querySelector("#video-pano"));
      type(end, "0");
      endDistance.value = "0";
      await sleep(1500);
      button.click();
      await until(() => /Enregistrer/.test(button.textContent) || /impossible/.test(status()), 120000, "vidéo de 1,1 km préparée");
      const long = Video.trajectory(w.mesures.videoPlan?.photos || []);
      // Aperçu sur la carte : tracé coloré selon la vitesse, repère qui avance à l'allure de la vidéo
      await sleep(800);
      const allure = w.mesures.map.getSource("allure-video")?.serialize().data?.features || [];
      const preview = doc.querySelector("#parcours-apercu");
      expect("aperçu : tracé coloré selon la vitesse, bouton actif", allure.length > 20 && !preview.disabled, allure.length);
      preview.click();
      await sleep(2000);
      const dot = doc.querySelector(".apercu-video span")?.textContent || "";
      expect("aperçu : repère avec vitesse et temps", /^\d+ km\/h · 0 min 0[12] s$/.test(dot), dot);
      preview.click();
      expect("aperçu : arrêté au second clic", !doc.querySelector(".apercu-video") && /Aperçu/.test(preview.textContent));
      // Croisements et ouvrages d'art : posés d'eux-mêmes en cochant l'option (carrefour de la RD18 à l'arrivée au moins),
      // vitesse ramenée à 50 km/h sur eux ; un clic sur un repère le retire
      const slowBox = doc.querySelector("#video-ralenti");
      slowBox.click();
      await sleep(300);
      const slowMarks = () => [...doc.querySelectorAll(".repere-requete.ralenti")];
      const slowAt = w.mesures.videoPlan && slowMarks().length;
      log(`ralentissements posés : ${slowAt} ; ${status()}`);
      expect("ralentissements : posés d'eux-mêmes sur le parcours", slowAt >= 1, slowAt);
      const slowPres = { vmax: 150 / 3.6, vmin: 30 / 3.6, turn: 12, accel: 2, slow: 50 / 3.6,
        slows: [w.mesures.videoPlan.photos.at(-3).coords] };
      const withSlow = Video.presentationSpeeds(long, slowPres);
      const slowX = long.s[long.list.findIndex((p) => p.coords === w.mesures.videoPlan.photos.at(-3).coords)] ?? long.length - 10;
      expect("ralentissements : 50 km/h au plus sur le point", 3.6 * withSlow[Math.round(slowX)] <= 50 + 1e-6, 3.6 * withSlow[Math.round(slowX)]);
      slowMarks()[0].click();
      expect("ralentissements : un clic sur un repère le retire", slowMarks().length === slowAt - 1, slowMarks().length);
      slowBox.click();
      for (const m of slowMarks()) m.click();
      // Dévers lu sur le LiDAR HD en cochant « Accélération latérale » : vers l'intérieur dans les virages marqués, plausible
      const meter = doc.querySelector("#video-acceleration"), help = meter.closest("label").querySelector(".aide");
      meter.checked = true;
      meter.dispatchEvent(new w.Event("change"));
      await until(() => /ARP/.test(help.textContent), 120000, "dévers lu");
      const samples = long.list.map((p, i) => [p.devers, Video.insideDevers(long, [long.s[i]])[0],
        Math.abs(((long.course(long.s[i] + 5) - long.course(long.s[i] - 5)) % 360 + 540) % 360 - 180) / 10]);
      const bends = samples.filter(([, , t]) => t > 0.3).map(([, d]) => d).sort((a, b) => a - b);
      log(`dévers : ${help.textContent} ; ${samples.filter(([d]) => d != null).length} photos sur ${samples.length}, `
        + `de ${(100 * Math.min(...samples.map(([d]) => d ?? 0))).toFixed(1)} à ${(100 * Math.max(...samples.map(([d]) => d ?? 0))).toFixed(1)} % ; `
        + `virages (> 0,3 °/m) : ${bends.length} photos, médiane ${(100 * bends[bends.length >> 1]).toFixed(1)} % vers l'intérieur`);
      expect("dévers : lu sur le LiDAR HD pour toutes les photos (classement ARP annoncé)", /^Conforme au classement de l'ARP/.test(help.textContent), help.textContent);
      expect("dévers : plausible (moins de 10 %)", samples.every(([d]) => d == null || Math.abs(d) < 0.1));
      expect("dévers : vers l'intérieur dans les virages marqués (médiane)", bends.length > 3 && bends[bends.length >> 1] > 0, bends.join(" "));
      meter.checked = false;
      meter.dispatchEvent(new w.Event("change"));
      // Allure du mode Présentation (réglages par défaut) : bornée par la vitesse des lignes droites, arrêtée aux bouts,
      // accélérations et freinages tenus, plus lente au virage le plus serré qu'en ligne droite ; un arrêt au milieu tenu
      // 3 s (images identiques)
      const P = Video.PRES, pres = { vmax: P.vmax / 3.6, vmin: P.vmin / 3.6, turn: P.turn, accel: P.accel, stop: P.stop, stops: [] };
      const ps = Video.presentationSpeeds(long, pres);
      const jerk = Math.max(...ps.slice(1).map((v, x) => Math.abs(v * v - ps[x] * ps[x]) / 2));
      let tight = 0, tightTurn = 0;
      for (let x = 60; x < long.length - 60; x++) {
        const turn = Math.abs(((long.course(x + 10) - long.course(x - 10)) % 360 + 540) % 360 - 180);
        if (turn > tightTurn) [tight, tightTurn] = [x, turn];
      }
      log(`allure : ${[0, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000].filter((x) => x < ps.length).map((x) => `${x} m ${(3.6 * ps[x]).toFixed(0)}`).join(", ")} km/h ; `
        + `virage le plus serré à ${tight} m : ${(3.6 * ps[tight]).toFixed(0)} km/h ; accélération au plus ${jerk.toFixed(2)} m/s²`);
      expect("allure : bornée, arrêtée aux bouts", Math.max(...ps) <= pres.vmax + 1e-9 && ps[0] === 0 && ps.at(-1) === 0);
      expect("allure : accélération et freinage tenus", jerk <= pres.accel + 1e-6, jerk);
      expect("allure : plus lente au virage le plus serré", ps[tight] < 0.8 * Math.max(...ps), `${ps[tight]} ${Math.max(...ps)}`);
      const stopAt = long.at(long.length / 2), held = Video.timeline(long, 25, false, [], null, null, { ...pres, stops: [stopAt] });
      let still = 0, best = 0;
      held.forEach((x, i) => { still = i && x === held[i - 1] ? still + 1 : 0; if (i > Video.HOLD * Video.FPS + 1 && i < held.length - Video.HOLD * Video.FPS - 1) best = Math.max(best, still); });
      expect("arrêt : position tenue 3 s au milieu", Math.abs(best + 1 - 3 * Video.FPS) <= 1, best);
      const xs = Video.timeline(long, 25, true), plain = Video.timeline(long, 25, false);
      const speedAt = (i) => (xs[i + 1] - xs[i]) * Video.FPS;
      const run = xs.slice(Video.HOLD * Video.FPS, -Video.HOLD * Video.FPS - 1).map((_, i) => i + Video.HOLD * Video.FPS);
      const speeds = run.map(speedAt).slice(0, -1);  // sans le dernier pas, tronqué au bout du parcours
      // Virage le plus serré hors des 50 premiers et derniers mètres : variation du cap lissé sur 10 m
      let sharp = 0, sharpTurn = 0;
      for (let x = 60; x < long.length - 60; x++) {
        const turn = Math.abs(((long.course(x + 5) - long.course(x - 5)) % 360 + 540) % 360 - 180);
        if (turn > sharpTurn) [sharp, sharpTurn] = [x, turn];
      }
      const atSharp = speedAt(xs.findIndex((x) => x >= sharp));
      const profile = [];
      for (let d = 0; d < long.length; d += 100) profile.push(`${d} m : ${speedAt(xs.findIndex((x) => x >= d)).toFixed(0)}`);
      log(`rampe sur ${long.length.toFixed(0)} m : ${profile.join(", ")} m/s ; virage le plus serré à ${sharp} m (${sharpTurn.toFixed(0)}° sur 10 m) : `
        + `${atSharp.toFixed(1)} m/s ; durée ${(xs.length / 30).toFixed(1)} s contre ${(plain.length / 30).toFixed(1)} s sans`);
      expect("rampe : parcours d'au moins 500 m", long.length >= 500, long.length);
      expect("rampe : pleine vitesse atteinte en ligne droite (95 % au moins)", Math.max(...speeds) >= 0.95 * 25, Math.max(...speeds));
      // Virage le plus serré de cette route peu sinueuse : 6° sur 10 m (rayon ~ 95 m, sous RAMP_MARKED) : ~ 75 %
      expect("rampe : ralentie au virage le plus serré (85 % de la vitesse de pointe au plus)", atSharp <= 0.85 * Math.max(...speeds), atSharp);
      expect("rampe : jamais sous 35 % de la vitesse choisie", Math.min(...speeds) >= 0.35 * 25 - 0.01, Math.min(...speeds));
      expect("rampe : départ en douceur (moins de 60 % au départ)", speeds[0] < 0.6 * 25, speeds[0]);
      expect("rampe : vidéo plus longue qu'à vitesse constante", xs.length > plain.length);
      // Virage marqué (calculé, sans réseau) : 300 m droits, quart de cercle de 30 m de rayon (1,9°/m), 300 m droits ;
      // sensibilité doublée au-delà de 1°/m : 40 % au plus au milieu du virage, pleine vitesse sur les droites
      const deg = (m) => m / 111320, lon = (m) => m / (111320 * Math.cos(47 * Math.PI / 180));
      const synthetic = [];
      for (let m = 0; m <= 300; m += 5) synthetic.push([lon(0), deg(m)]);
      for (let a = 5; a <= 90; a += 5) synthetic.push([lon(30 - 30 * Math.cos(a * Math.PI / 180)), deg(300 + 30 * Math.sin(a * Math.PI / 180))]);
      for (let m = 5; m <= 300; m += 5) synthetic.push([lon(30 + m), deg(330)]);
      const bend = Video.trajectory(synthetic.map((c) => ({ coords: [4.85 + c[0], 47 + c[1]], alt: 200, heading: 0 })));
      const bx = Video.timeline(bend, 25, true);
      const bendSpeed = (d) => { const i = bx.findIndex((x) => x >= d); return (bx[i + 1] - bx[i]) * Video.FPS; };
      const apex = 300 + Math.PI * 30 / 4;
      log(`virage marqué (30 m de rayon) : ${bendSpeed(150).toFixed(1)} m/s sur la droite, ${bendSpeed(apex).toFixed(1)} au milieu du virage`);
      expect("rampe : virage marqué ralenti à 40 % au plus", bendSpeed(apex) <= 0.4 * 25, bendSpeed(apex));
      expect("rampe : pleine vitesse sur la droite avant le virage", bendSpeed(150) >= 0.95 * 25, bendSpeed(150));
      // Accélération latérale : nulle sur la droite, v²/R au milieu d'un virage de 200 m de rayon (130 km/h : 665 mG)
      const wide = [];
      for (let m = 0; m <= 300; m += 5) wide.push([lon(0), deg(m)]);
      for (let a = 1; a <= 90; a++) wide.push([lon(200 - 200 * Math.cos(a * Math.PI / 180)), deg(300 + 200 * Math.sin(a * Math.PI / 180))]);
      const [onStraight, curved] = Video.laterals(Video.trajectory(wide.map((c) => ({ coords: [4.85 + c[0], 47 + c[1]], alt: 200, heading: 0 }))),
        [150, 300 + Math.PI * 50], [130, 130]);
      expect("accélération latérale : nulle sur la droite, 665 mG dans le virage de 200 m à 130 km/h",
        onStraight < 1 && Math.abs(curved - 1000 * 36.11 ** 2 / 200 / 9.81) < 20, `${onStraight} ${curved}`);
      // Seuils de l'ARP à 90 km/h (entre R 80 et T 100) : frottement 0,083 au rayon non déversé, 0,128 au rayon minimal
      expect("accélération latérale : vert / jaune / rouge selon l'ARP, dévers déduit",
        Video.lateralColor(60, 90) === "#4caf50" && Video.lateralColor(100, 90) === "#ffd600" && Video.lateralColor(150, 90) === "#ff3d3d"
        && Video.lateralColor(150, 90, 0.05) === "#ffd600");
      const dl = (sign) => Video.insideDevers(Video.trajectory(wide.map((c) => ({ coords: [4.85 + sign * c[0], 47 + c[1]], alt: 200, heading: 0, devers: 0.04 }))),
        [300 + Math.PI * 50])[0];
      // Vitesse max ARP dans le virage de 200 m : sans dévers, V² / (127 × 200) = 0,072 (seuil du rayon non déversé de
      // R 60, gardé sous 60 km/h) : 42 km/h
      const wideTrack = Video.trajectory(wide.map((c) => ({ coords: [4.85 + c[0], 47 + c[1]], alt: 200, heading: 0 })));
      const [vStraight, vBend] = Video.arpSpeeds(wideTrack, [150, 300 + Math.PI * 50]);
      expect("vitesse max ARP : « — » sur la droite, 42 km/h dans le virage de 200 m sans dévers", vStraight === null && vBend === 42, `${vStraight} ${vBend}`);
      // Affichage sans battement, extrêmes gardés : monte aussitôt (pic exact), ne redescend que de 10 au moins ; vitesse
      // max : descend aussitôt (creux exact), ne remonte que de 5 au moins
      const peakShown = Video.steady([100, 104, 96, 109, 111, 105, 98, null, 37], 10).join(" ");
      const dip = Video.steady([80, 77, 79, 81, 72, 75, 78], 5, false).join(" ");
      expect("compteurs : pic gardé, retour d'au moins 10", peakShown === "100 104 104 109 111 111 98  37", peakShown);
      expect("compteurs : creux gardé, retour d'au moins 5", dip === "80 77 77 77 72 72 78", dip);
      expect("dévers vers l'intérieur : celui de la photo dans un virage à droite, opposé à gauche", Math.abs(dl(1) - 0.04) < 1e-9 && Math.abs(dl(-1) + 0.04) < 1e-9, `${dl(1)} ${dl(-1)}`);
      // Rampe : hors du mode Présentation (qui la remplace par son allure), sans changer les autres options
      doc.querySelector("#video-mode").value = "revue";
      doc.querySelector("#video-rampe").checked = true;
      doc.querySelector("#video-rampe").dispatchEvent(new w.Event("change"));
      const info = doc.querySelector("#video-info").textContent;
      doc.querySelector("#video-mode").value = "presentation";
      log("avec la rampe : " + info);
      expect("rampe : durée de la vidéo allongée dans l'affichage", new RegExp(` ${Math.round(xs.length / 30)} s · `).test(info), info);
      doc.querySelector("#video-rampe").checked = false;
      doc.querySelector("#video-rampe").dispatchEvent(new w.Event("change"));
      // Compteur PR : PR de chaque photo, défilement continu (moins de 2 m d'une image à l'autre à 90 km/h, sauf au
      // passage d'un PR : l'ancien fini près de 0 en descendant), titre et compteur dessinés sur la vidéo
      const longPhotos = w.mesures.videoPlan.photos;
      const withPr = longPhotos.filter((p) => p.pr).length;
      log(`PR des photos : ${withPr} / ${longPhotos.length} ; premier ${JSON.stringify(longPhotos[0].pr)}, dernier ${JSON.stringify(longPhotos.at(-1).pr)}`);
      expect("compteur : PR connu pour 90 % des photos au moins", withPr >= 0.9 * longPhotos.length, `${withPr}/${longPhotos.length}`);
      const counts = plain.map((x) => Video.prAt(long, x)).filter(Boolean);
      let jumps = 0, crossings = [];
      for (let i = 1; i < counts.length; i++) {
        const [a, b] = [counts[i - 1], counts[i]];
        if (a.n !== b.n) crossings.push(`PR ${a.n} +${a.m.toFixed(1)} → PR ${b.n} +${b.m.toFixed(1)}`);

        await log(`IMAGE video-${t.toFixed(2).padStart(6, "0")} ` + canvas.toDataURL("image/jpeg", 0.8));
      }
      expect("pas d'image noire (tuiles manquantes)", dark === 0, String(dark));
      // Flou cinétique : même vidéo, netteté du bas de l'image (chaussée qui défile) plus faible au même instant
      const t1 = performance.now();
      const blurred = await Video.mp4(chosen, Number(select.value), () => {}, null, { blur: true });
      log(`flou cinétique : ${(blurred.size / 1e6).toFixed(1)} Mo en ${((performance.now() - t1) / 1000).toFixed(0)} s`);
      const sharpness = async (b, name) => {
        const v2 = Object.assign(document.createElement("video"), { muted: true, src: URL.createObjectURL(b) });
        await new Promise((resolve) => { v2.onloadedmetadata = resolve; });
        v2.currentTime = 2.5;
        await new Promise((resolve) => { v2.onseeked = resolve; });
        ctx.drawImage(v2, 0, 0, canvas.width, canvas.height);
        await log(`IMAGE ${name} ` + canvas.toDataURL("image/jpeg", 0.85));
        const h0 = Math.round(canvas.height * 0.6), px = ctx.getImageData(0, h0, canvas.width, canvas.height - h0).data;
        let e = 0;
        for (let i = 4; i < px.length; i += 4) e += Math.abs(px[i] - px[i - 4]);
        return e / (px.length / 4);
      };
      const [sharp, soft] = [await sharpness(blob, "net"), await sharpness(blurred, "flou")];
      log(`netteté du bas de l'image : ${sharp.toFixed(2)} sans flou, ${soft.toFixed(2)} avec`);
      expect("flou cinétique : bas de l'image moins net", soft < sharp * 0.9, `${soft} / ${sharp}`);
      expect("« Flou cinétique » proposé, décoché par défaut", doc.querySelector("#video-flou") && !doc.querySelector("#video-flou").checked);
      // « 🎬 Enregistrer la vidéo » : boîte d'enregistrement simulée, avancement dans la ligne d'état, fichier écrit
      let written = null, closed = false;
      w.showSaveFilePicker = async (o) => ({ name: o.suggestedName, createWritable: async () => ({ write: async (b) => { written = b; }, close: async () => { closed = true; } }) });
      doc.querySelector("#video-photos").value = "4";
      button.click();
      await until(() => !doc.querySelector("#parcours-video-arret").hidden, 10000, "calcul lancé (« ■ Arrêter » affiché)");
      // Avancement lu dès qu'il paraît (avec la carte graphique, le calcul dure à peine quelques secondes)
      await until(() => /image *[\u2007\d]*[1-9]/.test(status()), 30000, "avancement affiché");
      expect("avancement dans la ligne d'état", /Calcul de la vidéo en cours : image [\u2007\d]{5} \/ [\u2007\d]{5} \([\u2007\d]{3} %\)$/.test(status()), status());
      const statut = doc.querySelector("#statut");
      const bar = parseFloat(statut.style.getPropertyValue("--avancement"));
      log(`barre d'avancement : ${bar} % ; fond ${w.getComputedStyle(statut).backgroundImage.slice(0, 80)}`);
      expect("ligne d'état remplie d'orange selon l'avancement", statut.classList.contains("avancement") && bar > 0 && bar < 100
        && /linear-gradient/.test(w.getComputedStyle(statut).backgroundImage), `${bar}`);
      await until(() => closed || /impossible/.test(status()), 300000, "fichier écrit");
      log("après : " + status());
      expect("barre retirée à la fin", !doc.querySelector("#statut").classList.contains("avancement"));
      expect("bouton : fichier MP4 écrit", closed && written?.size > 100000, String(written?.size));
      expect("nom du fichier rappelé à la fin", /Vidéo enregistrée dans « parcours D115D .+ 180 km-h\.mp4 »/.test(status()), status());
      if (location.hash.includes("fichier")) {
        const data = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
        await log("FICHIER parcours.mp4 " + data);
      }
    }
    if (!only || only === "exposition") {
      // Carrefour RD18 / D115D, sans filtre de date : la séquence de mai bifurque sur une de juillet, signalé avant la vidéo
      const since = doc.querySelector("#depuis");
      since.value = "";
      since.dispatchEvent(new w.Event("change"));
      await sleep(1000);
      const pick = async (which, lonlat) => {
        dialog.querySelector(`.sur-carte[data-cote="${which}"]`).click();
        const m = w.mesures.map;
        m.fire("click", { lngLat: new w.maplibregl.LngLat(...lonlat), point: m.project(lonlat), originalEvent: new w.MouseEvent("click") });
        await until(() => (which === "start" ? pr : end).value, 30000, `PR du point ${which}`);
      };
      const B = [4.849261606, 47.075125126];
      for (const input of [route, pr, end]) type(input, "");
      await pick("start", [4.849496011, 47.075705494]);
      await pick("end", B);
      // Pointe des épingles sur le point cliqué (bug du 31/10 : l'arrivée tombait 42 px plus bas, sous le départ)
      for (const [css, ll] of [["depart", [4.849496011, 47.075705494]], ["arrivee", B]]) {
        const m = w.mesures.map, r = doc.querySelector(`.repere-requete.${css}`).getBoundingClientRect();
        const c = m.getCanvas().getBoundingClientRect(), p = m.project(ll);
        const gap = Math.hypot(r.left + r.width / 2 - c.left - p.x, r.bottom - c.top - p.y);
        expect(`épingle « ${css} » : pointe sur le point cliqué (moins de 2 px)`, gap < 2, gap.toFixed(1));
      }
      expect("départ ou arrivée changés : vidéo à préparer de nouveau", /Préparer/.test(button.textContent) && !button.disabled);
      button.click();
      await until(() => /Enregistrer/.test(button.textContent) || /impossible/.test(status()), 120000, "vidéo du carrefour préparée");
      const cross = w.mesures.videoPlan;
      const lastPhoto = cross?.photos?.[cross.photos.length - 1];
      log(`carrefour : ${cross?.photos?.length} photos, ${cross?.switches} changement(s), dernière à ${lastPhoto ? dist(lastPhoto.coords, B).toFixed(0) : "?"} m ; ${status()} | ${doc.querySelector("#video-info").textContent}`);
      expect("carrefour : changement de séquence trouvé", cross?.switches >= 1);
      expect("carrefour : signalé dans la ligne d'état (en orange) et sous les listes", /séquences/.test(status())
        && doc.querySelector("#statut").classList.contains("avertissement") && /⚠/.test(doc.querySelector("#video-info").textContent));
      expect("carrefour : arrivée atteinte (moins de 10 m)", lastPhoto && dist(lastPhoto.coords, B) < 10);
      // Exposition accordée au changement de séquence : juillet 1,5 fois plus clair que mai sur le tour d'horizon (1,58 au
      // même endroit dans le même sens) : gain de la première photo de juillet ~ 1 / 1,5, puis retour vers 1 en 100 m
      const trajet = Video.trajectory(cross.photos);
      const change = trajet.list.findIndex((p, i) => i && p.collection !== trajet.list[i - 1].collection);
      const gains = (await Video.exposures(trajet, null, false)).map((g) => (g[0] + g[1] + g[2]) / 3);
      log(`exposition au carrefour : gains ${gains.map((g) => g.toFixed(2)).join(" ")} (changement à la photo ${change})`);
      expect("exposition : séquence de départ inchangée", gains.slice(0, change).every((g) => g === 1));
      expect("exposition : juillet ramené sur mai au changement (gain 0,55 à 0,75)", gains[change] > 0.55 && gains[change] < 0.75, gains[change]);
      // Photos isolées (exemple du 01/11, forêt de la séquence d8fd3b08) : une photo ratée ramenée sur ses voisines, une
      // marche franche du décor (entrée dans un champ) gardée
      const step = Array.from({ length: 20 }, (_, i) => ({ collection: "a", time: i * 200 }));
      const values = step.map((_, i) => (i < 10 ? [-1.5, -1.5, -1.5] : [-0.8, -0.8, -0.8]));
      expect("luminosité : marche du décor gardée", Video.isolated(step, values).every((f) => f === null));
      values[5] = [-1, -1, -1];
      const fixed = Video.isolated(step, values);
      expect("luminosité : photo isolée ramenée sur ses voisines", fixed[5] && Math.abs(fixed[5][0] + 0.5) < 1e-9
        && fixed.every((f, i) => i === 5 || f === null), JSON.stringify(fixed[5]));
      // Raccord de séquence : cap lissé plus largement (± 40 m) ; sans raccord (même séquence partout), cap plus heurté
    const plain = Video.trajectory(cross.photos.map((p) => ({ ...p, collection: "une" })));
    const seamAt = (trajet.s[change - 1] + trajet.s[change]) / 2;
    const jerk = (t) => Math.max(...Array.from({ length: 81 }, (_, k) => seamAt - 40 + k)
      .map((x) => Math.abs(((t.course(x + 1) - t.course(x)) % 360 + 540) % 360 - 180)));
    log(`raccord : cap au plus ${jerk(trajet).toFixed(2)} °/m lissé, ${jerk(plain).toFixed(2)} °/m sans lissage`);
    expect("raccord : cap lissé autour du changement de séquence", jerk(trajet) <= jerk(plain) + 1e-9, `${jerk(trajet)} ${jerk(plain)}`);
    expect("exposition : retour progressif vers sa propre exposition", gains.slice(change + 1).every((g, i) => g >= gains[change + i] - 1e-9));
    }
    log(failures ? `ERREUR ${failures} contrôle(s) sur ${checks} en échec` : `contrôles : ${checks} réussis`);
    log(failures ? "ERREUR" : "FIN");
  } catch (error) {
    log("ERREUR " + error + " " + (error.stack || ""));
  }
})();
</script>
