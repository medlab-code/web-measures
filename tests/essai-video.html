<!-- Vidéo MP4 sans lire le parcours : D115D du PR 1 + 146 au PR 1 + 0 (photos du CD21 du 10 juillet 2025), « Préparer »
     (toutes les photos, une tous les 5 m), vidéo à 180 km/h avec une photo sur 2 calculée par Video.mp4 puis relue :
     taille, durée ; une image par seconde dans le journal en JPEG (« IMAGE nom data: », #fichier : le MP4 aussi) ;
     « Enregistrer » par le bouton (boîte d'enregistrement simulée). Puis carrefour RD18 / D115D (photos 69f5822b →
     3dc34aaf, sans filtre) : changement de séquence signalé. Lancer comme tests/navigateur.html. -->
<script>try {
  localStorage.clear();
  localStorage.setItem("web-measures/filtre", JSON.stringify({ since: "2025-07-05" }));
} catch {}</script>
<iframe id="f" src="../index.html" style="width:1400px;height:1000px"></iframe>
<script>
const log = (t) => fetch("/journal", { method: "POST", body: String(t) }).catch(() => {});
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(test, ms, what) { const t0 = Date.now(); while (!test()) { if (Date.now() - t0 > ms) throw new Error("délai dépassé : " + what); await sleep(250); } }
let failures = 0, checks = 0;
const expect = (what, ok, detail = "") => { checks++; if (!ok) { failures++; log("ÉCHEC " + what + (detail ? " : " + detail : "")); } };
(async () => {
  const w = document.getElementById("f").contentWindow;
  try {
    await until(() => w.mesures?.app && w.mesures.map?.loaded?.(), 180000, "Pyodide");
    const doc = w.document;
    const warn = w.console.warn.bind(w.console);
    w.console.warn = (...args) => { log("AVERT " + args.map(String).join(" ").slice(0, 300)); warn(...args); };
    doc.querySelector("#reglages-defaut")?.close();
    w.mesures.map.jumpTo({ center: [4.85562, 47.06807], zoom: 15 });
    await sleep(1500);
    const type = (input, text) => { input.focus(); input.value = text; input.dispatchEvent(new w.Event("input", { bubbles: true })); };
    doc.querySelector("#onglet-parcours").click();
    const dialog = doc.querySelector("#parcours");
    const [route, pr, end] = dialog.querySelectorAll(".champ input");
    const [distance, endDistance] = dialog.querySelectorAll(".distance");
    const button = doc.querySelector("#parcours-video");
    const status = () => doc.querySelector("#statut")?.textContent || "";
    expect("« 🎬 Préparer la vidéo » grisé sans départ ni arrivée", button.disabled && /Préparer/.test(button.textContent));
    type(route, "115d");
    type(pr, "1");
    distance.value = "146";
    type(end, "1");
    endDistance.value = "0";
    await sleep(3000);
    expect("« 🎬 Préparer la vidéo » actif une fois départ et arrivée saisis (sans lire le parcours)", !button.disabled);
    const k = 111320 * Math.cos(47.07 * Math.PI / 180);
    const dist = (p, q) => Math.hypot((p[0] - q[0]) * k, (p[1] - q[1]) * 111320);
    // Parties : 1,1 km (rampe de vitesse, titre, compteur PR), D115D courte (vidéo calculée et enregistrée), carrefour
    // (changement de séquence, exposition) ; ancre #long ou #exposition : cette partie seule (mise au point, plus court)
    const only = location.hash.match(/#(long|exposition)/)?.[1];
    const Video = w.eval("Video");
    let select = doc.querySelector("#video-vitesse");
    let canvas = Object.assign(document.createElement("canvas"), { width: 960, height: 540 });
    let ctx = canvas.getContext("2d");
    if (!only || only === "long") {
      // Rampe de vitesse, D115D du PR 1 + 146 au PR 0 (1,1 km : virages de la sortie d'Aloxe-Corton, carrefour de la
      // RD18) à 90 km/h (25 m/s) : pleine vitesse en ligne droite, ralentie au virage le plus serré, jamais sous 35 %,
      // départ et arrivée en douceur ; vidéo seulement préparée (pas calculée)
      expect("cases : « Exposition accordée » cochée, « Rampe de vitesse » et « Flou cinétique » décochées",
        doc.querySelector("#video-expo").checked && !doc.querySelector("#video-rampe").checked && !doc.querySelector("#video-flou").checked);
      type(end, "0");
      endDistance.value = "0";
      await sleep(1500);
      button.click();
      await until(() => /Enregistrer/.test(button.textContent) || /impossible/.test(status()), 120000, "vidéo de 1,1 km préparée");
      const long = Video.trajectory(w.mesures.videoPlan?.photos || []);
      const xs = Video.timeline(long, 25, true), plain = Video.timeline(long, 25, false);
      const speedAt = (i) => (xs[i + 1] - xs[i]) * Video.FPS;
      const run = xs.slice(Video.HOLD * Video.FPS, -Video.HOLD * Video.FPS - 1).map((_, i) => i + Video.HOLD * Video.FPS);
      const speeds = run.map(speedAt).slice(0, -1);  // sans le dernier pas, tronqué au bout du parcours
      // Virage le plus serré hors des 50 premiers et derniers mètres : variation du cap lissé sur 10 m
      let sharp = 0, sharpTurn = 0;
      for (let x = 60; x < long.length - 60; x++) {
        const turn = Math.abs(((long.course(x + 5) - long.course(x - 5)) % 360 + 540) % 360 - 180);
        if (turn > sharpTurn) [sharp, sharpTurn] = [x, turn];
      }
      const atSharp = speedAt(xs.findIndex((x) => x >= sharp));
      const profile = [];
      for (let d = 0; d < long.length; d += 100) profile.push(`${d} m : ${speedAt(xs.findIndex((x) => x >= d)).toFixed(0)}`);
      log(`rampe sur ${long.length.toFixed(0)} m : ${profile.join(", ")} m/s ; virage le plus serré à ${sharp} m (${sharpTurn.toFixed(0)}° sur 10 m) : `
        + `${atSharp.toFixed(1)} m/s ; durée ${(xs.length / 30).toFixed(1)} s contre ${(plain.length / 30).toFixed(1)} s sans`);
      expect("rampe : parcours d'au moins 500 m", long.length >= 500, long.length);
      expect("rampe : pleine vitesse atteinte en ligne droite (95 % au moins)", Math.max(...speeds) >= 0.95 * 25, Math.max(...speeds));
      // Virage le plus serré de cette route peu sinueuse : 6° sur 10 m (rayon ~ 95 m, sous RAMP_MARKED) : ~ 75 %
      expect("rampe : ralentie au virage le plus serré (85 % de la vitesse de pointe au plus)", atSharp <= 0.85 * Math.max(...speeds), atSharp);
      expect("rampe : jamais sous 35 % de la vitesse choisie", Math.min(...speeds) >= 0.35 * 25 - 0.01, Math.min(...speeds));
      expect("rampe : départ en douceur (moins de 60 % au départ)", speeds[0] < 0.6 * 25, speeds[0]);
      expect("rampe : vidéo plus longue qu'à vitesse constante", xs.length > plain.length);
      // Virage marqué (calculé, sans réseau) : 300 m droits, quart de cercle de 30 m de rayon (1,9°/m), 300 m droits ;
      // sensibilité doublée au-delà de 1°/m : 40 % au plus au milieu du virage, pleine vitesse sur les droites
      const deg = (m) => m / 111320, lon = (m) => m / (111320 * Math.cos(47 * Math.PI / 180));
      const synthetic = [];
      for (let m = 0; m <= 300; m += 5) synthetic.push([lon(0), deg(m)]);
      for (let a = 5; a <= 90; a += 5) synthetic.push([lon(30 - 30 * Math.cos(a * Math.PI / 180)), deg(300 + 30 * Math.sin(a * Math.PI / 180))]);
      for (let m = 5; m <= 300; m += 5) synthetic.push([lon(30 + m), deg(330)]);
      const bend = Video.trajectory(synthetic.map((c) => ({ coords: [4.85 + c[0], 47 + c[1]], alt: 200, heading: 0 })));
      const bx = Video.timeline(bend, 25, true);
      const bendSpeed = (d) => { const i = bx.findIndex((x) => x >= d); return (bx[i + 1] - bx[i]) * Video.FPS; };
      const apex = 300 + Math.PI * 30 / 4;
      log(`virage marqué (30 m de rayon) : ${bendSpeed(150).toFixed(1)} m/s sur la droite, ${bendSpeed(apex).toFixed(1)} au milieu du virage`);
      expect("rampe : virage marqué ralenti à 40 % au plus", bendSpeed(apex) <= 0.4 * 25, bendSpeed(apex));
      expect("rampe : pleine vitesse sur la droite avant le virage", bendSpeed(150) >= 0.95 * 25, bendSpeed(150));

      doc.querySelector("#video-rampe").dispatchEvent(new w.Event("change"));
      const info = doc.querySelector("#video-info").textContent;
      log("avec la rampe : " + info);
      expect("rampe : durée de la vidéo allongée dans l'affichage", new RegExp(` ${Math.round(xs.length / 30)} s · `).test(info), info);
      doc.querySelector("#video-rampe").checked = false;
      doc.querySelector("#video-rampe").dispatchEvent(new w.Event("change"));
      // Compteur PR : PR de chaque photo, défilement continu (moins de 2 m d'une image à l'autre à 90 km/h, sauf au
      // passage d'un PR : l'ancien fini près de 0 en descendant), titre et compteur dessinés sur la vidéo
      const longPhotos = w.mesures.videoPlan.photos;
      const withPr = longPhotos.filter((p) => p.pr).length;
      log(`PR des photos : ${withPr} / ${longPhotos.length} ; premier ${JSON.stringify(longPhotos[0].pr)}, dernier ${JSON.stringify(longPhotos.at(-1).pr)}`);
      expect("compteur : PR connu pour 90 % des photos au moins", withPr >= 0.9 * longPhotos.length, `${withPr}/${longPhotos.length}`);
      const counts = plain.map((x) => Video.prAt(long, x)).filter(Boolean);
      let jumps = 0, crossings = [];
      for (let i = 1; i < counts.length; i++) {
        const [a, b] = [counts[i - 1], counts[i]];
        if (a.n !== b.n) crossings.push(`PR ${a.n} +${a.m.toFixed(1)} → PR ${b.n} +${b.m.toFixed(1)}`);
        else if (Math.abs(b.m - a.m) > 2) jumps++;
      }
      log(`compteur : ${jumps} saut(s), passages ${crossings.join(" ; ")}`);
      expect("compteur : défilement continu (pas de saut de plus de 2 m par image)", jumps === 0, jumps);
      expect("compteur : passage du PR 1 au PR 0 en descendant (PR 1 fini près de 0)", crossings.some((c) => /PR 1 \+[0-2]\.\d → PR 0/.test(c)), crossings.join(" ; "));
      // Regard aux croisements : carrefours de la BD TOPO le long du parcours ; au niveau du carrefour, regard dans
      // l'axe de la voie croisée (cap de la voie depuis le carrefour, par rapport à la route), 120° au plus
      const jn = w.mesures.videoPlan.junctions || [];
      const looks = Video.pans(long, plain, { junctions: jn });
      const aims = [];
      for (const { lonlat, branches } of jn) {
        let bx = -1, bd = 12;
        for (let x = 0; x <= long.length; x += 2) { const d = dist(long.at(x), lonlat); if (d < bd) [bx, bd] = [x, d]; }
        if (bx < 30 || bx > long.length - 10) continue;
        const frame = plain.findIndex((x) => x >= bx);
        const rel = branches.map((b) => ((b - long.course(bx)) % 360 + 540) % 360 - 180).filter((r) => Math.abs(r) > 30 && Math.abs(r) < 150);
        if (rel.length && looks[frame]) aims.push(`${looks[frame].toFixed(0)}° (voie à ${rel.map((r) => r.toFixed(0)).join(", ")}°)`);
        if (rel.length && looks[frame]) expect("croisements : au niveau du carrefour, regard dans l'axe d'une voie croisée (± 3°)",
          rel.some((r) => Math.abs(Math.sign(r) * Math.min(120, Math.abs(r)) - looks[frame]) < 3), `${looks[frame]} / ${rel}`);
      }
      log(`croisements : ${jn.length} carrefour(s) près du parcours ; au niveau des carrefours regardés : ${aims.join(" ; ") || "aucun"}`);
      expect("croisements : carrefours trouvés (BD TOPO)", jn.length > 0, jn.length);
      expect("croisements : au moins un regard dans l'axe d'une voie", aims.length > 0);
      expect("croisements : regard de 120° au plus", looks.every((v) => Math.abs(v) <= 120.01));
      // Ralentissement au regard (vitesse de regard 70 km/h) : à 360 km/h ~ 70 au carrefour, à 30 km/h presque rien
      const lookedAt = Video.lookedJunctions(long, jn);
      const speedAtJunction = (kmh) => {
        const t = Video.timeline(long, kmh / 3.6, false, lookedAt, 70 / 3.6);
        const i = t.findIndex((x) => x >= lookedAt[0].x);
        return (t[i + 1] - t[i]) * Video.FPS * 3.6;
      };
      const [fast, slow30] = [speedAtJunction(360), speedAtJunction(30)];
      const [d360, d360look] = [Video.duration(longPhotos, 360), Video.duration(longPhotos, 360, false, jn, 70)];
      log(`regard à 70 km/h : au carrefour ${fast.toFixed(0)} km/h en roulant à 360, ${slow30.toFixed(1)} à 30 ; durée à 360 : ${d360.toFixed(1)} s, ${d360look.toFixed(1)} s avec les regards`);
      expect("regard : à 360 km/h, ~ 70 km/h au carrefour (66 à 72)", fast > 66 && fast < 72, fast);
      expect("regard : à 30 km/h, presque pas ralenti (28 km/h au moins)", slow30 >= 28, slow30);
      expect("regard : vidéo plus longue à 360 km/h avec les regards", d360look > d360 + 2, `${d360} / ${d360look}`);
      expect("réglette de la vitesse de regard : 70 km/h par défaut", doc.querySelector("#regard-vitesse").value === "70"
        && doc.querySelector("#regard-valeur").textContent === "70 km/h");
      // Retour dans l'axe deux fois plus rapide que l'aller : images de rotation avant le passage ~ 2 × celles d'après
      const firstLook = looks.findIndex((v) => v), peak = looks.findIndex((v, i) => i > firstLook && v && Math.abs(v) === Math.max(...looks.slice(firstLook, firstLook + 90).map(Math.abs)));
      let last = peak;
      while (looks[last + 1]) last++;
      let hold = peak;
      while (Math.abs(looks[hold + 1] - looks[hold]) < 0.01 && hold < last) hold++;
      log(`regard : aller ${peak - firstLook} images, retour ${last - hold} images`);
      expect("croisements : retour dans l'axe environ deux fois plus rapide que l'aller", Math.abs((peak - firstLook) / Math.max(1, last - hold) - 2) < 0.5, `${peak - firstLook} / ${last - hold}`);
      // Tonneau au milieu du parcours : tour complet en 3 s (90 images), sans retour ; endroit à plus de 30 m refusé
      const rollAt = long.at(long.length / 3), turns = Video.rolls(long, plain, [rollAt]);  // pas au milieu : point d'intérêt
      const rolling = turns.filter((v) => v > 0 && v < 360).length;
      log(`tonneau : ${rolling} images de roulis, jusqu'à ${Math.max(...turns).toFixed(0)}°`);
      expect("tonneau : tour complet en 3 s environ (85 à 92 images)", rolling >= 85 && rolling <= 92 && Math.max(...turns) > 359, rolling);
      expect("tonneau : sans retour en arrière", turns.every((v, i) => !i || v >= turns[i - 1] || v === 0));
      const slow = Video.rolls(long, plain, [rollAt], 6).filter((v) => v > 0 && v < 360).length;
      // Plusieurs tonneaux, sens alterné dans l'ordre du parcours (posés dans le désordre)
      const two = Video.rolls(long, plain, [long.at(long.length * 0.8), long.at(long.length * 0.2)]);
      const firstSign = Math.sign(two.find((v) => v)), lastSign = Math.sign(two.findLast((v) => v));
      log(`deux tonneaux : ${two.filter((v) => v > 0).length} images dans un sens, ${two.filter((v) => v < 0).length} dans l'autre`);
      expect("tonneaux : le suivant tourne dans l'autre sens (ordre du parcours)", firstSign === 1 && lastSign === -1);
      expect("tonneau : durée réglable (6 s : 175 à 182 images)", slow >= 175 && slow <= 182, slow);
      expect("réglette de la durée du tonneau : 3 s par défaut", doc.querySelector("#tonneau-duree").value === "3"
        && doc.querySelector("#tonneau-valeur").textContent === "3 s");
      let refused = "";
      try { Video.rolls(long, plain, [rollAt, [rollAt[0] + 0.01, rollAt[1]]]); } catch (error) { refused = error.message; }
      expect("tonneau : endroit loin du parcours refusé avec un message (n° du tonneau)", /tonneau n° 2 .* du parcours/.test(refused), refused);
      // Point d'intérêt : cible à 60 m à gauche au milieu du parcours, objet relevé à 260 m d'altitude (20 m au-dessus
      // d'un sol plat supposé à 240 m), zone non tracée (150 m de part et d'autre), zone x2 en bosse, 70 km/h
      const mid = long.at(long.length / 2), side = (long.course(long.length / 2) - 90) * Math.PI / 180;
      const target = [mid[0] + 60 * Math.sin(side) / (111320 * Math.cos(mid[1] * Math.PI / 180)), mid[1] + 60 * Math.cos(side) / 111320];
      const flat = long.list.map(() => 240);
      const poiTest = { target, z: 260, start: null, end: null, speed: 70, zoom: 2, zoomByDistance: false, roll: true,
        ground: { target: 240, photos: [] } };
      const span = Video.poiSpan(long, poiTest);
      const views = Video.poiViews(long, plain, poiTest, flat);
      const closest = plain.findIndex((x) => x >= span.xc);
      log(`point d'intérêt : bornes ${span.x0.toFixed(0)} → ${span.x1.toFixed(0)} m, au plus près à ${span.xc.toFixed(0)} m (${span.dmin.toFixed(0)} m) ; `
        + `au passage : regard ${views.yaw[closest].toFixed(0)}°, visée ${views.lift[closest].toFixed(1)}°, zoom × ${views.zoom[closest].toFixed(2)}`);
      expect("intérêt : bornes à 150 m de part et d'autre du passage au plus près", Math.abs(span.xc - span.x0 - 150) < 2 && Math.abs(span.x1 - span.xc - 150) < 2);
      expect("intérêt : regard vers la cible à gauche au passage (-80 à -100°)", views.yaw[closest] < -80 && views.yaw[closest] > -100, views.yaw[closest]);
      expect("intérêt : visée en hauteur (20 m à 60 m, caméra à 2,4 m : ~ 16°)", Math.abs(views.lift[closest] - 16.3) < 1.5, views.lift[closest]);
      expect("intérêt : zoom × 2 au plus près, × 1 hors de l'effet", Math.abs(views.zoom[closest] - 2) < 0.05 && views.zoom[5] === 1);
      const byDistance = Video.poiViews(long, plain, { ...poiTest, zoomByDistance: true }, flat);
      const afterRise = plain.findIndex((x) => x >= span.x0) + 31;
      log(`zoom lié à la distance : × ${byDistance.zoom[afterRise].toFixed(2)} après la borne de début, × ${byDistance.zoom[closest].toFixed(2)} au plus près`);
      expect("intérêt : zoom lié à la distance (× 2 de loin, × 1 au plus près)", byDistance.zoom[afterRise] > 1.9 && byDistance.zoom[closest] < 1.05);
      const slowXs = Video.timeline(long, 100, false, [], null, { ...span, speed: 70 / 3.6 });
      const sc = slowXs.findIndex((x) => x >= span.xc), poiSpeedKmh = (slowXs[sc + 1] - slowXs[sc]) * 30 * 3.6;
      expect("intérêt : à 360 km/h, ~ 70 km/h entre les bornes", poiSpeedKmh > 66 && poiSpeedKmh < 72, poiSpeedKmh);
      expect("intérêt : réglages par défaut (sans ralentir, × 1)", doc.querySelector("#interet-vitesse-valeur").textContent === "sans ralentir"
        && doc.querySelector("#interet-zoom-valeur").textContent === "× 1");
      expect("intérêt : sans objet relevé, liste des cibles grisée et invitation à en relever un",
        doc.querySelector("#interet-cible").disabled && !doc.querySelector("#interet-aucun").hidden);
      let farZone = "";
      try { Video.poiSpan(long, { ...poiTest, start: [target[0] + 0.01, target[1]], end: null }); } catch (error) { farZone = error.message; }
      expect("intérêt : zone tracée loin du parcours refusée avec un message", /début de la zone .* du parcours/.test(farZone), farZone);
      const zoned = Video.poiSpan(long, { ...poiTest, start: long.at(400), end: long.at(800) });
      expect("intérêt : zone tracée ramenée sur le parcours (400 → 800 m)", Math.abs(zoned.x0 - 400) < 2 && Math.abs(zoned.x1 - 800) < 2);
      // Interface : objet relevé injecté (cible), liste remplie ; zone tracée par deux clics sur la mini-carte, portion
      // du parcours en violet ; clic sur le trait : zone retirée
      w.mesures.app.load_releve(JSON.stringify({ named: 1, points: [[target[0], target[1], { id: 1, nom: "A", releve: { Nom: "Église" },
        z_ngf: 260, nb_visees: 2, incert_m: 0.4 }, {}]] }));
      w.mesures.refresh();
      const cible = doc.querySelector("#interet-cible");
      log(`liste des cibles : ${[...cible.options].map((o) => o.textContent).join(" ; ")} ; grisée : ${cible.disabled}`);
      expect("intérêt : objet relevé proposé comme cible", cible.options.length === 1 && /n° 1 · Église/.test(cible.options[0].textContent) && !cible.disabled
        && doc.querySelector("#interet-aucun").hidden);
      doc.querySelector("#video-interet").checked = true;
      doc.querySelector("#video-interet").dispatchEvent(new w.Event("change"));
      const m = w.mesures.map, click = (ll) => m.fire("click", { lngLat: new w.maplibregl.LngLat(...ll), point: m.project(ll), originalEvent: new w.MouseEvent("click") });
      m.fitBounds([long.at(300), long.at(900)].reduce((b, p) => b.extend(p), new w.maplibregl.LngLatBounds()), { animate: false, padding: 40 });
      doc.querySelector('#parcours .sur-carte[data-cote="poiZone"]').click();
      click(long.at(400));
      click(long.at(800));
      await new Promise((resolve) => m.once("idle", resolve));
      await sleep(300);
      const zoneData = m.getSource("zone-interet")?.serialize().data, sectionData = m.getSource("zone-interet-parcours")?.serialize().data;
      const sectionLength = sectionData?.features?.[0]?.geometry.coordinates.length || 0;
      log(`zone tracée : ${zoneData?.features?.length || 0} trait, portion du parcours : ${sectionLength} points`);
      expect("intérêt : zone tracée et portion du parcours en violet (400 → 800 m)", zoneData?.features?.length === 1 && sectionLength > 150);
      const [z0, z1] = [long.at(400), long.at(800)];
      click([(z0[0] + z1[0]) / 2, (z0[1] + z1[1]) / 2]);  // au milieu du trait (droit ; la route peut s'en écarter)
      await sleep(300);
      await new Promise((resolve) => (m.isStyleLoaded() ? resolve() : m.once("idle", resolve)));
      expect("intérêt : clic sur le trait, zone retirée", !m.getSource("zone-interet").serialize().data.features.length);
      const sub = longPhotos.filter((_, i) => i % 8 === 0 || i === longPhotos.length - 1);
      const tv = await Video.mp4(sub, 720,
        (done, total) => { if (done % 60 === 0) log(`titre et compteur : image ${done} / ${total}`); }, null,
        { counter: true, title: { text: "D115D PR 1+146 → PR 0+0", sub: "Photos du 10/07/2025" }, junctions: jn, rolls: [rollAt],
          poi: { ...poiTest, roll: false, z: 240, zoom: 1.5, ground: { target: 240, photos: sub.map(() => 240) } } });
      const subPath = Video.trajectory(sub), subXs = Video.timeline(subPath, 200, false, [], null, { ...Video.poiSpan(subPath, poiTest), speed: 70 / 3.6 });
      const poiFrame = subXs.findIndex((x) => x >= Video.poiSpan(subPath, poiTest).xc);
      const subRolls = Video.rolls(Video.trajectory(sub), Video.timeline(Video.trajectory(sub), 200, false), [rollAt]);
      const rollFrame = subRolls.findIndex((v) => v >= 120);
      const subLooks = Video.pans(Video.trajectory(sub), Video.timeline(Video.trajectory(sub), 200, false), { junctions: jn });
      const lookFrame = subLooks.reduce((best, v, i) => (Math.abs(v) > Math.abs(subLooks[best]) ? i : best), 0);
      log(`regard le plus marqué de la vidéo d'essai : ${subLooks[lookFrame].toFixed(0)}° à l'image ${lookFrame}`);
      const tvv = Object.assign(document.createElement("video"), { muted: true, src: URL.createObjectURL(tv) });
      await new Promise((resolve) => { tvv.onloadedmetadata = resolve; });
      const shot = Object.assign(document.createElement("canvas"), { width: 960, height: 540 }), sctx = shot.getContext("2d");
      for (const [name, t] of [["titre", 1], ["compteur", tvv.duration / 2], ["regard", (lookFrame + 0.5) / 30], ["tonneau", (rollFrame + 0.5) / 30], ["interet", (poiFrame + 0.5) / 30]]) {
        tvv.currentTime = t;
        await new Promise((resolve) => { tvv.onseeked = resolve; });
        sctx.drawImage(tvv, 0, 0, 960, 540);
        await log(`IMAGE ${name} ` + shot.toDataURL("image/jpeg", 0.85));
      }
      type(end, "1");
      endDistance.value = "0";
      await sleep(1500);
    }
    if (!only) {
      // Préparer : photos cherchées sans la visionneuse
      const before = w.mesures.psv.getPictureMetadata?.()?.id;
      button.click();
      await until(() => /Enregistrer/.test(button.textContent) || /impossible/.test(status()), 120000, "vidéo préparée");
      const plan = w.mesures.videoPlan;
      const photos = plan?.photos || [];
      const gaps = photos.slice(1).map((p, i) => dist(p.coords, photos[i].coords)).sort((a, b) => a - b);
      log(`préparée : ${photos.length} photos, écart médian ${gaps[gaps.length >> 1]?.toFixed(1)} m, ${plan?.switches} changement(s) ; ${status()}`);
      expect("préparée sans changer la photo de la visionneuse", w.mesures.psv.getPictureMetadata?.()?.id === before);
      expect("toutes les photos du parcours (une tous les 5 m)", photos.length >= 25 && gaps[gaps.length >> 1] < 6, `${photos.length}, ${gaps[gaps.length >> 1]}`);
      expect("une seule séquence, sans avertissement", plan?.switches === 0 && !/⚠/.test(doc.querySelector("#video-info").textContent));
      expect("tuiles HD connues", photos.every((p) => p.tiles?.base && p.tiles.cols === 16));
      select = doc.querySelector("#video-vitesse");
      select.value = "180";
      doc.querySelector("#video-photos").value = "2";
      select.dispatchEvent(new w.Event("change"));
      const info = doc.querySelector("#video-info").textContent;
      log("vidéo : " + info);
      expect("vidéo : photos retenues, écart, durée et photos/s affichés", /^\d+ photos \(une tous les 1\d m\) · \d+ s · [\d.]+ photos\/s$/.test(info), info);
      const labels = [...doc.querySelector("#video-photos").options].map((o) => o.textContent);
      expect("écart de chaque choix affiché (1/2 : une tous les 10 m)", labels[1] === "Photos 1/2 · une tous les 10 m", labels[1]);
      const chosen = photos.filter((_, i) => i % 2 === 0 || i === photos.length - 1);
    
      const t0 = performance.now();
      let last = 0;
      const blob = await Video.mp4(chosen, Number(select.value), (done, total) => {
        if (done - last >= 30 || done === total) { last = done; log(`image ${done} / ${total} (${((performance.now() - t0) / 1000).toFixed(0)} s)`); }
      });
      log(`vidéo : ${(blob.size / 1e6).toFixed(1)} Mo en ${((performance.now() - t0) / 1000).toFixed(0)} s`);
      const head = new Uint8Array(await blob.slice(0, 12).arrayBuffer());
      expect("MP4 : boîte ftyp", String.fromCharCode(...head.subarray(4, 8)) === "ftyp");
      // Relecture : taille, durée attendue (longueur à 180 km/h + 2 s d'arrêt), une image par seconde dans le journal
      const video = Object.assign(document.createElement("video"), { muted: true, src: URL.createObjectURL(blob) });
      await new Promise((resolve, reject) => { video.onloadedmetadata = resolve; video.onerror = () => reject(new Error("vidéo illisible")); });
      const length = Video.trajectory(chosen).length;
      log(`relue : ${video.videoWidth} × ${video.videoHeight}, ${video.duration.toFixed(2)} s pour ${length.toFixed(0)} m`);
      expect("relue en 1920 × 1080 (ou 1280 × 720)", (video.videoWidth === 1920 && video.videoHeight === 1080) || (video.videoWidth === 1280 && video.videoHeight === 720));
      const expected = length / (180 / 3.6) + 2 * Video.HOLD;
      expect("durée attendue (± 0,5 s)", Math.abs(video.duration - expected) < 0.5, `${video.duration} / ${expected}`);
      canvas = Object.assign(document.createElement("canvas"), { width: 960, height: Math.round(960 * video.videoHeight / video.videoWidth) });
      ctx = canvas.getContext("2d");
      let dark = 0;
      for (let t = 0.5; t < video.duration; t += location.hash.includes("toutes") ? 1 / 30 : 1) {
        video.currentTime = t;
        await new Promise((resolve) => { video.onseeked = resolve; });
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const px = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let sum = 0;
        for (let i = 0; i < px.length; i += 4 * 97) sum += px[i] + px[i + 1] + px[i + 2];
        if (sum / (px.length / (4 * 97)) / 3 < 20) dark++;
        await log(`IMAGE video-${t.toFixed(2).padStart(6, "0")} ` + canvas.toDataURL("image/jpeg", 0.8));
      }
      expect("pas d'image noire (tuiles manquantes)", dark === 0, String(dark));
      // Flou cinétique : même vidéo, netteté du bas de l'image (chaussée qui défile) plus faible au même instant
      const t1 = performance.now();
      const blurred = await Video.mp4(chosen, Number(select.value), () => {}, null, { blur: true });
      log(`flou cinétique : ${(blurred.size / 1e6).toFixed(1)} Mo en ${((performance.now() - t1) / 1000).toFixed(0)} s`);
      const sharpness = async (b, name) => {
        const v2 = Object.assign(document.createElement("video"), { muted: true, src: URL.createObjectURL(b) });
        await new Promise((resolve) => { v2.onloadedmetadata = resolve; });
        v2.currentTime = 2.5;
        await new Promise((resolve) => { v2.onseeked = resolve; });
        ctx.drawImage(v2, 0, 0, canvas.width, canvas.height);
        await log(`IMAGE ${name} ` + canvas.toDataURL("image/jpeg", 0.85));
        const h0 = Math.round(canvas.height * 0.6), px = ctx.getImageData(0, h0, canvas.width, canvas.height - h0).data;
        let e = 0;
        for (let i = 4; i < px.length; i += 4) e += Math.abs(px[i] - px[i - 4]);
        return e / (px.length / 4);
      };
      const [sharp, soft] = [await sharpness(blob, "net"), await sharpness(blurred, "flou")];
      log(`netteté du bas de l'image : ${sharp.toFixed(2)} sans flou, ${soft.toFixed(2)} avec`);
      expect("flou cinétique : bas de l'image moins net", soft < sharp * 0.9, `${soft} / ${sharp}`);
      expect("« Flou cinétique » proposé, décoché par défaut", doc.querySelector("#video-flou") && !doc.querySelector("#video-flou").checked);
      // « 🎬 Enregistrer la vidéo » : boîte d'enregistrement simulée, avancement dans la ligne d'état, fichier écrit
      let written = null, closed = false;
      w.showSaveFilePicker = async (o) => ({ name: o.suggestedName, createWritable: async () => ({ write: async (b) => { written = b; }, close: async () => { closed = true; } }) });
      doc.querySelector("#video-photos").value = "4";
      button.click();
      await until(() => !doc.querySelector("#parcours-video-arret").hidden, 10000, "calcul lancé (« ■ Arrêter » affiché)");
      await sleep(3000);
      expect("avancement dans la ligne d'état", /Calcul de la vidéo en cours : image [\u2007\d]{5} \/ [\u2007\d]{5} \([\u2007\d]{3} %\)$/.test(status()), status());
      const statut = doc.querySelector("#statut");
      const bar = parseFloat(statut.style.getPropertyValue("--avancement"));
      log(`barre d'avancement : ${bar} % ; fond ${w.getComputedStyle(statut).backgroundImage.slice(0, 80)}`);
      expect("ligne d'état remplie d'orange selon l'avancement", statut.classList.contains("avancement") && bar > 0 && bar < 100
        && /linear-gradient/.test(w.getComputedStyle(statut).backgroundImage), `${bar}`);
      await until(() => closed || /impossible/.test(status()), 300000, "fichier écrit");
      log("après : " + status());
      expect("barre retirée à la fin", !doc.querySelector("#statut").classList.contains("avancement"));
      expect("bouton : fichier MP4 écrit", closed && written?.size > 100000, String(written?.size));
      expect("nom du fichier rappelé à la fin", /Vidéo enregistrée dans « parcours D115D .+ 180 km-h\.mp4 »/.test(status()), status());
      if (location.hash.includes("fichier")) {
        const data = await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
        await log("FICHIER parcours.mp4 " + data);
      }
    }
    if (!only || only === "exposition") {
      // Carrefour RD18 / D115D, sans filtre de date : la séquence de mai bifurque sur une de juillet, signalé avant la vidéo
      const since = doc.querySelector("#depuis");
      since.value = "";
      since.dispatchEvent(new w.Event("change"));
      await sleep(1000);
      const pick = async (which, lonlat) => {
        dialog.querySelector(`.sur-carte[data-cote="${which}"]`).click();
        const m = w.mesures.map;
        m.fire("click", { lngLat: new w.maplibregl.LngLat(...lonlat), point: m.project(lonlat), originalEvent: new w.MouseEvent("click") });
        await until(() => (which === "start" ? pr : end).value, 30000, `PR du point ${which}`);
      };
      const B = [4.849261606, 47.075125126];
      for (const input of [route, pr, end]) type(input, "");
      await pick("start", [4.849496011, 47.075705494]);
      await pick("end", B);
      // Pointe des épingles sur le point cliqué (bug du 31/10 : l'arrivée tombait 42 px plus bas, sous le départ)
      for (const [css, ll] of [["depart", [4.849496011, 47.075705494]], ["arrivee", B]]) {
        const m = w.mesures.map, r = doc.querySelector(`.repere-requete.${css}`).getBoundingClientRect();
        const c = m.getCanvas().getBoundingClientRect(), p = m.project(ll);
        const gap = Math.hypot(r.left + r.width / 2 - c.left - p.x, r.bottom - c.top - p.y);
        expect(`épingle « ${css} » : pointe sur le point cliqué (moins de 2 px)`, gap < 2, gap.toFixed(1));
      }
      expect("départ ou arrivée changés : vidéo à préparer de nouveau", /Préparer/.test(button.textContent) && !button.disabled);
      button.click();
      await until(() => /Enregistrer/.test(button.textContent) || /impossible/.test(status()), 120000, "vidéo du carrefour préparée");
      const cross = w.mesures.videoPlan;
      const lastPhoto = cross?.photos?.[cross.photos.length - 1];
      log(`carrefour : ${cross?.photos?.length} photos, ${cross?.switches} changement(s), dernière à ${lastPhoto ? dist(lastPhoto.coords, B).toFixed(0) : "?"} m ; ${status()} | ${doc.querySelector("#video-info").textContent}`);
      expect("carrefour : changement de séquence trouvé", cross?.switches >= 1);
      expect("carrefour : signalé dans la ligne d'état (en orange) et sous les listes", /séquences/.test(status())
        && doc.querySelector("#statut").classList.contains("avertissement") && /⚠/.test(doc.querySelector("#video-info").textContent));
      expect("carrefour : arrivée atteinte (moins de 10 m)", lastPhoto && dist(lastPhoto.coords, B) < 10);
      // Exposition accordée au changement de séquence : juillet 1,5 fois plus clair que mai sur le tour d'horizon (1,58 au
      // même endroit dans le même sens) : gain de la première photo de juillet ~ 1 / 1,5, puis retour vers 1 en 100 m
      const trajet = Video.trajectory(cross.photos);
      const change = trajet.list.findIndex((p, i) => i && p.collection !== trajet.list[i - 1].collection);
      const gains = (await Video.exposures(trajet)).map((g) => (g[0] + g[1] + g[2]) / 3);
      log(`exposition au carrefour : gains ${gains.map((g) => g.toFixed(2)).join(" ")} (changement à la photo ${change})`);
      expect("exposition : séquence de départ inchangée", gains.slice(0, change).every((g) => g === 1));
      expect("exposition : juillet ramené sur mai au changement (gain 0,55 à 0,75)", gains[change] > 0.55 && gains[change] < 0.75, gains[change]);
      // Panoramique au changement de séquence : tour complet en 0,7 s centré sur le fondu, image en plein tour
    const flatXs = Video.timeline(trajet, 25, false), spin = Video.pans(trajet, flatXs, { whip: true });
    const spinMax = Math.max(...spin.map(Math.abs)), mid = spin.findIndex((v) => Math.abs(v) >= 180);
    log(`panoramique : ${spin.filter((v) => v).length} images, jusqu'à ${spinMax.toFixed(0)}°, demi-tour à l'image ${mid}`);
    expect("panoramique : tour complet (360°) en 0,7 s environ", spinMax > 350 && spin.filter((v) => v).length <= 22);
    const whipVideo = await Video.mp4(cross.photos, 90, () => {}, null, { whip: true });
    const wv = Object.assign(document.createElement("video"), { muted: true, src: URL.createObjectURL(whipVideo) });
    await new Promise((resolve) => { wv.onloadedmetadata = resolve; });
    for (const [name, f] of [["avant-tour", mid - 8], ["tour", mid], ["apres-tour", mid + 8]]) {
      wv.currentTime = (f + 0.5) / 30;
      await new Promise((resolve) => { wv.onseeked = resolve; });
      ctx.drawImage(wv, 0, 0, canvas.width, canvas.height);
      await log(`IMAGE ${name} ` + canvas.toDataURL("image/jpeg", 0.85));
    }
    expect("exposition : retour progressif vers sa propre exposition", gains.slice(change + 1).every((g, i) => g >= gains[change + i] - 1e-9));
    }
    log(failures ? `ERREUR ${failures} contrôle(s) sur ${checks} en échec` : `contrôles : ${checks} réussis`);
    log(failures ? "ERREUR" : "FIN");
  } catch (error) {
    log("ERREUR " + error + " " + (error.stack || ""));
  }
})();
