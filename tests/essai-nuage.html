<!-- « Analyse fine » de la fenêtre du profil (src/nuage.js) : nuage LiDAR HD lu sur le travers de la photo, bord de
     chaussée et séparateur de chaussée. Photos des routes à chaussées séparées de essai-bords.html : A38, RD903bis,
     RD700 (glissières dos à dos). Lancer comme tests/navigateur.html ; chaque profil part dans le journal en PNG. -->
<script>try { localStorage.clear(); } catch {}</script>
<!-- assez haute pour que la fenêtre du profil tienne dans la visionneuse (sinon elle défile : ses boutons bougent) -->
<iframe id="f" src="../index.html" style="width:1400px;height:1300px"></iframe>
<script>
const log = (t) => fetch("/journal", { method: "POST", body: String(t) }).catch(() => {});
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(test, ms, what) { const t0 = Date.now(); while (!test()) { if (Date.now() - t0 > ms) throw new Error("délai dépassé : " + what); await sleep(250); } }
let failures = 0, checks = 0;
const expect = (what, ok, detail = "") => { checks++; if (!ok) { failures++; log("ÉCHEC " + what + (detail ? " : " + detail : "")); } };
// photo, milieu attendu du séparateur à gauche (m, d'après la photo et le relief), bord d'enrobé droit attendu (décision du 05/11/2026 : la chaussée est la bande d'enrobé, BAU comprise)
// #photos=id,id : ces photos seulement, sans contrôle de position (essai d'une autre route)
const PHOTOS = location.hash.startsWith("#photos=") ? location.hash.slice(8).split(",").map((id) => [id, id.slice(0, 8), null, null]) : null;
const CASES = PHOTOS || [["61dd94c4-e5d1-4eb0-9762-73a72f18b5cb", "A38", 7.2, 4.8], ["1640bc3f-e948-4239-a4c1-548dd748a16d", "RD903bis", 3.4, 3.3],
  ["067e83ca-a3d8-4f2a-bbe6-0c10df70fc96", "RD700 (glissières dos à dos)", 6.8, 1.9]];
(async () => {
  const w = document.getElementById("f").contentWindow;
  try {
    await until(() => w.mesures?.app && w.mesures.map?.loaded?.(), 180000, "Pyodide");
    const doc = w.document, app = w.mesures.app;
    doc.querySelector("#reglages-defaut")?.close();
    for (const [id, where, sepMid, rightEdge] of CASES) {
      const f = (await (await fetch("https://panoramax.ign.fr/api/search?ids=" + id)).json()).features[0];
      w.mesures.openPhoto(f);
      await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === id, 30000, "photo");
      await until(() => !doc.querySelector("#bords").disabled, 20000, "bouton « Profils »");
      doc.querySelector("#bords").click();
      await until(() => JSON.parse(app.fall_json() || "null")?.profile, 40000, "profil");
      doc.querySelector("#profil").click();
      await sleep(800);
      const dialog = doc.querySelector("#fenetre-profil"), button = doc.querySelector("#profil-nuage");
      expect(`${where} : « Analyse fine » active, « Végétation » grisée avant elle`, !button.disabled && doc.querySelector("#profil-vegetation").disabled);
      button.click();
      // en cours de lecture : barre d'avancement affichée, et remplie en partie
      const bar = doc.querySelector("#profil-nuage-barre");
      await until(() => (!bar.hidden && bar.value > 0.1) || /points du sol|impossible/.test(doc.querySelector("#profil-nuage-etat").textContent), 30000, "avancement");
      log(`  en cours : barre ${bar.hidden ? "masquée" : bar.hasAttribute("value") ? Math.round(100 * bar.value) + " %" : "animée"} · ${doc.querySelector("#profil-nuage-etat").textContent}`);
      await until(() => /points du sol|impossible/.test(doc.querySelector("#profil-nuage-etat").textContent), 120000, "analyse fine");
      const state = doc.querySelector("#profil-nuage-etat").textContent;
      const texts = [...dialog.querySelectorAll("svg text")].map((e) => e.textContent);
      const legend = dialog.querySelector(".legende").textContent;
      const sep = /milieu du séparateur[^.]*/.exec(legend)?.[0] || "";
      const right = Number((/droit\s:\s(\d+,\d+) m/.exec(legend) || [])[1]?.replace(",", "."));
      log(`${where} ${id.slice(0, 8)} : ${state} · ${sep} · bords : ${(/bords de chaussée[^.]*/.exec(legend) || [""])[0]}`);
      log(`  eau : ${(/Bleu[^.]*\./.exec(legend) || ["aucune"])[0]} · BD TOPO : ${JSON.stringify(JSON.parse(app.fall_json()).profile?.eau)}`);
      // Légende repliée à l'ouverture, dépliée pour le reste des contrôles
      const unfold = doc.querySelector("#profil-legende");
      expect(`${where} : légende repliée à l'ouverture`, w.getComputedStyle(dialog.querySelector(".legende")).display === "none");
      unfold.click();
      // Plateforme limitée aux bords d'enrobé, dans le graphique et ses repères
      const [edgeL, edgeR] = [/gauche\s:\s([\d,]+) m, enrobé/, /droit\s:\s([\d,]+) m, enrobé/].map((re) => Number((re.exec(legend) || [])[1]?.replace(",", ".")));
      const platformText = [...dialog.querySelectorAll("svg text")].map((e) => e.textContent).find((t) => /^plateforme /.test(t)) || "";
      log(`  ${platformText} · ${[...dialog.querySelectorAll("svg text")].map((e) => e.textContent).find((t) => /^(dévers|toit|plateforme$)/.test(t)) || "pas de dévers"} · ${[...dialog.querySelectorAll(".legende li")][0]?.textContent}`);
      if (edgeL && edgeR) expect(`${where} : plateforme jusqu'aux bords d'enrobé`, Math.abs(Number(platformText.replace(/[^\d,]/g, "").replace(",", ".")) - edgeL - edgeR) <= 0.11, `${platformText} / ${edgeL} + ${edgeR}`);
      // Rangée du bas : cases et boutons sans chevauchement, l'avancement et le bilan sur leur propre ligne
      const boxes = [...dialog.querySelectorAll("form > *")].filter((e) => e.offsetParent).map((e) => e.getBoundingClientRect());
      const overlap = boxes.some((a, i) => boxes.some((b, j) => i < j && a.left < b.right - 1 && b.left < a.right - 1 && a.top < b.bottom - 1 && b.top < a.bottom - 1));
      const info = dialog.querySelector(".nuage-etat").getBoundingClientRect(), form = dialog.querySelector("form").getBoundingClientRect();
      log(`  rangée : ${boxes.map((b) => `${Math.round(b.left)}-${Math.round(b.right)}@${Math.round(b.top)}`).join(" ")} · bilan ${Math.round(info.top)}-${Math.round(info.bottom)}, boutons dès ${Math.round(form.top)}`);
      expect(`${where} : cases et boutons sans chevauchement, bilan au-dessus`, !overlap && info.bottom <= form.top + 1);
      // Case « Végétation » : décochée, ni ligne verte ni herbe ; recochée, de retour
      const plants = doc.querySelector("#profil-vegetation"), drawn = () => dialog.querySelectorAll("svg .vegetation, svg .herbe").length;
      const before = drawn();
      plants.checked = false; plants.dispatchEvent(new w.Event("change"));
      const hidden = drawn();
      plants.checked = true; plants.dispatchEvent(new w.Event("change"));
      expect(`${where} : case « Végétation »`, before > 0 && hidden === 0 && drawn() === before, `${before} → ${hidden} → ${drawn()}`);
      // les cases et boutons ne bougent pas quand on actionne les cases (interrupteurs, profil redessiné)
      const rows = () => [...dialog.querySelectorAll("form > *")].filter((e) => e.offsetParent).map((e) => { const r = e.getBoundingClientRect(); return `${Math.round(r.left)},${Math.round(r.top)}`; }).join(" ");
      await sleep(300);  // fenêtre replacée après le dépliage de la légende
      const rest = rows(), scale = doc.querySelector("#profil-echelle");  // relevés une fois la fenêtre replacée
      plants.checked = false; plants.dispatchEvent(new w.Event("change"));
      await sleep(200);
      const off = rows();
      scale.checked = !scale.checked; scale.dispatchEvent(new w.Event("change"));
      await sleep(200);
      const scaled = rows();
      scale.checked = !scale.checked; scale.dispatchEvent(new w.Event("change"));
      plants.checked = true; plants.dispatchEvent(new w.Event("change"));
      log(`  cases actionnées : ${rest} | végétation éteinte ${off} | échelle ${scaled}`);
      const still = (a, b) => a.split(/[ ,]/).every((v, k) => Math.abs(v - b.split(/[ ,]/)[k]) <= 2);  // à 2 px près (arrondis)
      expect(`${where} : cases et boutons immobiles quand on actionne les cases`, still(rest, off) && still(rest, scaled), `${rest} / ${off} / ${scaled}`);
      log(`  en long : ${dialog.querySelector("svg.profil-long text")?.textContent || "absent"} · ${(/Pente en long[^·]*/.exec(doc.querySelector("#chute").textContent) || ["pas dans l'encadré"])[0]}`);
      if (sepMid === null) {
        log(`  ${(/Largeur d'enrobé[^.]*/.exec(legend) || ["pas de largeur d'enrobé"])[0]} · origine ${JSON.parse(app.fall_json()).profile?.origine}`);
        const blob = await w.eval("Profil").png(dialog.querySelector("svg"), dialog.querySelector("h2").textContent, dialog.querySelector(".legende"), dialog.querySelector("svg.profil-long"));
        await log(`IMAGE ${id.slice(0, 8)} ` + await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }));
        dialog.close();
        continue;
      }
      expect(`${where} : séparateur du nuage LiDAR`, texts.includes("séparateur de chaussée")
        && dialog.querySelector(".legende").textContent.includes("trouvé dans le nuage LiDAR"), sep);  // d'où il vient : en légende
      expect(`${where} : lignes blanches et bords de chaussée dessinés`, dialog.querySelector("svg .ligne-blanche") && dialog.querySelector("svg .bord-chaussee"));
      expect(`${where} : bord d'enrobé droit (${rightEdge} m attendu)`, /droit\s:\s[\d,]+ m, enrobé/.test(legend) && Math.abs(right - rightEdge) <= 0.5, String(right));
      log(`  ${(/Largeur d'enrobé[^.]*\.?\d?/.exec(legend) || ["pas de largeur d'enrobé"])[0]}`);
      expect(`${where} : bouton grisé une fois l'analyse faite`, button.disabled);
      const blob = await w.eval("Profil").png(dialog.querySelector("svg"), dialog.querySelector("h2").textContent, dialog.querySelector(".legende"));
      await log(`IMAGE ${id.slice(0, 8)} ` + await new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }));
      dialog.close();
    }
    log(failures ? `ERREUR ${failures} contrôle(s) sur ${checks} en échec` : `contrôles : ${checks} réussis`);
    log(failures ? "ERREUR" : "FIN");
  } catch (e) { log("ERREUR " + e); }
})();
</script>
