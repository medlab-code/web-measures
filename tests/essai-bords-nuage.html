     (5 travers, 2 côtés), pour tools/banc-bords.py (rejoue le calcul des bords avec des variantes de réglages, hors ligne).
     Pas de contrôle : un relevé (pistes P2 et P16 de docs/analyses/pistes-profil.md). Lots (#lot=…) : essais-1 et essais-2,

     séparées, réseau principal, secondaire, local, petites voies ; 19/11/2026). Environ 3 min par lot, réseau.
     tools/essais.sh "essai-bords-nuage#lot=essais-1" "essai-bords-nuage#lot=essais-2" "essai-bords-nuage#lot=cote-d-or-1" \
       "essai-bords-nuage#lot=cote-d-or-2", puis tools/banc-bords.py /tmp/web-measures-essais/essai-bords-nuage-lot=*.log -->

const IDS = LOTS[location.hash.replace("#lot=", "")] || [];
(async () => {
  const w = document.getElementById("f").contentWindow;
  try {
    await ready(w);
    const doc = w.document;
    doc.querySelector("#reglages-defaut")?.close();
    if (!IDS.length) log(`lot inconnu : ${location.hash} (${Object.keys(LOTS).join(", ")})`);
    for (const id of IDS) {
      const out = { id };
      try {
        const f = (await (await fetch("https://panoramax.ign.fr/api/search?ids=" + id)).json()).features[0];
        w.mesures.openPhoto(f);
        await soon(() => w.mesures.psv?.getPictureMetadata?.()?.id === f.id, 30000);
        await soon(() => !doc.querySelector("#bords").disabled || !doc.querySelector("#chute").hidden, 15000);
        if (doc.querySelector("#bords").disabled) { out.ecarte = "bouton grisé (pont ?)"; log("BORDS " + JSON.stringify(out)); continue; }
        doc.querySelector("#bords").click();
        await soon(() => !doc.querySelector("#profil").disabled || /impossible|Pas de route/.test(doc.querySelector("#chute").textContent), 90000);
        const fall = JSON.parse(w.mesures.app.fall_json()), profile = fall?.profile;
        if (!profile) { out.ecarte = (fall?.text || "pas de profil").replace(/\n/g, " "); log("BORDS " + JSON.stringify(out)); continue; }
        Object.assign(out, { route: fall.road, origine: profile.origine, source: profile.source, axe: profile.axe });
        out.relief = Object.fromEntries(profile.profils.filter((e) => e.le_long === 0).map((e) => [e.cote,
          { bord: e.bord, quoi: e.relief ? "relief" : e.voisins ? "voisins" : "largeur type", sep: e.separateur, autre: e.autre_axe }]));
        out.resultats = profile.resultats;
        out.texte = fall.text;
        out.profils = profile.profils.map((e) => ({ le_long: e.le_long, cote: e.cote, autre_axe: e.autre_axe, separateur: e.separateur,
          points: e.points }));
        const found = await w.eval("Nuage").analyse(profile);
        out.nuage = { bords: Object.fromEntries(Object.entries(found.bords).map(([k, b]) => [k, b && { x: Math.abs(b.x), quoi: b.comment, bordure: !!b.bordure }])),
          largeur: found.largeur, separateur: found.separateur, requetes: found.requetes };
      } catch (e) { out.erreur = String(e); }
      log("BORDS " + JSON.stringify(out));
    }
    await fin();
  } catch (e) { log("ERREUR " + e); }
})();
