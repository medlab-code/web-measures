<!-- Cache des informations géographiques (ticket #23) : réponses BD TOPO et altitudes gardées, pas
     Panoramax ; réponse redemandée servie par le cache ; réponse périmée servie quand le service refuse ;
     bouton « Vider le cache ». Lancer comme tests/navigateur.html (voir CLAUDE.md). -->
<script>try { localStorage.clear(); } catch {}</script>
<iframe id="f" src="../index.html" style="width:1400px;height:900px;border:0"></iframe>
<script src="commun.js"></script>
<script>
const { log, sleep, ready, expect, fail, fin } = Essai;
(async () => {
  const w = document.getElementById("f").contentWindow;
  try {
    await ready(w);
    const doc = w.document;
    doc.querySelector("#reglages-defaut")?.close();
    const cache = await w.caches.open("web-measures-geo");
    const f = (await (await fetch("https://api.panoramax.xyz/api/search?ids=b40045bd-1fc5-4a7a-a5bd-7b7952902a1c")).json()).features[0];
    w.mesures.openPhoto(f);
    const t1 = Date.now();
    while (!doc.querySelector("#chute")?.textContent.includes("max") && Date.now() - t1 < 40000) await sleep(250);
    await sleep(1500);
    const keys = (await cache.keys()).map((r) => r.url);
    const hosts = {};
    for (const k of keys) { const u = new URL(k); const key = u.host + u.pathname.split("/").slice(0, 2).join("/"); hosts[key] = (hosts[key] || 0) + 1; }
    log("réponses gardées : " + keys.length + " " + JSON.stringify(hosts));
    expect("réponses BD TOPO et altitudes gardées", keys.some((k) => k.includes("/wfs/")) && keys.some((k) => k.includes("/altimetrie/")));
    expect("pas de Panoramax dans le cache", !keys.some((k) => k.includes("panoramax")));
    // Même adresse redemandée : servie par le cache
    const again = await w.fetch(keys.find((k) => k.includes("/wfs/")));
    expect("réponse redemandée servie par le cache", again.headers.get("x-mis-en-cache") !== null);
    // Réponse ancienne gardée, service qui refuse : l'ancienne est servie
    const fake = "https://data.geopf.fr/wfs/ows?SERVICE=WFS&REQUEST=GetFeature&TYPENAMES=inconnue:essai";
    await cache.put(fake, new Response('{"features":[{"essai":1}]}', { headers: { "x-mis-en-cache": String(Date.now() - 200 * 86400e3), "x-vide": "0", "x-taille": "26" } }));
    const old = await (await w.fetch(fake)).text();
    log("réponse périmée, service en refus : " + old);
    expect("réponse ancienne servie quand le service refuse", old.includes("essai"));
    // Bouton : taille, puis vidage
    doc.querySelector('#outils [data-panneau="reseau"]').click();  // section Services : taille du cache
    await sleep(1500);
    log("bouton : " + doc.querySelector("#vider-cache").textContent);
    expect("taille affichée", /\(\d+(,\d)? Mo\)/.test(doc.querySelector("#vider-cache").textContent));
    doc.querySelector("#vider-cache").click();
    await sleep(1500);
    log("après vidage : " + doc.querySelector("#vider-cache").textContent + " · " + (await cache.keys()).length + " réponse(s)");
    expect("cache vidé", (await cache.keys()).length === 0);
    expect("« Vider le cache » grisé, cache vide", doc.querySelector("#vider-cache").disabled);
  } catch (e) { fail("exception : " + (e.stack || e)); }
  await fin();
})();
</script>
