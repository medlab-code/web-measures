<!-- Cache des informations géographiques (ticket #23) : réponses BD TOPO et altitudes gardées, pas
     Panoramax ; réponse redemandée servie par le cache ; réponse périmée servie quand le service refuse ;
     bouton « Vider le cache ». Lancer comme tests/navigateur.html (voir CLAUDE.md). -->
<script>try { localStorage.clear(); indexedDB.deleteDatabase("web-measures"); } catch {}</script>
<iframe id="f" src="../index.html" style="width:1400px;height:900px;border:0"></iframe>
<script src="commun.js"></script>
<script>
const { log, sleep, until, soon, ready, expect, fail, fin } = Essai;
(async () => {
  const w = document.getElementById("f").contentWindow;
  try {
    await ready(w);
    const doc = w.document;
    doc.querySelector("#reglages-defaut")?.close();
    const cache = await w.caches.open("web-measures-geo");
    const f = (await (await fetch("https://api.panoramax.xyz/api/search?ids=b40045bd-1fc5-4a7a-a5bd-7b7952902a1c")).json()).features[0];
    w.mesures.openPhoto(f);
    await until(() => doc.querySelector("#chute")?.textContent.includes("max"), 40000, "chute");
    let keys = [];  // réponses mises en cache après coup : attendre les deux services
    for (const t1 = Date.now(); Date.now() - t1 < 5000; await sleep(200)) {
      keys = (await cache.keys()).map((r) => r.url);
      if (keys.some((k) => k.includes("/wfs/")) && keys.some((k) => k.includes("/altimetrie/"))) break;
    }
    const hosts = {};
    for (const k of keys) { const u = new URL(k); const key = u.host + u.pathname.split("/").slice(0, 2).join("/"); hosts[key] = (hosts[key] || 0) + 1; }
    log("réponses gardées : " + keys.length + " " + JSON.stringify(hosts));
    expect("réponses BD TOPO et altitudes gardées", keys.some((k) => k.includes("/wfs/")) && keys.some((k) => k.includes("/altimetrie/")));
    expect("pas de Panoramax dans le cache", !keys.some((k) => k.includes("panoramax")));
    // Même adresse redemandée : servie par le cache
    const again = await w.fetch(keys.find((k) => k.includes("/wfs/")));
    expect("réponse redemandée servie par le cache", again.headers.get("x-mis-en-cache") !== null);
    // Réponse ancienne gardée, service qui refuse : l'ancienne est servie
    const fake = "https://data.geopf.fr/wfs/ows?SERVICE=WFS&REQUEST=GetFeature&TYPENAMES=inconnue:essai";
    await cache.put(fake, new Response('{"features":[{"essai":1}]}', { headers: { "x-mis-en-cache": String(Date.now() - 200 * 86400e3), "x-vide": "0", "x-taille": "26" } }));
    const old = await (await w.fetch(fake)).text();
    log("réponse périmée, service en refus : " + old);
    expect("réponse ancienne servie quand le service refuse", old.includes("essai"));
    // Réponse illisible gardée (page de statistiques de la Géoplateforme, 20/11/2026) : jetée, redemandée au service
    const wfs = keys.find((k) => k.includes("/wfs/"));
    await cache.put(wfs, new Response("# HELP jmx_config_reload_success_total", { headers: { "x-mis-en-cache": String(Date.now()), "x-vide": "0", "x-taille": "38" } }));
    const fresh = await (await w.fetch(wfs)).text();
    let json = false;
    try { json = Boolean(JSON.parse(fresh)); } catch { /* illisible */ }
    expect("réponse illisible du cache jetée, redemandée au service", json, fresh.slice(0, 60));
    expect("réponse illisible non gardée", !/^# HELP/.test(await (await cache.match(wfs))?.text() ?? ""));
    // Bouton : taille, puis vidage
    doc.querySelector('#outils [data-panneau="reseau"]').click();  // section Services : taille du cache
    await soon(() => /\(\d+(,\d)? Mo\)/.test(doc.querySelector("#vider-cache").textContent));
    log("bouton : " + doc.querySelector("#vider-cache").textContent);
    expect("taille affichée", /\(\d+(,\d)? Mo\)/.test(doc.querySelector("#vider-cache").textContent));
    doc.querySelector("#vider-cache").click();
    await soon(() => doc.querySelector("#vider-cache").disabled);
    log("après vidage : " + doc.querySelector("#vider-cache").textContent + " · " + (await cache.keys()).length + " réponse(s)");
    expect("cache vidé", (await cache.keys()).length === 0);
    expect("« Vider le cache » grisé, cache vide", doc.querySelector("#vider-cache").disabled);
    // Cache sans réponse (stockage du navigateur bloqué) : la requête part au service après 3 s, sans attendre sans fin
    const match = w.Cache.prototype.match;
    w.Cache.prototype.match = () => new Promise(() => {});
    const t0 = Date.now();
    const direct = await Promise.race([w.fetch(keys.find((k) => k.includes("/wfs/"))).then((r) => r.status),
      new Promise((resolve) => setTimeout(() => resolve("sans réponse"), 40000))]);
    w.Cache.prototype.match = match;
    log(`cache sans réponse : ${direct} en ${((Date.now() - t0) / 1000).toFixed(1)} s`);
    expect("cache sans réponse : requête directe au service", direct === 200 && Date.now() - t0 >= 3000, direct);
    // Un seul retard : le cache reste (réponse directe gardée, resservie ensuite)
    const url = keys.find((k) => k.includes("/wfs/"));
    let served = false;  // réponse directe gardée en arrière-plan : quelques essais
    for (let i = 0; i < 20 && !served; i++, await sleep(250)) served = (await w.fetch(url)).headers.get("x-mis-en-cache") !== null;
    expect("un seul retard : cache gardé (réponse resservie par le cache)", served);
    // Trois retards d'affilée : cache abandonné pour la session, dit dans Services
    w.Cache.prototype.match = () => new Promise(() => {});
    for (let i = 0; i < 3; i++) await w.fetch(url);
    w.Cache.prototype.match = match;
    doc.querySelector('#outils [data-panneau="reseau"]').click();
    await soon(() => /sans réponse/.test(doc.querySelector("#vider-cache").textContent));
    log("après trois retards : " + doc.querySelector("#vider-cache").textContent);
    expect("trois retards : cache abandonné, dit dans Services", /sans réponse/.test(doc.querySelector("#vider-cache").textContent)
      && doc.querySelector("#vider-cache").disabled);
  } catch (e) { fail("exception : " + (e.stack || e)); }
  await fin();
})();
</script>
