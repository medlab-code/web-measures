<!-- Profil en travers enregistré en PDF (bouton « Enregistrer en PDF ») : la 1re feuille A4 paysage tient sur une page
     (Profil.fit), le profil en long sur la 2e (case cochée), lieu de la photo en tête ; sa page HTML part dans le journal (ligne « PAGE », base64) pour en tirer le PDF. Photo D1074 Pommard
     (#photo=id : une autre). Lancer comme tests/navigateur.html. -->
<script>try { localStorage.clear(); } catch {}</script>
<iframe id="f" src="../index.html" style="width:1400px;height:900px;border:0"></iframe>
<script src="commun.js"></script>
<script>
const { log, sleep, until, soon, ready, expect, fin } = Essai;
const ID = location.hash.startsWith("#photo=") ? location.hash.slice(7).split("#")[0] : "6d99cba2-2284-4215-a3fb-1fd390353005";
(async () => {
  const w = document.getElementById("f").contentWindow;
  try {
    await ready(w);
    const doc = w.document;
    w.addEventListener("unhandledrejection", (e) => log("rejet : " + (e.reason?.stack || e.reason)));
    doc.querySelector("#reglages-defaut")?.close();
    const f = (await (await fetch("https://panoramax.ign.fr/api/search?ids=" + ID)).json()).features[0];
    w.mesures.openPhoto(f);
    await until(() => w.mesures.psv?.getPictureMetadata?.()?.id === ID && !doc.querySelector("#bords").disabled, 30000, "photo et bords");
    doc.querySelector("#bords").click();
    await until(() => !doc.querySelector("#profil").disabled, 60000, "profils des bords");
    doc.querySelector("#profil").click();
    await until(() => doc.querySelector("#profil-pdf")?.checkVisibility?.() && !doc.querySelector("#profil-pdf").disabled, 10000, "bouton PDF");
    // Fenêtre d'impression remplacée par un cadre, sans impression : page lue après fit
    let page = null, styled = null;
    const realOpen = w.open;
    w.open = (...args) => {  // #fenetre : vraie fenêtre surgissante (Chrome lancé avec --disable-popup-blocking) ; sinon, cadre d'une A4 paysage
      if (location.hash.includes("fenetre")) {
        page = realOpen.apply(w, args);
        page.print = () => { const sol = page.document.querySelector(".profil-svg .sol"); styled = sol ? page.getComputedStyle(sol).fill : "pas de terrain"; };
        return page;
      }
      const frame = Object.assign(document.createElement("iframe"), { style: "width:1123px;height:794px;border:0" });
      document.body.append(frame);
      page = frame.contentWindow;
      // Au moment d'imprimer, les styles du site sont déjà appliqués (sinon : terrain et textes bruts dans le PDF)
      page.print = () => { const sol = page.document.querySelector(".profil-svg .sol"); styled = sol ? page.getComputedStyle(sol).fill : "pas de terrain"; };
      return page;
    };
    // Feuille de styles hors du cache, comme une fenêtre neuve après une mise à jour du site : son chargement prend du temps
    const P = w.eval("Profil"), pdfPage = P.pdfPage;
    P.pdfPage = (svg, legend, long, options) => pdfPage(svg, legend, long, { ...options, stylesheet: `${options.stylesheet}?${Date.now()}` });
    const withLong = doc.querySelector("#profil-pdf-long");
    if (!withLong.checked) withLong.click();  // 2e page : profil en long
    doc.querySelector("#profil-pdf").click();
    for (let t = Date.now(); !page?.document.querySelector(".page") && Date.now() - t < 45000;) await sleep(250);
    await soon(() => styled !== null, 15000);  // styles, polices, fit, puis impression
    const sheet = page?.document.querySelector(".page");
    if (!sheet) throw new Error("pas de feuille : " + (page ? page.document.body?.textContent.slice(0, 200) : "fenêtre non ouverte"));
    const pages = page.document.querySelectorAll(".page").length;
    const fits = sheet.scrollHeight <= sheet.clientHeight + 1 && pages === 2;
    log(`pages : ${pages} · lieu : ${page.document.querySelector(".lieu")?.textContent || "(aucun)"}`);
    log(`feuille : ${sheet.scrollHeight} / ${sheet.clientHeight} px, réglages ${page.document.documentElement.getAttribute("style") || "aucun"}`);
    const html = "<!doctype html>" + page.document.documentElement.outerHTML;
    await log("PAGE " + btoa(unescape(encodeURIComponent(html))));
    await log(`terrain à l'impression : remplissage ${styled}`);
    expect("styles appliqués au moment d'imprimer", styled === "none");
    expect("feuille tenant sur une page, et 2e page", fits);
    await fin();
  } catch (e) { log("ERREUR " + (e.stack || e)); }
})();
</script>
