<!-- Vidéo sur la D906 à travers le croisement de la D113A à Chassagne-Montrachet (4,7357 ; 46,9404), cas de
     l'utilisateur du 01/11/2026 : la séquence y quitte la D906. Départ et arrivée posés sur la carte (1,2 km au nord,
     0,7 km au sud ; #nord : dans l'autre sens) ; contrôles : préparation finie (itinéraire de la Géoplateforme, photos le
     long de son tracé), aucune question, repères sans doublon, aucune photo lue à rebours ; #rendu : vidéo très courte
     (40 photos) calculée, images non noires (tuiles trouvées) ; parcours resté sur la D906 (sauf dans son
     interruption de Beaune, de 4,7394 à 4,7428, en tronc commun). #utilisateur : parcours exact de l'utilisateur. Lancer comme
     tests/navigateur.html. -->
<script>try { localStorage.clear(); indexedDB.deleteDatabase("web-measures"); } catch {}</script>
<iframe id="f" src="../index.html" style="width:1400px;height:1000px"></iframe>
<script src="commun.js"></script>
<script>
const { log, sleep, until, soon, ready, expect, fail, fin } = Essai;
(async () => {
  const w = document.getElementById("f").contentWindow;
  try {
    await ready(w);
    const doc = w.document;
    doc.querySelector("#reglages-defaut")?.close();
    const m = w.mesures.map;
    const warn = w.console.warn.bind(w.console);
    w.console.warn = (...args) => { log("AVERT " + args.map((a) => (typeof a === "object" ? JSON.stringify(a) : String(a))).join(" ").slice(0, 400)); warn(...args); };
    m.jumpTo({ center: [4.7357, 46.9404], zoom: 15 });
    await sleep(2000);
    doc.querySelector("#onglet-parcours").click();
    const pane = doc.querySelector("#parcours");
    const button = doc.querySelector("#parcours-video");
    const status = () => doc.querySelector("#statut")?.textContent || "";
    const click = (lonlat) => m.fire("click", { lngLat: new w.maplibregl.LngLat(...lonlat), point: m.project(lonlat), originalEvent: new w.MouseEvent("click") });
    const sens = location.hash === "#nord" ? 1 : 0;  // #nord : du sud vers le nord
    const north = [4.72652, 46.94920], south = [4.73871, 46.93461];
    const [start, end] = sens ? [south, north] : [north, south], beyond = sens ? [4.73350, 46.94350] : [4.73700, 46.93800];
    // #utilisateur : départ sur la photo d8125260 (4,74355 ; 46,92570), arrivée D906 PR 75 + 645 (saisie), comme l'utilisateur
    const user = location.hash === "#utilisateur";
    pane.querySelector('.sur-carte[data-cote="start"]').click();
    const marks = () => [...doc.querySelectorAll(".repere-requete")].map((e) => e.className.replace("repere-requete ", "")).join(" ");
    click(user ? [4.743552498, 46.925697821] : start);
    await soon(() => /depart/.test(marks()) && pane.querySelector(".champ input").value, 10000);  // départ posé, route lue
    if (user) {
      doc.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));  // arrivée saisie, pas cliquée
      const [, , endPr] = pane.querySelectorAll(".champ input"), [, endDistance] = pane.querySelectorAll(".distance");
      endPr.focus();
      endPr.value = "75";
      endPr.dispatchEvent(new w.Event("input", { bubbles: true }));
      endDistance.value = "645";
      endDistance.dispatchEvent(new w.Event("input", { bubbles: true }));
    } else {
      if (!pane.querySelector('.sur-carte[data-cote="end"]').getAttribute("aria-pressed").includes("true")) pane.querySelector('.sur-carte[data-cote="end"]').click();
      click(end);
    }
    await soon(() => /arrivee/.test(marks()), 10000);
    log(`route « ${pane.querySelector(".champ input").value} »`);
    log(`départ et arrivée posés : ${marks()} ; ${status()}`);
    const t0 = Date.now();
    button.click();
    let asked = 0, lastAsk = "";
    while (!/Enregistrer/.test(button.textContent) && !/impossible/.test(status())) {
      if (Date.now() - t0 > 600000) throw new Error("délai dépassé : vidéo préparée");
      if (/quitte la/.test(status()) && status() !== lastAsk + asked) {
        asked++;
        lastAsk = status() + asked;
        log(`question ${asked} : repères ${marks()}`);
        if (asked > 4) {
          doc.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
          break;
        }
        click(user ? [4.73350, 46.94350] : beyond);
        await sleep(1500);
      }
      await sleep(500);
    }
    await until(() => /Enregistrer/.test(button.textContent) || /impossible/.test(status()), 600000, "fin de la préparation");
    const plan = w.mesures.videoPlan;
    // Écart à la D906 : sections de PR de la BD TOPO en Côte-d'Or, projection (Lieu.project)
    const Lieu = w.modules.Lieu;
    const sections = (await Lieu.features("section_de_points_de_repere", { count: 500, properties: "numero_de_route,geometrie",
      filter: "numero_de_route='D906' AND BBOX(geometrie,46.80,4.00,47.50,4.90)" })).map((f) => f.geometry.coordinates);
    const toD906 = (p) => Math.min(...sections.map((line) => Lieu.project(line, ...p).d));
    let off = 0;
    const offAt = [];
    for (const [i, p] of (plan?.photos || []).entries()) {
      const place = { d: toD906(p.coords) };
      const beaune = p.coords[0] > 4.739 && p.coords[0] < 4.743 && Math.abs(p.coords[1] - 46.9268) < 0.001;  // interruption
      if (place.d > 25 && !beaune) {
        off++;
        offAt.push(`n° ${i} ${p.coords.map((v) => v.toFixed(5)).join(",")} à ${place.d.toFixed(0)} m`);
      }
    }
    if (offAt.length) log(`hors de la D906 : ${offAt.join(" ; ")}`);
    log(`préparée en ${((Date.now() - t0) / 1000).toFixed(0)} s : ${plan?.photos?.length} photos, ${plan?.switches} changement(s), `
      + `${off} hors de la D906, ${asked} question(s), ${plan?.reversed ?? 0} à rebours ; repères ${marks()} ; ${status()}`);
    expect("vidéo préparée", plan?.photos?.length > 50, status());
    // Raccords : écart entre la dernière photo d'une séquence et la première de la suivante
    const seams = (plan?.photos || []).map((p, i, all) => (i && p.collection !== all[i - 1].collection
      ? Math.hypot((p.coords[0] - all[i - 1].coords[0]) * 76000, (p.coords[1] - all[i - 1].coords[1]) * 111320) : null)).filter((d) => d != null);
    log(`raccords : ${seams.map((d) => d.toFixed(1)).join(", ") || "aucun"} m`);
    (plan?.photos || []).forEach((p, i, all) => { if (i && p.collection !== all[i - 1].collection) log(`raccord ${all[i - 1].collection.slice(0, 8)} → ${p.collection.slice(0, 8)} : ${all[i - 1].coords.map((v) => v.toFixed(5))} → ${p.coords.map((v) => v.toFixed(5))}`); });
    // (D906 / D973, 4,6720 ; 46,9482 : la route tourne, aucune séquence n'y passe dans les deux sens : 20 m, inévitable)
    expect("raccords : photos des deux séquences à moins de 25 m", seams.every((d) => d < 25), seams.join(" "));
    // Rendu de 40 photos (#rendu) : images de la vidéo non noires (luminosité moyenne au-dessus de 30 sur 255)
    if (/rendu/.test(location.hash)) {
      const Video = w.modules.Video;
      const dir = await w.navigator.storage.getDirectory(), handle = await dir.getFileHandle("rendu.mp4", { create: true });
      const t0 = performance.now();
      await Video.mp4(plan.photos.slice(0, 40), 90, () => {}, null, { stream: await handle.createWritable(), counter: true, speedometer: true,
        title: { text: "Essai", sub: "", keep: true }, presentation: { vmax: 150 / 3.6, vmin: 30 / 3.6, turn: 12, fade: 1, stop: 3 } });
      log(`rendu avec titre et compteurs : ${((performance.now() - t0) / 1000).toFixed(1)} s`);
      const t1 = performance.now(), h2 = await dir.getFileHandle("rendu2.mp4", { create: true });
      await Video.mp4(plan.photos.slice(0, 40), 90, () => {}, null, { stream: await h2.createWritable(),
        presentation: { vmax: 150 / 3.6, vmin: 30 / 3.6, turn: 12, fade: 1, stop: 3 } });
      log(`rendu sans incrustation : ${((performance.now() - t1) / 1000).toFixed(1)} s`);
      const v = Object.assign(document.createElement("video"), { muted: true, src: URL.createObjectURL(await handle.getFile()) });
      await new Promise((resolve) => { v.onloadedmetadata = resolve; });
      const canvas = Object.assign(document.createElement("canvas"), { width: 320, height: 180 }), ctx = canvas.getContext("2d");
      const levels = [];
      for (const t of [1.5, v.duration / 2, v.duration - 1.5]) {
        v.currentTime = t;
        await new Promise((resolve) => { v.onseeked = resolve; });
        ctx.drawImage(v, 0, 0, 320, 180);
        const px = ctx.getImageData(0, 0, 320, 180).data;
        let sum = 0;
        for (let k = 0; k < px.length; k += 4) sum += (px[k] + px[k + 1] + px[k + 2]) / 3;
        levels.push(sum / (px.length / 4));
      }
      log(`rendu : luminosité ${levels.map((l) => l.toFixed(0)).join(" ")}`);
      // Image du milieu, avec titre et compteurs, dans le journal (vérification à l'œil)
      const big = Object.assign(document.createElement("canvas"), { width: 960, height: 540 });
      v.currentTime = 6;
      await new Promise((resolve) => { v.onseeked = resolve; });
      big.getContext("2d").drawImage(v, 0, 0, 960, 540);
      log(`IMAGE rendu ${big.toDataURL("image/jpeg", 0.85)}`);
      expect("rendu : images non noires", levels.every((l) => l > 30), levels.join(" "));
    }
    expect("aucune question", asked === 0, asked);
    expect("aucune photo lue à rebours (photos vers l'avant d'abord)", !plan?.reversed, plan?.reversed);
    expect("parcours resté sur la D906", !off, off);
    expect("repères sans doublon (départ, arrivée, une étape au plus)", doc.querySelectorAll(".repere-requete.etape").length <= 1
      && !doc.querySelector(".repere-requete.arret"), marks());
  } catch (error) {
    fail("exception : " + error + " " + (error.stack || "").split("\n")[1]);
  }
  await fin();
})();
</script>
