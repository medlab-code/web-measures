<!-- Case « Filtrage anisotrope » des réglages : cochée, les textures du panorama passent en
     anisotropie avec mipmaps ; décochée, elles reviennent au filtre d'origine.
     Lancer comme tests/navigateur.html (voir CLAUDE.md). -->
<script>try { localStorage.clear(); } catch {}</script>
<iframe id="f" src="../index.html" style="width:1400px;height:900px;border:0"></iframe>
<script>
const log = (t) => fetch("/journal", { method: "POST", body: String(t) }).catch(() => {});
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let failures = 0, checks = 0;
const expect = (what, ok, detail = "") => { checks++; if (!ok) { failures++; log("ÉCHEC " + what + " " + detail); } };
// Textures du panorama : { n, filtrées (anisotropie > 1 et mipmaps) }
function textures(psv) {
  const out = { n: 0, filtrees: 0 };
  psv.renderer.scene.traverse((o) => {
    for (const m of [].concat(o.material || [])) {
      const texs = [m.map, ...Object.values(m.uniforms || {}).map((u) => u?.value)];
      for (const t of texs) if (t?.isTexture && t.image) { out.n++; if (t.anisotropy > 1 && t.minFilter === 1008) out.filtrees++; }
    }
  });
  return out;
}
(async () => {
  const w = document.getElementById("f").contentWindow;
  try {
    const t0 = Date.now();
    while (!(w.mesures?.psv && w.mesures.map?.loaded?.())) { if (Date.now() - t0 > 120000) throw new Error("visionneuse"); await sleep(250); }
    const doc = w.document;
    doc.querySelector("#reglages-defaut")?.close();
    const psv = w.mesures.psv;
    const t1 = Date.now();
    while (!textures(psv).n && Date.now() - t1 < 40000) await sleep(250);
    const box = doc.querySelector("#anisotrope");
    expect("case décochée par défaut", box && !box.checked);
    log("avant : " + JSON.stringify(textures(psv)));
    expect("pas de filtrage par défaut", textures(psv).filtrees === 0);
    box.click();
    await sleep(1500);
    const on = textures(psv);
    log("cochée : " + JSON.stringify(on));
    expect("textures filtrées une fois cochée", on.n > 0 && on.filtrees === on.n);
    expect("choix gardé", w.localStorage.getItem("web-measures/anisotrope") === "1");
    box.click();
    await sleep(1500);
    const off = textures(psv);
    log("décochée : " + JSON.stringify(off));
    expect("filtre d'origine rétabli", off.filtrees === 0);
    log(failures ? `ERREUR ${failures} contrôle(s) sur ${checks} en échec` : `contrôles : ${checks} réussis`);
  } catch (e) { log("exception " + e); }
  log("FIN");
})();
</script>
