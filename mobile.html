<!-- Version mobile (consultation) : photo en haut, carte en bas, recherche au-dessus ; sans le calcul (Pyodide).
     Reprend les scripts de la page principale (carte, lieux, recherche, requêteur, cartouches des captures). -->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mesures Panoramax</title>
  <link rel="icon" type="image/svg+xml" href="src/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/latin-400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/latin-500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.3.0/latin-600.css">
  <link rel="stylesheet" href="src/style.css">
  <link rel="stylesheet" href="src/mobile.css">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <!-- Visionneuse officielle Panoramax : paquet CommonJS, dont la dernière ligne écrit dans `exports` -->
  <script>window.exports = {};</script>
  <script>  /* thème choisi sur la page principale (Réglages) */
    try { const t = localStorage.getItem("web-measures/theme"); if (t) document.documentElement.dataset.theme = t; } catch { /* sans stockage */ }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@panoramax/web-viewer@5.3.1/build/cjs/index_photoviewer.js"></script>
</head>
<body class="mobile">
  <div id="barre"></div>  <!-- recherche de lieux et requêteur route + PR (déplacés depuis la carte) -->
  <section id="vue">
    <p id="invite">Touchez le filaire orange de la carte pour choisir une photo.</p>
    <pnx-photo-viewer id="visionneuse" endpoint="https://api.panoramax.xyz/api" widgets="false"
                      url-parameters="false" keyboard-shortcuts="false" hidden></pnx-photo-viewer>
    <button id="capture" type="button" disabled title="Capture de la vue, avec l'étiquette de la parcelle visée"
            aria-label="Capture de la vue"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <p id="lieu" hidden></p>
  </section>
  <div id="poignee" role="separator" aria-orientation="horizontal" aria-label="Partage entre la photo et la carte"></div>
  <section id="carte">
    <a id="version-complete" href="index.html" onclick="try { localStorage.setItem('web-measures/version', 'complete'); } catch {}"
       title="Page principale : mesures, profils, vidéo ; choix gardé sur ce téléphone">Version complète</a>
    <button id="ouvrir-reglages" class="bouton-carte" type="button" aria-haspopup="dialog" aria-controls="reglages"
            title="Réglages : fond de carte, PR, cadastre, filtre des photos" aria-label="Réglages"><svg width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </section>
  <!-- Réglages de la carte, gardés comme sur la page principale (mêmes clés) -->
  <dialog id="reglages" aria-label="Réglages">
    <form method="dialog">
      <h2>Carte</h2>
      <label>Fond de carte
        <select id="fond"><option value="plan">Plan IGN</option><option value="ortho">Orthophoto</option>
          <option value="noms">Orthophoto avec noms</option>
          <option value="express">Ortho-express (année de la photo)</option>
          <option value="mnh">Modèle Numérique de Hauteur</option>
          <option value="ofm" title="Données OpenStreetMap, tuiles vectorielles d'OpenFreeMap">OpenFreeMap</option></select>
      </label>
      <label class="option">Filaire Panoramax <input id="filaire" type="checkbox" class="interrupteur"></label>
      <label class="option">Bornes des PR <input id="bornes" type="checkbox" class="interrupteur"></label>
      <label class="option">Cadastre et parcelle visée <input id="cadastre" type="checkbox" class="interrupteur"></label>
      <h2>Photos</h2>
      <label>Instance <select id="instance"><option value="">Toutes (méta-catalogue)</option></select></label>
      <label>Producteur <select id="producteur"><option value="">Tous</option></select></label>
      <label>Depuis le <input id="depuis" type="date"></label>
      <p class="aide">Filaire et photos ouvertes d'un appui. Mêmes réglages que la page principale.</p>
      <h2>Page</h2>
      <label class="option">Bouton « Version complète » sur la carte <input id="lien-complet" type="checkbox" class="interrupteur"></label>
      <p class="aide">Masqué, la page principale reste accessible ici :
        <a href="index.html" onclick="try { localStorage.setItem('web-measures/version', 'complete'); } catch {}">version complète</a>.</p>
      <button type="submit">Fermer</button>
    </form>
  </dialog>
  <p id="message" role="status" hidden></p>
  <script src="src/carte.js"></script>
  <script src="src/lieu.js"></script>
  <script src="src/recherche.js"></script>
  <script src="src/requeteur.js"></script>
  <script src="src/vignette.js"></script>
  <script src="src/mobile.js"></script>
</body>
</html>
